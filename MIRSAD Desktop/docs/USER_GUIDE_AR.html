"ar": "الراستر والمخرجات", "en": "Rasters and outputs"}, {"id": "support", "ar": "المساعدة والمساهمة", "en": "Support and contributing"}], "sections": [{"id": "start", "ar": "ابدأ هنا", "en": "Start here", "group": "getting-started", "ar_body": "<p>مرصاد <b>MIRSAD Desktop<\/b> تطبيق Windows مستقل لإعداد أطلس مناخي من محطات أو نقاط أو شبكة بيانات إقليمية، وإنتاج Excel وقواعد GIS وراستر وأطلس PDF. لا يحتاج ArcGIS أو تثبيت Python على جهاز التشغيل. هذا الدليل يصف وظائف إصدار التطوير <b>0.4.0.dev8<\/b> المتاحة فعلًا؛ وليس قائمة بخصائص مخططة.<\/p>\n<ol><li>اختر الأداة من قائمة أدوات المعالجة.<\/li><li>اضبط <b>المدخلات → المناخ → الراستر → المخرجات<\/b>.<\/li><li>ابدأ بنطاق صغير وفترة كاملة ودرجة الحرارة والأمطار للتحقق من المدخلات.<\/li><li>اضغط <b>تشغيل الأداة<\/b>، ثم راجع حالة المهمة ومجلد النتائج وملف manifest.json.<\/li><\/ol>\n<p>زر <b>تصدير النقاط<\/b> يصدر مواقع النقاط المختارة فقط؛ لا ينزّل بيانات مناخية ولا ينتج أطلسًا من تلقاء نفسه. لكل أداة مسودة إعدادات ونقاط مستقلة أثناء الجلسة. احتفظ بملفات العمل خارج مجلد البرنامج، واختر اسم مشروع جديد لكل تشغيل؛ لا يُستبدل مشروع موجود بصمت.<\/p>\n", "en_body": "<p><b>MIRSAD Desktop<\/b> is an independent Windows application for climate atlases from station locations, user points or a native regional climate grid. Outputs include Excel, GIS databases, rasters and PDF atlases. ArcGIS and a separate Python installation are not required. This manual describes implemented development version <b>0.4.0.dev8<\/b>, rather than planned features.<\/p>\n<ol><li>Select a geoprocessing tool.<\/li><li>Configure <b>Inputs → Climate → Raster → Outputs<\/b>.<\/li><li>Start with a small area, a complete period and Temperature/Precipitation to verify your inputs.<\/li><li>Choose <b>Run Tool<\/b>; inspect task status, the output directory and manifest.json.<\/li><\/ol>\n<p><b>Export Points<\/b> exports selected locations only; it does not download climate data or automatically create an atlas. Each tool keeps a separate working draft and point selection during the session. Store projects outside the application directory. Use a new project name for each run; existing projects are not silently overwritten.<\/p>\n"}, {"id": "workspace", "ar": "مساحة العمل والخريطة", "en": "Workspace and map", "group": "desktop", "ar_body": "<ul><li><b>قائمة الأدوات ومحتويات الخريطة:<\/b> الأدوات الرئيسية، الطبقات، الجداول والنتائج. انقر بزر الفأرة الأيمن على الطبقة لعرض نطاقها أو جدولها أو خصائصها وإزالتها من العرض. إزالة طبقة عرض لا تحذف ملفها.<\/li><li><b>التابات الوسطى:<\/b> الخريطة، الجدول، المهام، بيانات المدخل، عن مرصاد، ومعاينة أطلس PDF. استخدم أسهم شريط التابات إذا لم تتسع النافذة لها كلها.<\/li><li><b>لوحة الأداة:<\/b> المدخلات والمناخ والراستر والمخرجات. اسحب الفواصل لتغيير العرض؛ تُحفظ هندسة النافذة وترتيب اللوحات. من قائمة التطبيق يمكن إظهار اللوحات أو استعادة ترتيبها.<\/li><\/ul>\n<p>اسحب الخريطة للتحريك، واستخدم عجلة الفأرة أو +/− للتكبير. مجموعة التنقل تضم عرض نطاق البيانات والعالم. أيقونة الدبوس تُفعّل إضافة نقطة؛ انقر على الخريطة وأكمل بيانات النقطة، أو استخدم Esc للإلغاء. إحداثيات القراءة WGS84؛ إسقاط عرض البلاطات EPSG:3857، وهو مستقل عن إسقاط مخرجات التحليل.<\/p>\n<p>أيقونة الطبقات الصغيرة تفتح لوحة الخلفيات: صور Esri بالأسماء أو بدونها، الشوارع، الطبوغرافية، الرمادي الفاتح والداكن، OpenStreetMap، أو بدون خلفية. توضح اللوحة الاختيار الحالي ومصدره. اختيار خلفية أو النقر خارج اللوحة أو زر الإغلاق أو Esc يغلقها؛ فقدان التركيز وحده أثناء تصوير الشاشة لا يغلقها. الصور المصغرة توضح النمط وليست قياسات أو تنزيلات إضافية.<\/p>\n<p>مصدر الخلفية يظهر أسفل الخريطة. الخلفيات تحتاج إنترنت لتحميل البلاطات غير المخزنة مؤقتًا؛ عرض النقاط المحلية يعمل بدونها. اختيار Basemap لا يغير Provider المناخي. لا توجد خلفيات Google/Azure التي تحتاج API key. يتبع إطار البرنامج الثيم الفاتح/الداكن؛ ألوان الخريطة نفسها تتبع الخلفية المختارة.<\/p>\n", "en_body": "<ul><li><b>Tools and Contents:<\/b> choose a tool and inspect layers, tables and outputs. A layer context menu offers zoom, table/properties and removal from the view. Removing a display layer does not delete its file.<\/li><li><b>Center tabs:<\/b> Map, Attribute Table, Tasks, Input Info, About and PDF Atlas Preview. Use the tab bar arrows when space is limited.<\/li><li><b>Tool inspector:<\/b> Inputs, Climate, Raster and Outputs. Drag splitters to resize panels; window geometry/layout are saved. The application menu can toggle panels or restore the layout.<\/li><\/ul>\n<p>Drag to pan; scroll or use +/− to zoom. Navigation controls also fit the data and show the world. The pin icon enables point placement: click the map and complete the point dialog, or press Esc to cancel. The coordinate readout is WGS84; tile display uses EPSG:3857, independently of analysis/output CRS.<\/p>\n<p>The small layers icon opens the basemap panel: Esri imagery with/without labels, streets, topographic, light/dark gray, OpenStreetMap or no basemap. The panel identifies the current style and provider. Selecting a style, clicking outside, Close or Esc dismisses it; focus loss alone while taking a screenshot does not. Thumbnails illustrate styles and are not measurements or additional tile downloads.<\/p>\n<p>Attribution remains below the map. New basemap tiles require internet; local points can be displayed without a basemap. A basemap does not select a climate provider. API-key Google/Azure basemaps are absent. Application chrome follows light/dark mode; the geographic map follows the selected basemap style.<\/p>\n"}, {"id": "tools", "ar": "الأدوات الثلاث ومساراتها", "en": "The three tools and workflows", "group": "toolbox", "ar_body": "<table><tr><th>الأداة<\/th><th>متى تستخدمها؟<\/th><\/tr><tr><td>Ground Weather Stations Climate Atlas Generator<\/td><td>اختر مواقع من كتالوج المحطات حسب الإقليم والدولة والبحث، ثم حدد المحطات المطلوبة. يتاح Hybrid أو Open-Meteo أو NASA POWER.<\/td><\/tr><tr><td>Spatial Climate Atlas Generator<\/td><td>لإحداثيات نقاطك: استيراد ملف، إدخال إحداثيات، وضع نقاط على الخريطة، أو توليد شبكة نقاط داخل مضلع. يتاح ERA5 المستقل وهجين ERA5 ثم NASA. يمكن تنزيل بيانات عند هذه الإحداثيات أو استيفاء أعمدة رقمية موجودة بدون تنزيل.<\/td><\/tr><tr><td>Grid Raster Climate Atlas<\/td><td>لتحميل شبكة NASA POWER الإقليمية الشهرية الأصلية. عرّف AOI التنزيل ثم قناع قص الدراسة عند الحاجة. ليست سلسلة طلبات نقاط مولّدة، وليست تنزيلًا يوميًا أو تنزيل ERA5 إقليميًا.<\/td><\/tr><\/table>\n<p><b>التنزيل والجداول:<\/b> بيانات مناخية محسوبة وExcel وFileGDB وGeoPackage. <b>المسار الكامل:<\/b> أضف الاستيفاء والراستر والأطلس بتفعيل الخيار وضبط تبويب الراستر. إتاحة تبويب الراستر للنقاط والمحطات لا تشغّل الإخراج تلقائيًا. <b>الحقول الموجودة:<\/b> اختر نقاطًا مستوردة تحمل سمات رقمية وحدد الأعمدة المراد استيفاؤها؛ لا يتطلب هذا المسار Provider.<\/p>\n<p>وجود محطة في الدليل لا يعني توفر رصد لها في كل السنوات. نقاط المستخدم والشبكات المولدة لا تصبح محطات NOAA لمجرد وجودها في نفس المنطقة؛ يستخدم Hybrid لها إعادة التحليل/POWER إذا لم تتوفر هوية رصد USAF/WBAN صحيحة.<\/p>\n", "en_body": "<table><tr><th>Tool<\/th><th>When to use it<\/th><\/tr><tr><td>Ground Weather Stations Climate Atlas Generator<\/td><td>Choose catalogue station locations by region, country and search, then explicitly select stations. NOAA Only, ERA5 Standalone, station/point Hybrid, legacy Open-Meteo and NASA POWER are available.<\/td><\/tr><tr><td>Spatial Climate Atlas Generator<\/td><td>Use your coordinates: import a file, enter coordinates, place points on the map, or generate a point grid inside a polygon. Download climate at those points or interpolate existing numeric attributes without a download.<\/td><\/tr><tr><td>Grid Raster Climate Atlas<\/td><td>Read the implemented NASA POWER, CHIRPS or CHELSA native monthly regional grid. Set the download AOI and optionally a separate study clipping mask. This is not a set of generated point requests, a daily regional workflow or an ERA5 regional download.<\/td><\/tr><\/table>\n<p><b>Data workflow:<\/b> calculated climate records, Excel, FileGDB and GeoPackage. <b>Full pipeline:<\/b> enable atlas output and configure Raster to add interpolation, raster files and the atlas. An accessible Raster tab does not enable raster generation by itself. <b>Existing fields:<\/b> select imported points with numeric attributes and check the fields to interpolate; this path does not require a provider.<\/p>\n<p>A catalogue location does not guarantee observations for every year. User/generated points do not become NOAA stations merely by location; Hybrid uses reanalysis/POWER when a valid USAF/WBAN observation identity is absent.<\/p>\n"}, {"id": "inputs", "ar": "المدخلات والتحديد والإحداثيات", "en": "Inputs, selection and coordinates", "group": "desktop", "ar_body": "<ol><li>من <b>Add Data / Ctrl+O<\/b> اختر FileGDB أو GeoPackage أو Shapefile أو GeoJSON أو SQLite أو GeoTIFF أو Excel/CSV/TSV. افتح مجلد .gdb كقاعدة بيانات ثم اختر طبقته.<\/li><li>حدد دور البيانات: نقاط عمل، مضلع حدود الدراسة/قناع قص، أو طبقة مرجعية للعرض. الخطوط والصور المعروضة ليست نقاط إدخال مناخية تلقائيًا.<\/li><li>في الجداول عيّن عمود الكود والاسم وX وY. X هو الطول/الشرقيات، وY هو العرض/الشماليات. في Excel تُقرأ الورقة النشطة للاستيراد؛ جهّز صف عناوين فريدًا بلا خلايا مدمجة.<\/li><li>حدد الإسقاط الفعلي: إحداثيات درجات WGS84 ليست إحداثيات UTM مترية. عند غياب CRS يلزم تعيينه؛ CRS المخزن يُقرأ لتجنب إعادة تعريفه دون قصد.<\/li><li>ضع علامة على النقاط المطلوبة. <b>تحديد المعروض<\/b> يحدد الصفوف المفلترة الحالية، وليس كل العالم. يبقى التحديد ثابتًا عند البحث والفرز وتبديل اللغة.<\/li><\/ol>\n<p>لشبكة النقاط، حمّل حدودًا مضلعة وحدد مسافة بالمتر ثم ولّد الشبكة. قلل مساحة الدراسة أو زد المسافة لتقليل عدد النقاط. هذه الشبكة تختلف عن خلايا NASA الأصلية في أداة Grid Raster. راجع خيار «النقاط داخل الحدود فقط» قبل التشغيل.<\/p>\n<p>تُحفظ الهوية بأكواد نصية وأصفارها الأولى. USAF وحده ليس فريدًا: يحتفظ الكتالوج بـWBAN والموقع وStation_Key. تبقى Source_Country منفصلة عن سياسة عرض الدولة. حالات المطابقة المرجعية أو الفحص الجغرافي لا تعني تحققًا ميدانيًا؛ لا يصحح البرنامج الإحداثيات اعتمادًا على اسم الدولة.<\/p>\n", "en_body": "<ol><li>Use <b>Add Data / Ctrl+O<\/b> for FileGDB, GeoPackage, Shapefile, GeoJSON, SQLite, GeoTIFF or Excel/CSV/TSV. Open a .gdb directory as a database and choose its layer.<\/li><li>Choose the role: working points, polygon study boundary/clipping mask, or display context. Displayed lines/images do not automatically become climate input points.<\/li><li>For tables, map ID, name, X and Y columns. X is longitude/easting; Y is latitude/northing. Excel point import reads the active worksheet; prepare unique headers without merged cells.<\/li><li>Specify the actual CRS: WGS84 degrees are not UTM meters. Missing CRS must be assigned; stored CRS is read rather than silently redefined.<\/li><li>Check the required points. <b>Select Visible<\/b> selects current filtered rows, not every station worldwide. Selection survives search, sorting and language changes.<\/li><\/ol>\n<p>To generate a point grid, load a polygon, set spacing in meters and generate. Reduce area or increase spacing to reduce point count. This grid differs from native NASA cells in Grid Raster. Review “Points inside boundary only” before running.<\/p>\n<p>Keep identifiers as text with leading zeros. USAF alone is not unique: the catalogue retains WBAN, location and Station_Key. Source_Country is separate from display policy. Reference agreement/geographic QA is not field verification; country names do not trigger coordinate corrections.<\/p>\n"}, {"id": "providers", "ar": "المصادر والتغطية والدقة والدخول", "en": "Sources, coverage, resolution and sign-in", "group": "science", "ar_body": "<p><b>الافتراضي Auto:<\/b> أدق منتج مناسب لكل متغير داخل المصدر المختار وللفترة كاملة. الحرارة والرطوبة والندى من ERA5-Land عند توفره، وبقية متغيرات Open-Meteo من ERA5. إذا بدأت الفترة قبل 1950 يستخدم ERA5 طوالها. «إعدادات متقدمة» تتيح اختيار نموذج يدوي ثابت؛ لا تُخترع درجات دقة للمصدر ذي الشبكة الثابتة. ملخص الواجهة يوضح الخطة، وSource_Resolution وملفات البيانات الخام تسجل المنتج المستخدم فعليًا. تصغير بكسل الإخراج لا يزيد دقة المصدر.<\/p><p><b>Need Sign In:<\/b> CDS يحتاج رمز API شخصيًا وقبول شروط المنتج، وIMERG يحتاج اسم مستخدم وكلمة مرور NASA Earthdata مع إجازة GES DISC. أدخل بياناتك في الخانات أسفل إعدادات المناخ؛ لا تدخل حساب المطور. تظل البيانات في الذاكرة وتُنقل إلى العامل عبر قناة stdin؛ لا تحفظ في المشروع أو ملفات المهمة أو السجلات. المساران منفذان واختبرت تحويلاتهما؛ لم يُثبت التنزيل بحساب فعلي بعد.<\/p><p><b>المحطات:<\/b> NOAA GSOD يحتاج USAF وWBAN والموقع. GHCN يحتاج GHCN_ID صريحًا في طبقة المحطات/النقاط الداعمة المستوردة؛ لا يُستبدل المعرف ولا أقرب محطة آليًا. المصادر الشبكية تعمل عند نقاط عادية وعند مواقع المحطات دون أن تصبح أرصاد محطة.<\/p><h3>NASA POWER<\/h3><p>Meteorology 1981; radiation 1984; UV 2001 → Latest published data, variable-dependent<br>0.5 x 0.625 degree meteorology; 1 x 1 degree radiation/cloud | Daily points; monthly regional<br>Global | points, stations, regional<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, T2MDEW, TS, PRECTOTCORR, RH2M, CLOUD_AMT, PS, SLP, WS10M, WD10M, ALLSKY_SFC_SW_DWN, ALLSKY_SFC_UV_INDEX<\/p><p>شبكات ثابتة حسب المتغير؛ تصغير بكسل الإخراج لا يزيد دقة معلومات المصدر.<\/p><p><a href=\"https://power.larc.nasa.gov/docs/\">Official source<\/a><\/p><h3>Open-Meteo ERA5 / ERA5-Land<\/h3><p>ERA5 1940; Land 1950 → Latest archive, typically delayed<br>Auto: Land 0.1 degree or ERA5 0.25 degree per variable and full interval | Daily<br>Global; Land variables require valid land cells | points, stations<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, PRECTOTCORR, ALLSKY_SFC_SW_DWN, RH2M, T2MDEW, PS, SLP, WS10M, WD10M, CLOUD_AMT<\/p><p>Auto يستخدم Land للحرارة والرطوبة والندى، وERA5 لبقية المتغيرات المدعومة. للفترة التي تبدأ قبل 1950 يستخدم ERA5 كاملًا. الوضع المستقل لا يستكمل NASA؛ المسار القديم والهجين لهما سياسة معلنة منفصلة.<\/p><p><a href=\"https://open-meteo.com/en/docs/historical-weather-api\">Official source<\/a><\/p><h3>NOAA GSOD<\/h3><p>General archive 1929; station/element-specific → Station/year-specific<br>Station observations | Daily summaries<br>Exact catalogue station | stations<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, T2MDEW, PRECTOTCORR, PS, SLP, WS10M<\/p><p>USAF وWBAN والموقع معًا؛ ليس ISD الساعي ولا GHCN. الهجين ينهي NOAA ثم ERA5 ثم NASA ثم Gap Fill الشهري.<\/p><p><a href=\"https://www.ncei.noaa.gov/data/global-summary-of-the-day/\">Official source<\/a><\/p><h3>Copernicus CDS ERA5-Land (Need Sign In)<\/h3><p>1950-01 → Latest published CDS ARCO data<br>0.1 degree API grid | Daily<br>Global land | points, stations<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, T2MDEW, RH2M, TS, PS, WS10M, WD10M, PRECTOTCORR, ALLSKY_SFC_SW_DWN<\/p><p>Need Sign In: رمز CDS الشخصي وقبول شروط المنتج. ARCO ساعي منزوع التراكم بالفعل؛ اليوم يتطلب 24 ساعة UTC. العظمى والصغرى من العينات الساعية، والرطوبة مشتقة من الحرارة والندى. الخدمة ترجع كامل الأرشيف لكل متغير ثم تُرشح الفترة محليًا بحد 64MB. المسار منفذ واختُبر بروتوكوله وتحويلاته؛ لم يُختبر بحساب حقيقي.<\/p><p><a href=\"https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land-timeseries\">Official source<\/a><\/p><h3>NASA IMERG V07 Daily Final (Need Sign In)<\/h3><p>File-specific GES DISC catalogue → Latest Final run (delayed)<br>0.1 degree | Daily<br>Global grid; missing cells retained | points, stations<\/p><p><b>Variables:<\/b> PRECTOTCORR<\/p><p>Need Sign In: حساب NASA Earthdata وإجازة GES DISC. أمطار Final اليومية بوحدة mm/day؛ لا ضرب ثانٍ في 24. المسار منفذ؛ التنزيل بحساب حقيقي لم يُختبر بعد.<\/p><p><a href=\"https://disc.gsfc.nasa.gov/datasets/GPM_3IMERGDF_07/summary\">Official source<\/a><\/p><h3>CHIRPS v3 (Monthly Rainfall)<\/h3><p>1981-01 → Latest final month<br>0.05 degree | Monthly<br>Land 60S to 60N | points, stations, regional<\/p><p><b>Variables:<\/b> PRECTOTCORR<\/p><p>أمطار شهرية نهائية؛ لم يُنفذ تنزيل CHIRPS اليومي. الصفر صحيح والمفقود NULL.<\/p><p><a href=\"https://www.chc.ucsb.edu/data/chirps3\">Official source<\/a><\/p><h3>TerraClimate v1.1 (Monthly Climate)<\/h3><p>1950-01 → Latest published month; inspected from time axis<br>1/24 degree (~4 km) | Monthly<br>Global land | points, stations<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, PRECTOTCORR, WS10M, ALLSKY_SFC_SW_DWN<\/p><p>الإصدار 1.1 مستقل عن 1.0. قراءة CF scale/offset من كل متغير. متوسط الحرارة مشتق من (العظمى+الصغرى)/2. المطر مجموع شهري.<\/p><p><a href=\"https://www.climatologylab.org/terraclimate.html\">Official source<\/a><\/p><h3>CHELSA v2.1 (Monthly Climate)<\/h3><p>1979/1980; variable-specific catalogue → 2018/2021; variable-specific catalogue<br>30 arcsec (~1 km) | Monthly<br>Global land | points, stations, regional<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, PRECTOTCORR, WS10M, RH2M, CLOUD_AMT<\/p><p>تُقرأ الوحدات والتحويل من الملف نفسه؛ مدى التواريخ يختلف حسب المتغير. الإشعاع الشمسي مستبعد حتى حل تعارض بيانات وحدته. الملف غير المتاح يبقى NULL.<\/p><p><a href=\"https://www.chelsa-climate.org/datasets/chelsa_monthly\">Official source<\/a><\/p><h3>MODIS MOD11A2 (Daytime Surface Temperature)<\/h3><p>2000-02 → Available site dates from API<br>Nominal 1 km | 8-day clear-sky composites; explicit monthly aggregation<br>Global land | points, stations<\/p><p><b>Variables:<\/b> TS<\/p><p>حرارة سطح نهارية، وليست حرارة هواء. تجميع شهري موزون بأيام السماء الصافية المقبولة بالجودة. لا أيام رصد مصطنعة ولا فرق سطح/هواء دون حرارة هواء.<\/p><p><a href=\"https://modis.ornl.gov/data/modis_webservice.html\">Official source<\/a><\/p><h3>MODIS MOD11A2 (Nighttime Surface Temperature)<\/h3><p>2000-02 → Available site dates from API<br>Nominal 1 km | 8-day clear-sky composites; explicit monthly aggregation<br>Global land | points, stations<\/p><p><b>Variables:<\/b> TS<\/p><p>حرارة سطح ليلية منفصلة عن النهارية، بنفس فحص الجودة والسحب. نسبة التغطية تعكس الأيام الصافية المقبولة.<\/p><p><a href=\"https://modis.ornl.gov/data/modis_webservice.html\">Official source<\/a><\/p><h3>NOAA GHCN-Daily (Station Observations Only)<\/h3><p>Station/element-specific → Station/element-specific<br>Station location | Daily<br>Catalogue stations only | stations<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, PRECTOTCORR<\/p><p>يلزم حقل GHCN_ID صريح من 11 حرفًا وإحداثيات مطابقة. لا تحويل تلقائي من USAF/WBAN ولا أقرب محطة. قيم QFLAG غير الفارغة تستبعد؛ TAVG غير الموجود لا يُخترع.<\/p><p><a href=\"https://www.ncei.noaa.gov/products/land-based-station/global-historical-climatology-network-daily\">Official source<\/a><\/p>\n", "en_body": "<p><b>Auto is the default:<\/b> choose the finest suitable product per variable within the selected provider and for the whole requested interval. Supported temperature, RH and dewpoint use ERA5-Land; other supported Open-Meteo variables use ERA5. Intervals beginning before 1950 use ERA5 throughout. Advanced settings allow a fixed manual model. Fixed-grid providers do not acquire fictional resolution choices. The UI previews the plan; Source_Resolution and raw records report the actual product. Smaller output pixels do not add source detail.<\/p><p><b>Need Sign In:<\/b> CDS requires a personal API token and accepted dataset terms. IMERG requires NASA Earthdata username/password and GES DISC authorization. Enter your own credentials below the climate settings. Credentials stay in memory and pass to workers via stdin; they are absent from project, job and log files. Both adapters and conversion/protocol tests are implemented; live authenticated end-to-end access remains unverified.<\/p><p><b>Stations:<\/b> NOAA GSOD requires USAF/WBAN/location. GHCN requires explicit GHCN_ID in an imported supporting station/point layer. No automatic identifier or nearest-station substitution is made. Gridded sources work at arbitrary points and station locations without becoming station observations.<\/p><h3>NASA POWER<\/h3><p>Meteorology 1981; radiation 1984; UV 2001 → Latest published data, variable-dependent<br>0.5 x 0.625 degree meteorology; 1 x 1 degree radiation/cloud | Daily points; monthly regional<br>Global | points, stations, regional<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, T2MDEW, TS, PRECTOTCORR, RH2M, CLOUD_AMT, PS, SLP, WS10M, WD10M, ALLSKY_SFC_SW_DWN, ALLSKY_SFC_UV_INDEX<\/p><p>Fixed variable-specific grids; smaller output pixels do not increase source information resolution.<\/p><p><a href=\"https://power.larc.nasa.gov/docs/\">Official source<\/a><\/p><h3>Open-Meteo ERA5 / ERA5-Land<\/h3><p>ERA5 1940; Land 1950 → Latest archive, typically delayed<br>Auto: Land 0.1 degree or ERA5 0.25 degree per variable and full interval | Daily<br>Global; Land variables require valid land cells | points, stations<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, PRECTOTCORR, ALLSKY_SFC_SW_DWN, RH2M, T2MDEW, PS, SLP, WS10M, WD10M, CLOUD_AMT<\/p><p>Auto uses Land for temperature, RH and dewpoint and ERA5 for other supported variables. An interval beginning before 1950 uses ERA5 throughout. Standalone never supplements NASA; legacy and Hybrid retain explicitly separate policies.<\/p><p><a href=\"https://open-meteo.com/en/docs/historical-weather-api\">Official source<\/a><\/p><h3>NOAA GSOD<\/h3><p>General archive 1929; station/element-specific → Station/year-specific<br>Station observations | Daily summaries<br>Exact catalogue station | stations<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, T2MDEW, PRECTOTCORR, PS, SLP, WS10M<\/p><p>USAF, WBAN and location are required together. This is not hourly ISD or GHCN. Hybrid finishes NOAA, then ERA5, then NASA, then optional monthly Gap Fill.<\/p><p><a href=\"https://www.ncei.noaa.gov/data/global-summary-of-the-day/\">Official source<\/a><\/p><h3>Copernicus CDS ERA5-Land (Need Sign In)<\/h3><p>1950-01 → Latest published CDS ARCO data<br>0.1 degree API grid | Daily<br>Global land | points, stations<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, T2MDEW, RH2M, TS, PS, WS10M, WD10M, PRECTOTCORR, ALLSKY_SFC_SW_DWN<\/p><p>Need Sign In: personal CDS token and accepted dataset terms. ARCO is already hourly de-accumulated; a day requires 24 UTC hours. Max/min use hourly samples; RH is derived from temperature/dewpoint. The service returns the full archive per variable, filtered locally with a 64 MB limit. Protocol/conversion tests pass; authenticated end-to-end access remains unverified.<\/p><p><a href=\"https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land-timeseries\">Official source<\/a><\/p><h3>NASA IMERG V07 Daily Final (Need Sign In)<\/h3><p>File-specific GES DISC catalogue → Latest Final run (delayed)<br>0.1 degree | Daily<br>Global grid; missing cells retained | points, stations<\/p><p><b>Variables:<\/b> PRECTOTCORR<\/p><p>Need Sign In: NASA Earthdata account with GES DISC authorization. Final daily precipitation is mm/day, with no second multiplication by 24. Adapter implemented; live authenticated download remains unverified.<\/p><p><a href=\"https://disc.gsfc.nasa.gov/datasets/GPM_3IMERGDF_07/summary\">Official source<\/a><\/p><h3>CHIRPS v3 (Monthly Rainfall)<\/h3><p>1981-01 → Latest final month<br>0.05 degree | Monthly<br>Land 60S to 60N | points, stations, regional<\/p><p><b>Variables:<\/b> PRECTOTCORR<\/p><p>Final monthly rainfall only; daily CHIRPS ingestion is not implemented. Zero is valid; missing stays NULL.<\/p><p><a href=\"https://www.chc.ucsb.edu/data/chirps3\">Official source<\/a><\/p><h3>TerraClimate v1.1 (Monthly Climate)<\/h3><p>1950-01 → Latest published month; inspected from time axis<br>1/24 degree (~4 km) | Monthly<br>Global land | points, stations<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, PRECTOTCORR, WS10M, ALLSKY_SFC_SW_DWN<\/p><p>v1.1 is separate from v1.0. CF scale/offset are read per variable. Mean temperature is (tmax+tmin)/2. Rainfall is a monthly total.<\/p><p><a href=\"https://www.climatologylab.org/terraclimate.html\">Official source<\/a><\/p><h3>CHELSA v2.1 (Monthly Climate)<\/h3><p>1979/1980; variable-specific catalogue → 2018/2021; variable-specific catalogue<br>30 arcsec (~1 km) | Monthly<br>Global land | points, stations, regional<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, PRECTOTCORR, WS10M, RH2M, CLOUD_AMT<\/p><p>Units/scaling are validated from each file; dates vary by variable. Solar radiation is excluded pending conflicting unit metadata. Unavailable files stay NULL.<\/p><p><a href=\"https://www.chelsa-climate.org/datasets/chelsa_monthly\">Official source<\/a><\/p><h3>MODIS MOD11A2 (Daytime Surface Temperature)<\/h3><p>2000-02 → Available site dates from API<br>Nominal 1 km | 8-day clear-sky composites; explicit monthly aggregation<br>Global land | points, stations<\/p><p><b>Variables:<\/b> TS<\/p><p>Daytime surface temperature, not air temperature. Monthly estimates weight quality-accepted clear-sky days. No synthetic daily observations or surface-air differences without air data.<\/p><p><a href=\"https://modis.ornl.gov/data/modis_webservice.html\">Official source<\/a><\/p><h3>MODIS MOD11A2 (Nighttime Surface Temperature)<\/h3><p>2000-02 → Available site dates from API<br>Nominal 1 km | 8-day clear-sky composites; explicit monthly aggregation<br>Global land | points, stations<\/p><p><b>Variables:<\/b> TS<\/p><p>Nighttime surface temperature stays separate from daytime, with the same quality/cloud screening. Coverage reflects accepted clear-sky days.<\/p><p><a href=\"https://modis.ornl.gov/data/modis_webservice.html\">Official source<\/a><\/p><h3>NOAA GHCN-Daily (Station Observations Only)<\/h3><p>Station/element-specific → Station/element-specific<br>Station location | Daily<br>Catalogue stations only | stations<\/p><p><b>Variables:<\/b> T2M, T2M_MAX, T2M_MIN, PRECTOTCORR<\/p><p>Requires an explicit 11-character GHCN_ID and matching coordinates. No USAF/WBAN conversion or nearest-station substitution. Nonblank QFLAG values are excluded; absent TAVG is not invented.<\/p><p><a href=\"https://www.ncei.noaa.gov/products/land-based-station/global-historical-climatology-network-daily\">Official source<\/a><\/p>\n"}, {"id": "hybrid", "ar": "تتابع Hybrid وملء الفجوات", "en": "Hybrid stages and gap filling", "group": "science", "ar_body": "<p>التتابع التالي لهجين المحطات. هجين النقاط يبدأ من ERA5، والمسارات المستقلة تنفذ المصدر المحدد وحده. تبقى جميع المؤشرات قابلة للاختيار؛ غياب اعتماديات مؤشر ينتج NULL وحالة جودة واضحة.<\/p><ol><li>يُنهي NOAA لكل المحطات والسنوات المطلوبة أولًا.<\/li><li>يحصر القيم المفقودة حسب المحطة والمتغير واليوم، ثم ينهي ERA5 المختار لكل المحطات التي تحتاجه.<\/li><li>يحصر المتبقي ويستخدم NASA POWER؛ لا يستبدل قيمة صحيحة من مصدر أعلى أولوية.<\/li><li>يجمع الأيام المكتملة إلى شهور، ثم يطبق Gap Fill الشهري المختار، ثم يحسب المؤشرات.<\/li><\/ol>\n<p>يُحفظ كل طلب مكتمل ليستفاد منه بعد الإلغاء أو إعادة التشغيل بنفس الإعدادات. عدم وجود ملف NOAA (404) يختلف عن فشل الاتصال. يُعاد طلب الفشل عند إعادة التشغيل، وتبقى البيانات الخام وعلامات الجودة ومصدر كل قيمة. عند اختلاف إحداثيات رصد NOAA عن الموقع المختار بأكثر من 0.05° تُستبعد السجلات ويُسجل السبب دون نقل المحطة.<\/p>\n<table><tr><th>الطريقة<\/th><th>التصرف وحدوده<\/th><\/tr><tr><td>No Fill<\/td><td>تبقى الخلايا المفقودة NULL.<\/td><\/tr><tr><td>Climatological Month Mean<\/td><td>متوسط نفس الشهر عبر السنوات المتاحة، مع الرجوع إلى متوسط المحطة العام عند تعذر ذلك وفق المحرك الحالي. ليس بالضرورة خط الأساس 1991–2020.<\/td><\/tr><tr><td>Linear + Boundary<\/td><td>استيفاء زمني بين القيم الشهرية؛ أطراف السلسلة قد تستخدم أقرب قيمة متاحة. لا يمثل رصدًا جديدًا.<\/td><\/tr><tr><td>Spatial IDW<\/td><td>منفذ كاستكمال شهري شبكي في Hybrid: حتى 3 محطات مانحة أصلية وبوزن عكسي للمسافة. تُسجل هوياتها ومسافاتها؛ قد تكون بعيدة، فراجع ملاءمتها المناخية. لا يعاد استخدام تقديرات كمانحين.<\/td><\/tr><\/table>\n<p>الاستكمال الزمني الحالي يقتصر على متغيرات المتوسطات؛ لا يملأ المطر أو اتجاه الرياح تلقائيًا. الاستكمال المكاني الصريح في Hybrid قد يقدّر المطر الشهري لكنه لا يقدّر اتجاه الرياح. تنفيذ Spatial هنا يشمل مسارات Hybrid وNOAA وERA5 المستقل الجديدة، بعد انتهاء تنزيل المصادر المختارة فقط. التقدير الشهري اختياري ومسجل منفصلًا ولا ينشئ رصدًا يوميًا أو يستدعي مصدرًا آخر؛ اختر No Fill لترك الأشهر المفقودة NULL. مسارا NASA وOpen-Meteo القديمان والإقليمي لهما معالجة منفصلة. قياسات اليوم والتغطية الخام تبقى كما هي بعد تقدير خلية شهرية. افحص Gap_Filled_Months وملفات monthly-estimates وStatus معًا؛ القيم المقدّرة ليست قياسات محطة.<\/p>\n", "en_body": "<p>The sequence below is station Hybrid. Any-point Hybrid begins at ERA5; standalone runs only the selected source. All modules remain selectable; absent dependencies produce NULL with explicit quality status.<\/p><ol><li>Finish NOAA for every requested station/year first.<\/li><li>Inventory missing station-variable-day cells, then finish the selected ERA5 model for the stations that need it.<\/li><li>Use NASA POWER for remaining gaps; never replace valid higher-priority data.<\/li><li>Aggregate complete days into months, apply selected monthly Gap Fill, then calculate indices.<\/li><\/ol>\n<p>Completed request checkpoints can be reused after cancellation or a rerun with the same settings. A missing NOAA file (404) differs from a connection failure; failed requests are retried on rerun. Raw values, quality flags and per-value sources remain available. NOAA records whose coordinates differ from the selected location by more than 0.05° are excluded with a reason, without moving the station.<\/p>\n<table><tr><th>Method<\/th><th>Behavior and limits<\/th><\/tr><tr><td>No Fill<\/td><td>Keep missing cells NULL.<\/td><\/tr><tr><td>Climatological Month Mean<\/td><td>Mean of the same calendar month across available years, falling back to the overall station mean under the current kernel. This is not necessarily the 1991–2020 baseline.<\/td><\/tr><tr><td>Linear + Boundary<\/td><td>Interpolate monthly values in time; boundary gaps can use the nearest available value. These are estimates.<\/td><\/tr><tr><td>Spatial IDW<\/td><td>Implemented as network monthly completion in Hybrid: up to 3 original donor stations with inverse-distance weights. Donor keys/distances are recorded; inspect climate relevance when donors are distant. Estimated values are not reused as donors.<\/td><\/tr><\/table>\n<p>Temporal filling currently applies to mean-type variables; it does not automatically fill precipitation or wind direction. Explicit Hybrid spatial mode can estimate monthly rainfall, but not wind bearings. This spatial implementation also serves the new standalone NOAA/ERA5 paths after only the selected sources finish. Optional monthly estimates are recorded separately, never create daily observations and never fetch another provider. Select No Fill to retain missing months as NULL. Legacy NASA/Open-Meteo and regional paths retain separate monthly handling. Monthly estimates do not create daily observations or improve raw daily coverage. Read Gap_Filled_Months, monthly-estimates files and Status together; estimates are not station measurements.<\/p>\n"}, {"id": "modules", "ar": "العناصر والنماذج الـ19", "en": "All 19 module groups", "group": "science", "ar_body": "<p>هناك 11 مجموعة أساسية و8 مجموعات مشتقة. الرموز أدناه أسماء المتغيرات الخام لتتبع الاعتماديات، وليست خيارات مصادر إضافية. الوحدات المعروضة افتراضية وقد تتغير بوحدات الإخراج.<\/p><table><tr><th>العنصر<\/th><th>ما ينتجه<\/th><th>الاعتماديات والوحدة المعتادة<\/th><\/tr><tr><td>درجة حرارة الهواء<br>Temperature<\/td><td>متوسط الحرارة ومتوسط العظمى والصغرى والمدى الحراري.<\/td><td dir=\"ltr\">T2M, T2M_MAX, T2M_MIN<br>deg_C<\/td><\/tr><tr><td>درجة حرارة سطح الأرض<br>Land Surface Temperature<\/td><td>حرارة سطح الأرض/الجلد والفرق عن حرارة الهواء؛ ليست حرارة هواء إضافية.<\/td><td dir=\"ltr\">TS, T2M<br>deg_C<\/td><\/tr><tr><td>الأمطار<br>Precipitation<\/td><td>مجاميع مطر للشهور المكتملة وملخصاتها؛ المفقود ليس صفرًا.<\/td><td dir=\"ltr\">PRECTOTCORR<br>mm<\/td><\/tr><tr><td>الضغط عند سطح البحر<br>Sea Level Pressure<\/td><td>ضغط مختزل إلى سطح البحر.<\/td><td dir=\"ltr\">SLP<br>hPa<\/td><\/tr><tr><td>الضغط السطحي<br>Surface Pressure<\/td><td>ضغط عند السطح؛ يختلف عن الضغط البحري.<\/td><td dir=\"ltr\">PS<br>hPa<\/td><\/tr><tr><td>الرياح: السرعة والاتجاه<br>Wind<\/td><td>سرعة الرياح عند 10 م واتجاه بمتوسط دائري.<\/td><td dir=\"ltr\">WS10M, WD10M<br>m/s; degree<\/td><\/tr><tr><td>الرطوبة النسبية<br>Relative Humidity<\/td><td>الرطوبة النسبية كنسبة مئوية.<\/td><td dir=\"ltr\">RH2M<br>percent<\/td><\/tr><tr><td>نقطة الندى<br>Dew Point<\/td><td>درجة حرارة نقطة الندى.<\/td><td dir=\"ltr\">T2MDEW<br>deg_C<\/td><\/tr><tr><td>الإشعاع الشمسي<br>Solar Radiation<\/td><td>طاقة إشعاع يومية متوسطة وملخصات تراكمية.<\/td><td dir=\"ltr\">ALLSKY_SFC_SW_DWN<br>kWh/m2/day<\/td><\/tr><tr><td>الأشعة فوق البنفسجية<br>UV Index<\/td><td>مؤشر UV مع تقريب الظهر الموروث لبيانات NASA.<\/td><td dir=\"ltr\">ALLSKY_SFC_UV_INDEX<br>WHO index<\/td><\/tr><tr><td>الغطاء السحابي<br>Cloud Cover<\/td><td>متوسط نسبة الغطاء السحابي.<\/td><td dir=\"ltr\">CLOUD_AMT<br>percent<\/td><\/tr><tr><td>مؤشر الحرارة والإجهاد الحراري<br>Heat Index<\/td><td>تقديرات الإجهاد الحراري من الحرارة والرطوبة؛ نواتج WBGT تقريبية وليست قياس جهاز.<\/td><td dir=\"ltr\">T2M, RH2M<br>deg_C<\/td><\/tr><tr><td>برودة الرياح والإجهاد البارد<br>Wind Chill<\/td><td>تقدير برودة الرياح من الحرارة وسرعتها؛ يتبع مجال تطبيق الصيغة.<\/td><td dir=\"ltr\">T2M, WS10M<br>deg_C<\/td><\/tr><tr><td>الجفاف: دي مارتون<br>De Martonne Aridity<\/td><td>مؤشر دي مارتون السنوي P/(T+10)، باعتماد مطر وحرارة صالحين.<\/td><td dir=\"ltr\">T2M, PRECTOTCORR<br>index<\/td><\/tr><tr><td>البخر والنتح: هارجريفز<br>Evapotranspiration<\/td><td>PET بطريقة Hargreaves اعتمادًا على الحرارة والعظمى والصغرى ودائرة العرض.<\/td><td dir=\"ltr\">T2M, T2M_MAX, T2M_MIN<br>mm<\/td><\/tr><tr><td>الجفاف: UNEP<br>UNEP Aridity<\/td><td>نسبة P/PET؛ يتطلب مطرًا وPET صالحين.<\/td><td dir=\"ltr\">T2M, T2M_MAX, T2M_MIN, PRECTOTCORR<br>ratio<\/td><\/tr><tr><td>العجز المائي<br>Water Deficit<\/td><td>العجز المائي وفق حسابات المطر وPET في المحرك.<\/td><td dir=\"ltr\">T2M, T2M_MAX, T2M_MIN, PRECTOTCORR<br>mm<\/td><\/tr><tr><td>عدد الأشهر الجافة<br>Dry Months<\/td><td>عدد الأشهر الجافة بحسب مقارنة المطر والحرارة P&lt;2T.<\/td><td dir=\"ltr\">T2M, PRECTOTCORR<br>months<\/td><\/tr><tr><td>الاتجاهات والشذوذ عن خط الأساس<br>Trends &amp; Anomalies<\/td><td>اتجاهات الحرارة والمطر وشذوذ خط الأساس عند كفاية التاريخ.<\/td><td dir=\"ltr\">T2M, PRECTOTCORR<br>mixed<\/td><\/tr><\/table>\n<p>اتجاه كل عشر سنوات يحتاج 8 سنوات مكتملة على الأقل. شذوذ خط الأساس يستخدم 1991–2020 مع 20 سنة خط أساس صالحة على الأقل، و5 سنوات حديثة على الأقل من آخر 10 سنوات متاحة. Insufficient History لا يعني فشل Provider. لا تتضمن هذه القائمة تنفيذًا كاملًا لمؤشرات ETCCDI اليومية؛ لا تفترض وجود R10/R20/RX5day أو مؤشرات أخرى غير معروضة.<\/p>\n<h3>المعادلات والمدخلات وأسماء الأعمدة لكل عنصر<\/h3><p><a href=\"#calculation-flow\">ابدأ بالرموز وتدفق الحساب<\/a><\/p><ul><li><a href=\"#formula-temperature\">معادلات: درجة حرارة الهواء<\/a><\/li><li><a href=\"#formula-lst\">معادلات: درجة حرارة سطح الأرض<\/a><\/li><li><a href=\"#formula-rain\">معادلات: الأمطار<\/a><\/li><li><a href=\"#formula-sea-pressure\">معادلات: الضغط عند سطح البحر<\/a><\/li><li><a href=\"#formula-surface-pressure\">معادلات: الضغط السطحي<\/a><\/li><li><a href=\"#formula-wind\">معادلات: الرياح: السرعة والاتجاه<\/a><\/li><li><a href=\"#formula-humidity\">معادلات: الرطوبة النسبية<\/a><\/li><li><a href=\"#formula-dewpoint\">معادلات: نقطة الندى<\/a><\/li><li><a href=\"#formula-solar\">معادلات: الإشعاع الشمسي<\/a><\/li><li><a href=\"#formula-uv\">معادلات: الأشعة فوق البنفسجية<\/a><\/li><li><a href=\"#formula-cloud\">معادلات: الغطاء السحابي<\/a><\/li><li><a href=\"#formula-heat-index\">معادلات: مؤشر الحرارة والإجهاد الحراري<\/a><\/li><li><a href=\"#formula-wind-chill\">معادلات: برودة الرياح والإجهاد البارد<\/a><\/li><li><a href=\"#formula-de-martonne\">معادلات: الجفاف: دي مارتون<\/a><\/li><li><a href=\"#formula-pet\">معادلات: البخر والنتح: هارجريفز<\/a><\/li><li><a href=\"#formula-unep\">معادلات: الجفاف: UNEP<\/a><\/li><li><a href=\"#formula-water-deficit\">معادلات: العجز المائي<\/a><\/li><li><a href=\"#formula-dry-months\">معادلات: عدد الأشهر الجافة<\/a><\/li><li><a href=\"#formula-trends\">معادلات: الاتجاهات والشذوذ عن خط الأساس<\/a><\/li><\/ul>\n", "en_body": "<p>There are 11 primary and 8 derived groups. Codes below are raw-variable dependencies for traceability, not additional providers. Units are defaults and can change with output-unit settings.<\/p><table><tr><th>Module<\/th><th>Meaning<\/th><th>Dependencies / usual unit<\/th><\/tr><tr><td>Temperature<\/td><td>Mean temperature, mean daily maxima/minima and temperature range.<\/td><td dir=\"ltr\">T2M, T2M_MAX, T2M_MIN<br>deg_C<\/td><\/tr><tr><td>Land Surface Temperature<\/td><td>Skin/surface temperature and its difference from air temperature.<\/td><td dir=\"ltr\">TS, T2M<br>deg_C<\/td><\/tr><tr><td>Precipitation<\/td><td>Complete-month rainfall totals and summaries; missing is not zero.<\/td><td dir=\"ltr\">PRECTOTCORR<br>mm<\/td><\/tr><tr><td>Sea Level Pressure<\/td><td>Pressure reduced to sea level.<\/td><td dir=\"ltr\">SLP<br>hPa<\/td><\/tr><tr><td>Surface Pressure<\/td><td>Surface pressure, distinct from sea-level pressure.<\/td><td dir=\"ltr\">PS<br>hPa<\/td><\/tr><tr><td>Wind<\/td><td>10 m wind speed and circular-mean direction.<\/td><td dir=\"ltr\">WS10M, WD10M<br>m/s; degree<\/td><\/tr><tr><td>Relative Humidity<\/td><td>Relative humidity as percent.<\/td><td dir=\"ltr\">RH2M<br>percent<\/td><\/tr><tr><td>Dew Point<\/td><td>Dew-point temperature.<\/td><td dir=\"ltr\">T2MDEW<br>deg_C<\/td><\/tr><tr><td>Solar Radiation<\/td><td>Mean daily solar energy and accumulated summaries.<\/td><td dir=\"ltr\">ALLSKY_SFC_SW_DWN<br>kWh/m2/day<\/td><\/tr><tr><td>UV Index<\/td><td>UV index using the inherited NASA noon approximation.<\/td><td dir=\"ltr\">ALLSKY_SFC_UV_INDEX<br>WHO index<\/td><\/tr><tr><td>Cloud Cover<\/td><td>Mean cloud-cover fraction in percent.<\/td><td dir=\"ltr\">CLOUD_AMT<br>percent<\/td><\/tr><tr><td>Heat Index<\/td><td>Heat/humidity stress estimates; WBGT outputs are approximations, not instrument observations.<\/td><td dir=\"ltr\">T2M, RH2M<br>deg_C<\/td><\/tr><tr><td>Wind Chill<\/td><td>Wind-chill estimate from air temperature and speed within the formula's domain.<\/td><td dir=\"ltr\">T2M, WS10M<br>deg_C<\/td><\/tr><tr><td>De Martonne Aridity<\/td><td>Annual De Martonne P/(T+10), requiring valid precipitation and temperature.<\/td><td dir=\"ltr\">T2M, PRECTOTCORR<br>index<\/td><\/tr><tr><td>Evapotranspiration<\/td><td>Hargreaves PET using mean/max/min temperature and latitude.<\/td><td dir=\"ltr\">T2M, T2M_MAX, T2M_MIN<br>mm<\/td><\/tr><tr><td>UNEP Aridity<\/td><td>P/PET ratio, requiring valid precipitation and PET.<\/td><td dir=\"ltr\">T2M, T2M_MAX, T2M_MIN, PRECTOTCORR<br>ratio<\/td><\/tr><tr><td>Water Deficit<\/td><td>Water deficit from the kernel's precipitation/PET calculations.<\/td><td dir=\"ltr\">T2M, T2M_MAX, T2M_MIN, PRECTOTCORR<br>mm<\/td><\/tr><tr><td>Dry Months<\/td><td>Dry-month count using the precipitation/temperature P&lt;2T criterion.<\/td><td dir=\"ltr\">T2M, PRECTOTCORR<br>months<\/td><\/tr><tr><td>Trends &amp; Anomalies<\/td><td>Temperature/rainfall trends and baseline anomalies when history is sufficient.<\/td><td dir=\"ltr\">T2M, PRECTOTCORR<br>mixed<\/td><\/tr><\/table>\n<p>A per-decade trend needs at least 8 complete years. Anomalies use the 1991–2020 baseline with at least 20 valid baseline years and at least 5 recent years among the last 10 available years. Insufficient History is not a provider failure. This list is not a full daily ETCCDI implementation; do not assume unlisted R10/R20/RX5day or other indices exist.<\/p>\n<h3>Equations, inputs and output columns for each element<\/h3><p><a href=\"#calculation-flow\">Start with symbols and calculation flow<\/a><\/p><ul><li><a href=\"#formula-temperature\">Equations: Temperature<\/a><\/li><li><a href=\"#formula-lst\">Equations: Land Surface Temperature<\/a><\/li><li><a href=\"#formula-rain\">Equations: Precipitation<\/a><\/li><li><a href=\"#formula-sea-pressure\">Equations: Sea Level Pressure<\/a><\/li><li><a href=\"#formula-surface-pressure\">Equations: Surface Pressure<\/a><\/li><li><a href=\"#formula-wind\">Equations: Wind<\/a><\/li><li><a href=\"#formula-humidity\">Equations: Relative Humidity<\/a><\/li><li><a href=\"#formula-dewpoint\">Equations: Dew Point<\/a><\/li><li><a href=\"#formula-solar\">Equations: Solar Radiation<\/a><\/li><li><a href=\"#formula-uv\">Equations: UV Index<\/a><\/li><li><a href=\"#formula-cloud\">Equations: Cloud Cover<\/a><\/li><li><a href=\"#formula-heat-index\">Equations: Heat Index<\/a><\/li><li><a href=\"#formula-wind-chill\">Equations: Wind Chill<\/a><\/li><li><a href=\"#formula-de-martonne\">Equations: De Martonne Aridity<\/a><\/li><li><a href=\"#formula-pet\">Equations: Evapotranspiration<\/a><\/li><li><a href=\"#formula-unep\">Equations: UNEP Aridity<\/a><\/li><li><a href=\"#formula-water-deficit\">Equations: Water Deficit<\/a><\/li><li><a href=\"#formula-dry-months\">Equations: Dry Months<\/a><\/li><li><a href=\"#formula-trends\">Equations: Trends & Anomalies<\/a><\/li><\/ul>\n"}, {"id": "period", "ar": "الفترة والملخصات والوحدات", "en": "Period, summaries and units", "group": "desktop", "ar_body": "<p>حدد البداية والنهاية بالشكل YYYY-MM-DD. تنزيل النقاط يومي ويمكن تحديد فترة جزئية؛ الشهر العلمي الكامل يحتاج كل أيام الشهر. لا تُحوّل بيانات أيام قليلة إلى مجموع شهر كامل أو سنة كاملة. حقول الفترة الجزئية مثل R_Period_Total وT_Period_Mean تختلف عن الملخصات المناخية السنوية. Coverage_Fraction هي نسبة التغطية وليست درجة دقة.<\/p>\n<p>اختر Annual والفصول المطلوبة؛ تبقى حقول الشهور في الجداول. التعريفات: DJF=12/1/2، MAM=3/4/5، JJA=6/7/8، SON=9/10/11. في ملف سنة مستقلة يجمع DJF الأشهر 12 و1 و2 من <b>نفس السنة المصدّرة<\/b> حسب المحرك الحالي، وليس ديسمبر السنة السابقة مع يناير وفبراير التالية. خيار المدى الشهري يعرض اختلاف نفس الشهر بين السنوات؛ ليس مدى اليوم الواحد.<\/p>\n<p>اختر Metric أو Imperial، أو وحدات مستقلة للحرارة والمطر والضغط والرياح والإشعاع. اقرأ Measurement_Unit والوحدة في ورقة Daily: السجلات اليومية تستخدم الوحدات الخام الموحّدة، وقد تختلف عن وحدات حقول الملخصات المختارة. التحويل °م إلى °ف لمقدار فرق حرارة يختلف عن تحويل درجة مطلقة. الإشعاع اليومي بوحدة طاقة/مساحة/يوم، وليس قدرة W/m² إلا إذا صرّح المصدر بذلك.<\/p>\n", "en_body": "<p>Set inclusive start/end dates as YYYY-MM-DD. Point downloads are daily and can cover partial periods; a complete scientific month requires every calendar day. A few days are not promoted into a full-month/year total. Partial-period fields such as R_Period_Total and T_Period_Mean differ from annual climate summaries. Coverage_Fraction measures availability, not accuracy.<\/p>\n<p>Select Annual and required seasons; monthly fields remain in workbooks. Definitions are DJF=12/1/2, MAM=3/4/5, JJA=6/7/8 and SON=9/10/11. In an individual-year workbook, the current kernel groups December, January and February from <b>that same exported calendar year<\/b>, rather than previous December plus next January/February. Monthly interannual range compares the same month across years; it is not a single-day range.<\/p>\n<p>Choose Metric/Imperial or individual temperature, precipitation, pressure, wind and solar units. Read Measurement_Unit and the Daily sheet's Unit: daily records use normalized source units and can differ from chosen summary units. Temperature differences and absolute temperatures have different Celsius/Fahrenheit conversions. Daily solar energy per area per day is not a W/m² power value unless explicitly identified as such.<\/p>\n"}, {"id": "regional", "ar": "خطوات الشبكة الإقليمية", "en": "Regional grid steps", "group": "toolbox", "ar_body": "<ol><li>اختر Grid Raster Climate Atlas.<\/li><li>حدد مضلع/نطاق AOI للتنزيل، ثم حد الدراسة الذي يُستخدم للقص عند الحاجة. النطاقان لهما وظيفتان مختلفتان.<\/li><li>حدد فترة تبدأ أول شهر وتنتهي آخر شهر؛ مثال 2024-01-01 إلى 2024-12-31.<\/li><li>اختر العناصر والوحدات وإسقاط المخرجات. اختر NASA الشهري أو CHIRPS أو CHELSA؛ الأخيران يقرآن مراكز الخلايا الأصلية داخل مضلع التنزيل، بحد 20,000 خلية. لا تُضرب أمطارهما الشهرية في عدد الأيام.<\/li><li>للراستر اختر المسار الكامل، وإسقاطًا متريًا وحجم خلية وطريقة استيفاء وقناع القص، ثم شغّل.<\/li><\/ol>\n<p>تُقرأ خلايا المصدر الأصلية؛ المطر الشهري من معدل المصدر يُحوَّل باستخدام عدد أيام الشهر الحقيقي. لا تُنشأ Daily من هذه القيم الشهرية. اختلاف شبكات المتغيرات قد يترك اعتماديات ناقصة عند بعض الإحداثيات؛ لا يعوضها البرنامج بقيم مختلقة. الطلب الإقليمي مقسم إلى بلاطات محدودة، بحد 512 بلاطة و20,000 نقطة شبكة؛ قلل النطاق عند بلوغ الحد.<\/p>\n", "en_body": "<ol><li>Select Grid Raster Climate Atlas.<\/li><li>Choose the download AOI polygon/extent and an optional separate clipping study boundary; they serve different purposes.<\/li><li>Request whole months, such as 2024-01-01 through 2024-12-31.<\/li><li>Choose modules, units and output CRS. Choose NASA monthly, CHIRPS or CHELSA. The latter two enumerate original native cell centres inside the download polygon, capped at 20,000 cells. Their monthly rainfall totals are not multiplied by days.<\/li><li>For rasters, select the full pipeline, metric processing CRS, cell size, interpolation and clipping mask; run.<\/li><\/ol>\n<p>Native source cells are read. Monthly precipitation rates are converted using the actual calendar month's length. Monthly data do not produce synthetic Daily observations. Different variable grids can leave dependencies missing at some coordinates; values are not fabricated to hide this. Regional requests are tiled, with limits of 512 tiles and 20,000 grid points; reduce the AOI if needed.<\/p>\n"}, {"id": "raster", "ar": "الراستر والإسقاط والتصنيف", "en": "Rasters, CRS and classification", "group": "outputs", "ar_body": "<p><b>نافذة Spatial Reference Properties:<\/b> تبدأ بـ Favorites للمساقط التي تضيفها وتبقى محفوظة، ثم Layers للمساقط الأصلية للطبقات المحمّلة وأسماء الطبقات التي تستخدمها. الطبقة غير المعروفة تظهر Unknown ولا يُفترض لها مسقط. يليهما Geographic Coordinate System بالقارات، وProjected Coordinate System بمجلدات Esri الأصلية. مثال: UTM → WGS 1984 → Northern Hemisphere أو Southern Hemisphere. تتاح داخل UTM أيضًا مجموعات القارات وBLM وغيرها كما في مرجع Pro 3.6. ابحث بالاسم أو الكود أو اسم المجلد؛ مسح البحث يعيد الفروع المفتوحة سابقًا. إظهار المختار يفتح مساره، والتفاصيل تعرض الداتوم والوحدة ومعاملات الإسقاط. خيار تعريفات Esri الإضافية لا يستبدل الشجرة؛ يضع التعريفات غير الموجودة في مرجع Pro في فرع منفصل واضح، لأن المصدر العام لا يحدد مسارات مجلدات Pro لها. اختيار مسقط طبقة هنا يضبط الاختيار فقط ولا يعيد كتابة الملف الأصلي.<\/p>\n<p>الطرق المنفذة: <b>IDW، Nearest، Linear TIN، Spline (thin plate)، Ordinary Kriging (exponential)<\/b>. IDW يسمح بمعامل القوة وعدد الجيران؛ لا يعني توفر اختيارها أن كل معاملات ArcGIS Pro المتقدمة نُقلت. افحص توزيع النقاط والقيم والمفقود قبل الاستيفاء. اختر قناع الدراسة لتحديد النطاق، ولا تعتبر امتداد المستطيل الناتج حدودًا إدارية.<\/p>\n<p>إسقاط المخرجات يمكن أن يكون جغرافيًا أو مسقطًا صالحًا. <b>المعالجة المكانية<\/b> تحتاج مسقطًا بوحدة المتر وحجم خلية بالمتر؛ EPSG:4326 درجات وليس مسقط حساب مسافات مترية. اختر إسقاطًا مناسبًا لمنطقة الدراسة، مثل UTM المحلي لنطاق صغير مناسب. شجرة CRS تضم Geographic وProjected؛ يمكن البحث بالاسم والكود، مع كتالوج ArcGIS Pro 3.6 المضمن وخيار التعريفات الأحدث. صلاحية التعريف لا تثبت دقة كل تحويل Datum أو توفر ملفات الشبكات المطلوبة.<\/p>\n<p>يمكن إنتاج راستر للحقول السنوية والفصلية، وراسترات شهرية عند تفعيلها، وأطلس PDF. التصنيف اختياري: Jenks أو Equal Interval أو Quantile، من 2 إلى 16 فئة. في الراستر المصنف <b>الفئة 1 هي الأعلى و0 هي NoData<\/b>؛ قد يقل عدد الفئات الفعلية عند قلة القيم المختلفة. نتائج التحقق بترك نقطة واحدة ليست إثباتًا للدقة الميدانية.<\/p>\n<p>الحد الافتراضي مليون خلية، وKriging المحلي محدود بـ250,000 خلية. زد حجم الخلية أو صغّر منطقة الدراسة إذا ظهر حد الموارد. تغيير حجم الخلية لا يضيف تفاصيل رصدية جديدة. مسارات المتجهات الخاصة بالرياح والكونتور وبعض خيارات Spline/Kriging/البحث المتقدمة ليست كلها مكتملة أو مثبتة التكافؤ مع ArcGIS.<\/p>\n", "en_body": "<p><b>Spatial Reference Properties:<\/b> Favorites holds systems you explicitly bookmark across sessions. Layers groups the actual source CRS of loaded spatial layers and lists the layers using each definition; undefined systems remain Unknown. Geographic Coordinate System uses the continent folders, and Projected Coordinate System retains the native Esri hierarchy. For example: UTM → WGS 1984 → Northern Hemisphere or Southern Hemisphere. UTM also contains continent, BLM and other groups from the Pro 3.6 reference. Search names, codes or folder names; clearing search restores previously expanded branches. Show selected reveals the selected path; Details exposes datum, units and projection parameters. Including additional Esri definitions never replaces this tree: definitions absent from the native snapshot use an explicitly separate branch because the public source does not declare their Pro folder paths. Selecting a layer CRS changes this choice, without rewriting its original dataset.<\/p>\n<p>Implemented methods are <b>IDW, Nearest, Linear TIN, Spline (thin plate), Ordinary Kriging (exponential)<\/b>. IDW exposes power and neighbour count; this does not mean every advanced ArcGIS Pro option has been migrated. Inspect point distribution, values and NULLs before interpolation. Use a study clipping mask; a rectangular raster extent is not an administrative boundary.<\/p>\n<p>Output CRS can be a valid geographic/projected system. <b>Spatial processing<\/b> needs a projected CRS in meters and a meter-based cell size; EPSG:4326 degrees are not metric distance coordinates. Use a suitable local projection, such as an appropriate UTM zone for a small area. The CRS picker has Geographic/Projected trees, code/name search, the embedded ArcGIS Pro 3.6 taxonomy and a newer definitions option. A valid definition does not certify every datum transformation's accuracy or required grid availability.<\/p>\n<p>Annual/seasonal field rasters, optional monthly rasters and a PDF atlas can be generated. Optional classification offers Jenks, Equal Interval or Quantile, with 2–16 requested classes. Classified rasters use <b>class 1 for the highest values and 0 for NoData<\/b>; fewer distinct values can reduce actual class count. Leave-one-out validation is not proof of field accuracy.<\/p>\n<p>The default raster cap is one million cells; local Kriging is capped at 250,000. Increase cell size or reduce the study area if a resource limit appears. Smaller output cells do not add new observation detail. Specialized wind vectors/contours and some advanced spline, kriging and search options are not all implemented or numerically certified against ArcGIS.<\/p>\n"}, {"id": "outputs", "ar": "قراءة المخرجات والجودة", "en": "Reading outputs and quality", "group": "outputs", "ar_body": "<table><tr><th>الملف/المكان<\/th><th>وظيفته<\/th><\/tr><tr><td>Project.gdb وProject.gpkg<\/td><td>نفس السجلات المحسوبة وهندساتها ومفاتيحها الثابتة في FileGDB وGeoPackage، مع إعادة القراءة للتحقق.<\/td><\/tr><tr><td>ملف Excel لكل عنصر<\/td><td>Data للبيانات الرئيسية؛ Month للحقول الشهرية؛ Source_Data للمصادر؛ Daily عند التفعيل. يوجد أيضًا تصدير لمواقع Stations.<\/td><\/tr><tr><td>Years داخل مجلد العنصر<\/td><td>ملفات إضافية لكل سنة عند الطلب، مع إعدادات المعالجة نفسها؛ هذا لا يحول نقص السنة إلى اكتمال.<\/td><\/tr><tr><td>Raw_Data<\/td><td>استجابات المصدر والأعلام ومصادر القيم وملخصات الطلبات وتدقيق التقدير الشهري في Hybrid.<\/td><\/tr><tr><td>Atlas ومخرجات الراستر<\/td><td>GeoTIFF والراستر المصنف والأطلس PDF وتقارير التحقق بحسب الخيارات.<\/td><\/tr><tr><td>manifest.json<\/td><td>حالة التشغيل والإعدادات والمخرجات والبصمات والأخطاء؛ المرجع لتحديد النجاح الكامل أو الجزئي.<\/td><\/tr><\/table>\n<p>Daily في Desktop جدول طويل: Station_Key، Station_ID، Station_Name، Date، Variable، Unit، Value؛ لا تفترض أنه مطابق لترتيب الجدول العريض في Toolbox. الحقول الإنجليزية محفوظة مع واجهة محلية. اقرأ Status وError_Msg وCoverage_Fraction وValid_Days/Expected_Days أو Valid_Months/Expected_Months. NULL يعني مفقودًا وليس صفرًا.<\/p>\n<p>Complete يعني اكتمال المخرجات المطلوبة وفق الفحوص. Partial يعني وجود نتائج محفوظة مع نواقص/فشل بعض المراحل؛ افتح السجل. NO_DATA يصف نقص بيانات المصدر، وقد توجد تقديرات شهرية موثقة؛ اقرأها مع حقول Gap Fill. INSUFFICIENT_HISTORY يخص طول التاريخ العلمي. نجاح GeoPackage لا يخفي فشل GDB، وقد تنجح الجداول رغم فشل الراستر. Excel هو المخرج الجدولي المعتاد؛ راجع أي بديل CSV صريح بدل افتراض وجود ملف Excel.<\/p>\n", "en_body": "<table><tr><th>File/location<\/th><th>Purpose<\/th><\/tr><tr><td>Project.gdb and Project.gpkg<\/td><td>The same calculated records, geometry and stable keys in FileGDB/GeoPackage, with readback validation.<\/td><\/tr><tr><td>Per-module Excel workbook<\/td><td>Data for main records; Month for monthly fields; Source_Data for sources; Daily when enabled. Stations locations are also exported.<\/td><\/tr><tr><td>Years within module directory<\/td><td>Optional individual-year workbooks using the same processing choices; incomplete years remain incomplete.<\/td><\/tr><tr><td>Raw_Data<\/td><td>Source responses/flags, per-value provenance, request summaries and Hybrid monthly estimate audits.<\/td><\/tr><tr><td>Atlas / raster outputs<\/td><td>GeoTIFF, classified rasters, PDF atlas and validation reports according to selected options.<\/td><\/tr><tr><td>manifest.json<\/td><td>Run status, settings, outputs/hashes and errors; use it to distinguish complete and partial success.<\/td><\/tr><\/table>\n<p>Desktop Daily is a long table: Station_Key, Station_ID, Station_Name, Date, Variable, Unit, Value. Do not assume Toolbox's wide-table layout. English field names remain stable while UI labels are localized. Read Status, Error_Msg, Coverage_Fraction and Valid_Days/Expected_Days or Valid_Months/Expected_Months. NULL means missing, not zero.<\/p>\n<p>Complete means requested outputs passed their checks. Partial means saved results coexist with gaps/failed stages; inspect the log. NO_DATA describes absent source data and can coexist with documented monthly estimates, so read Gap Fill fields too. INSUFFICIENT_HISTORY concerns scientific record length. A successful GeoPackage does not hide a failed GDB; tables can succeed when rasters fail. Excel is the normal tabular format; inspect any explicitly reported CSV fallback.<\/p>\n"}, {"id": "results", "ar": "المعاينة والمهام والإلغاء", "en": "Previews, tasks and cancellation", "group": "desktop", "ar_body": "<p>افتح عنصرًا محددًا من النتائج لعرضه في تبويب الجدول، ثم اختر الطبقة/الورقة والصفحة المطلوبة. المعاينة للقراءة فقط، ولا تشغّل وحدات ماكرو أو تعدّل المصنف. يمكن عرض GeoTIFF والخطوط كطبقات مرجعية، وفتح صفحات PDF من تبويب الأطلس. ملف المعاينة لا يصبح نقطة عمل إلا عند اختياره/استيراده بهذا الدور.<\/p>\n<p>السجل يعرض تقدم التنزيل والتصدير والراستر، مع وقت منقضٍ وإمكانية الإلغاء. يعمل التنزيل وGIS والقراءة في عملية منفصلة حتى تبقى الواجهة مستجيبة. قد ينتظر الإلغاء انتهاء طلب شبكة جارٍ؛ لا يعني ذلك أن الضغط لم يُستقبل. احتفظ بالنتائج الجزئية، ثم أعد التشغيل باسم جديد عند الحاجة. طلبات Hybrid المكتملة تستفيد من الكاش عند تكرار الإعدادات نفسها.<\/p>\n<p>لا تعني إزالة ملف من شجرة العرض حذفه من القرص. لا تفصل مجلد _internal عن MIRSAD.exe؛ هو جزء من البرنامج. التثبيت/الإزالة يحافظان على مشروعات المستخدم الموجودة خارج مجلد البرنامج.<\/p>\n", "en_body": "<p>Open a specific result in the table tab, select its layer/worksheet and navigate pages. Previews are read-only and do not execute macros or alter workbooks. GeoTIFF/lines can be displayed as context layers; PDF pages appear in the atlas tab. A preview is not a working point input unless explicitly imported/selected for that role.<\/p>\n<p>The task log shows download/export/raster progress, elapsed time and cancellation. Downloads, GIS and file inspection run outside the UI process. Cancellation may wait for an active network request; it does not mean the button was ignored. Keep partial results and use a new project name for a rerun. Hybrid can reuse completed request cache with identical settings.<\/p>\n<p>Removing a view does not delete its source file. Keep the _internal directory with MIRSAD.exe; it is part of the application. Installation/uninstallation preserves user projects stored outside the application directory.<\/p>\n"}, {"id": "examples", "ar": "أمثلة عملية خطوة بخطوة", "en": "Worked workflows", "group": "getting-started", "ar_body": "<h3>أ. أطلس محطات لمدة سنة<\/h3><ol><li>اختر أداة المحطات، والإقليم والدولة، ثم حدد محطتين أو أكثر.<\/li><li>اختر Hybrid و2024-01-01 إلى 2024-12-31 وTemperature وPrecipitation.<\/li><li>اختر المخرجات الجدولية أولًا، واضبط اسمًا جديدًا ومجلد حفظ، ثم شغّل.<\/li><li>راجع Coverage وRaw_Data؛ بعد التأكد، فعّل المسار الكامل واختر مسقطًا متريًا مناسبًا وقناع الدراسة وحجم الخلية لإنتاج الراستر.<\/li><\/ol>\n<h3>ب. نقاط Excel بإحداثيات UTM<\/h3><ol><li>اجعل ID نصًا، وجهز Name وEasting وNorthing وصف عناوين.<\/li><li>استورد الملف، وعيّن X=Easting وY=Northing وكود UTM الصحيح؛ لا تختَر WGS84 لمجرد أن الخريطة تعرضه.<\/li><li>حدد النقاط؛ اختر NASA/Open-Meteo للتنزيل، أو أعمدة رقمية موجودة لمسار الاستيفاء دون تنزيل.<\/li><\/ol>\n<h3>ج. أطلس شبكة NASA إقليمية<\/h3><ol><li>اختر Grid Raster وحدد AOI صغيرًا وقناع الدراسة.<\/li><li>اطلب يناير كاملًا مثل 2024-01-01 إلى 2024-01-31.<\/li><li>اختر العناصر، والمسار الكامل عند الحاجة، ثم شغّل وافحص الخلايا الأصلية والنواقص وغياب Daily المتوقع.<\/li><\/ol>\n", "en_body": "<h3>A. A one-year station atlas<\/h3><ol><li>Select the station tool, region/country and at least two required stations.<\/li><li>Choose Hybrid, 2024-01-01 through 2024-12-31, Temperature and Precipitation.<\/li><li>Start with the data workflow, new project name and output directory; run.<\/li><li>Inspect Coverage and Raw_Data. Then enable the full pipeline, choose a suitable metric CRS, study mask and cell size for rasters.<\/li><\/ol>\n<h3>B. Excel points in UTM<\/h3><ol><li>Keep ID as text; prepare Name, Easting, Northing and a header row.<\/li><li>Import and map X=Easting, Y=Northing and the correct UTM CRS; do not assign WGS84 merely because the map displays it.<\/li><li>Select points. Choose NASA/Open-Meteo to download, or existing numeric attributes for interpolation without downloading.<\/li><\/ol>\n<h3>C. A NASA regional grid atlas<\/h3><ol><li>Select Grid Raster and a small download AOI plus study mask.<\/li><li>Request a whole month, such as 2024-01-01 through 2024-01-31.<\/li><li>Select modules, enable the full pipeline if needed, run and inspect native cells/gaps. No Daily records are expected.<\/li><\/ol>\n"}, {"id": "troubleshooting", "ar": "حل المشكلات والحدود", "en": "Troubleshooting and limits", "group": "support", "ar_body": "<table><tr><th>الحالة<\/th><th>ما الذي تراجعه؟<\/th><\/tr><tr><td>لا توجد نقاط مختارة<\/td><td>مصدر نقاط العمل، الدولة/البحث، وعلامات التحديد؛ المعروض ليس دائمًا المحدد.<\/td><\/tr><tr><td>خلفية الخريطة لا تظهر<\/td><td>اتصال الإنترنت والمصدر؛ جرّب بدون خلفية. لا يلزم تغيير Provider المناخي بسبب خلفية عرض.<\/td><\/tr><tr><td>404 لمحطة NOAA<\/td><td>غياب ملف سنة/محطة قد يكون طبيعيًا؛ راجع سجل Hybrid والمصادر التي أكملت القيم.<\/td><\/tr><tr><td>فجوات عند نهاية الفترة<\/td><td>تأخر نشر المصدر، واختلاف تغطية المتغيرات، وعدم اكتمال آخر شهر.<\/td><\/tr><tr><td>نقاط في مكان غير صحيح<\/td><td>تعيين X/Y وCRS الفعلي والوحدات؛ لا تنقل النقطة يدويًا لمجرد ملاءمة الخريطة.<\/td><\/tr><tr><td>GDB فشلت وبعض الملفات نجحت<\/td><td>أغلق قفل قاعدة البيانات في البرامج الأخرى، واختبر مجلدًا محليًا قابلًا للكتابة؛ احتفظ بـExcel وGPKG والسجل.<\/td><\/tr><tr><td>راستر فارغ/تجاوز موارد<\/td><td>الحقل الرقمي، NULLs، عدد وتوزيع النقاط، القناع، مسقط متر، وحجم الخلية. حد النقاط 20,000 والأعمدة 512.<\/td><\/tr><tr><td>اتجاهات/شذوذ فارغ<\/td><td>عدد السنوات المكتملة وتغطية خط الأساس؛ سنة واحدة لا تكفي.<\/td><\/tr><\/table>\n<p>معاينات المدخلات لها حدود للصفوف والهندسات وحجم الملفات؛ اعمل على جزء أصغر عند ظهور حد معلن. لا تُعطّل حماية Windows أو تطلب صلاحيات مسؤول لحل خطأ بيانات. هذا إصدار تطوير: لم تُثبت بعد المطابقة الكاملة لجميع معاملات ومخططات أعمدة Toolbox أو طرق ArcGIS العددية. استخدم البيانات الخام والتوثيق لتقييم الملاءمة، ولا تعتبر اكتمال المهمة ضمان دقة علمية مطلقة.<\/p>\n", "en_body": "<table><tr><th>Symptom<\/th><th>Check<\/th><\/tr><tr><td>No selected points<\/td><td>Working source, country/search and checkboxes; visible is not always selected.<\/td><\/tr><tr><td>No basemap<\/td><td>Connection/service or use no basemap; a display failure does not require changing the climate provider.<\/td><\/tr><tr><td>NOAA station 404<\/td><td>A station/year file may be absent; inspect Hybrid events and which sources completed values.<\/td><\/tr><tr><td>Gaps at period end<\/td><td>Provider publication delay, variable-specific coverage and incomplete final months.<\/td><\/tr><tr><td>Misplaced points<\/td><td>X/Y mapping, actual CRS and units; do not move a point simply to match the display.<\/td><\/tr><tr><td>GDB failed; other files succeeded<\/td><td>Release database locks in other programs and test a writable local directory; preserve Excel, GPKG and logs.<\/td><\/tr><tr><td>Empty raster/resource limit<\/td><td>Numeric field, NULLs, point distribution/count, mask, metric CRS and cell size. Point/column caps are 20,000/512.<\/td><\/tr><tr><td>Missing trends/anomalies<\/td><td>Complete-year count and baseline coverage; one year is insufficient.<\/td><\/tr><\/table>\n<p>Input previews have row/geometry/file-size limits; subset when an explicit bound is reached. Do not disable Windows security or require administrator access to solve a data issue. This is a development version: full Toolbox parameter/column-schema parity and native ArcGIS numerical equivalence are not yet certified. Assess suitability using raw data/provenance; task completion is not a guarantee of absolute scientific accuracy.<\/p>\n"}, {"id": "shortcuts", "ar": "الاختصارات والمراجع والدعم", "en": "Shortcuts, references and support", "group": "support", "ar_body": "<table><tr><th>الاختصار<\/th><th>الوظيفة<\/th><\/tr><tr><td>F1<\/td><td>دليل الاستخدام<\/td><\/tr><tr><td>Ctrl+O<\/td><td>إضافة بيانات<\/td><\/tr><tr><td>+ / = / −<\/td><td>زوم عند تركيز الخريطة<\/td><\/tr><tr><td>F<\/td><td>عرض نطاق البيانات عند تركيز الخريطة<\/td><\/tr><tr><td>Esc<\/td><td>إغلاق لوحة الخلفيات أو إلغاء وضع إضافة نقطة حسب التركيز<\/td><\/tr><tr><td>Ctrl+F داخل الدليل<\/td><td>البحث في نص الدليل، ثم التالي/السابق<\/td><\/tr><\/table>\n<p>الدليل مضمّن للعمل دون إنترنت؛ المراجع الخارجية تحتاج اتصالًا. اللغة داخل الدليل مستقلة ويمكن تبديلها من أعلاه. التصميم يستخدم فهرسًا وروابط داخلية وبحثًا دون تحميل صفحات ويب أو تنفيذ سكربتات.<\/p>\n<p>المطور: أحمد إبراهيم — Ahmad Ibrahim<br>الدعم: ahmadibrahim.geo@gmail.com<br>المشروع والترخيص MIT: <a href=\"https://github.com/ahmadibrahim4geo/MIRSAD\">github.com/ahmadibrahim4geo/MIRSAD<\/a><\/p>\n", "en_body": "<table><tr><th>Shortcut<\/th><th>Action<\/th><\/tr><tr><td>F1<\/td><td>User Guide<\/td><\/tr><tr><td>Ctrl+O<\/td><td>Add Data<\/td><\/tr><tr><td>+ / = / −<\/td><td>Zoom when map canvas has focus<\/td><\/tr><tr><td>F<\/td><td>Fit data when map canvas has focus<\/td><\/tr><tr><td>Esc<\/td><td>Dismiss basemap panel or cancel point placement, according to focus<\/td><\/tr><tr><td>Ctrl+F in the guide<\/td><td>Search this guide, then Next/Previous<\/td><\/tr><\/table>\n<p>The manual is bundled for offline use; external references need internet. Switch manual language at the top independently of the workspace. Contents, internal links and text search work without loading web pages or running scripts.<\/p>\n<p>Developer: Ahmad Ibrahim — أحمد إبراهيم<br>Support: ahmadibrahim.geo@gmail.com<br>Project / MIT licence: <a href=\"https://github.com/ahmadibrahim4geo/MIRSAD\">github.com/ahmadibrahim4geo/MIRSAD<\/a><\/p>\n"}, {"id": "install", "ar": "التثبيت والتشغيل", "en": "Install and run", "group": "getting-started", "ar_body": "<p>مرصاد Desktop تطبيق Windows 64-bit مستقل. شغّل المثبت المعتمد عند توفر إصدار معتمد، أو استخدم مجلد التطوير كاملًا. يجب أن يبقى مجلد _internal بجوار MIRSAD.exe؛ لا تنقل EXE وحده. تحفظ مشاريع المستخدم خارج مجلد البرنامج.<\/p><p>لتشغيل الأدوات، أضف ملفات .pyt الثلاثة إلى Catalog في ArcGIS Pro أو ArcMap مع utils والملفات التابعة كما وردت في المستودع. تحتاج وظائف Spatial Analyst إلى الترخيص المناسب في ArcGIS. تشغيل Desktop لا يحتاج ArcGIS.<\/p><p>من سطر الأوامر: <code>MIRSAD.exe --user-guide --language ar --help-topic tool-points<\/code> يفتح الدليل وحده. لفتح الدليل دون تثبيت Desktop افتح Help/index.html. يدعم الفهرس والبحث والمفضلة والطباعة محليًا.<\/p>\n", "en_body": "<p>MIRSAD Desktop is an independent 64-bit Windows application. Use the approved installer when an approved release is available, or the complete development folder. Keep _internal beside MIRSAD.exe; the EXE alone is incomplete. Store projects outside the application directory.<\/p><p>Add the three .pyt files to the ArcGIS Pro or ArcMap Catalog, keeping utils and repository dependencies beside them. ArcGIS spatial operations require the appropriate Spatial Analyst licence. Desktop does not require ArcGIS.<\/p><p><code>MIRSAD.exe --user-guide --language en --help-topic tool-points<\/code> opens help alone. Without Desktop, open Help/index.html for offline contents, search, bookmarks and printing.<\/p>\n"}, {"id": "arcgis", "ar": "المساعدة داخل Pro وArcMap", "en": "Help in Pro and ArcMap", "group": "toolbox", "ar_body": "<p>أضف صناديق Point وWeather Stations وGrid Raster كلًا على حدة. افتح Item Description/عرض المساعدة للأداة لقراءة ملخصها، واستخدم الدليل الكامل المحلي. ملفات XML مرتبطة باسم Toolbox والأداة؛ يجب توزيعها مع ملفات .pyt.<\/p><p>مسار المعالجة القديم يدعم Python 2.7 في ArcMap وPython 3 في Pro. لا تثبّت Qt في Python الخاص بـArcGIS لمجرد فتح الدليل. استخدم ملف HTML أو شغّل عارض Desktop كعملية مستقلة. من Python الخاص بالأداة: <code>from utils.help_viewer import open_help; open_help(\"tool-stations\", \"ar\")<\/code>.<\/p><p>التحقق الأصلي موثق لـPro 3.6. لم يكتمل تحقق ArcMap الأصلي في دفعة dev7؛ نجاح اختبارات Python 2.7 لا يحل محله. الفروق المتبقية في مخططات المخرجات وخيارات الراستر المتقدمة معلنة.<\/p>\n", "en_body": "<p>Add Point, Weather Stations and Grid Raster toolboxes separately. Use Item Description/View Help to read a tool summary and follow the full local manual. Toolbox/tool XML metadata are associated by filename and travel with the .pyt files.<\/p><p>The legacy runtime supports ArcMap Python 2.7 and Pro Python 3. Help requires no Qt installation in ArcGIS Python: use local HTML or launch Desktop help in a separate process. From toolbox Python: <code>from utils.help_viewer import open_help; open_help(\"tool-stations\", \"en\")<\/code>.<\/p><p>Native verification is recorded for Pro 3.6. Native ArcMap acceptance remained unconfirmed in dev7; Python 2.7 tests are separate evidence. Remaining output-schema and advanced-raster differences are documented.<\/p>\n"}, {"id": "tool-points", "ar": "أداة النقاط: من الإدخال إلى النتائج", "en": "Point tool: inputs to results", "group": "toolbox", "ar_body": "<ol><li>في Toolbox افتح Point Climate Atlas Generator وحدد طبقة نقاط الإدخال، أو اختر Offline مع طبقات محسوبة تحتوي حقولًا رقمية.<\/li><li>راجع CRS والهويات والإحداثيات. في Desktop يمكن استيراد جدول وتعيين X/Y أو إدخال النقاط على الخريطة؛ هذه طرق إدخال إضافية للواجهة.<\/li><li>اختر المصدر والعناصر والفترة والوحدات. المصادر الشبكية تقبل نقاطًا عادية؛ NOAA يحتاج هوية محطة فعلية، وGHCN يحتاج GHCN_ID صريحًا في المسار الداعم.<\/li><li>Download Only يحفظ بيانات النقاط والجداول. لإنتاج الأسطح اضبط الاستيفاء والخلية والمسقط والقناع. راجع <a href=\"#raster\">الراستر<\/a>.<\/li><li>شغل، وراجع الحالة والتغطية والمصدر الفعلي وملفات المخرجات. بيانات المطر المفقودة ليست صفرًا.<\/li><\/ol><p><a href=\"#parameters-points\">مرجع معاملات Toolbox<\/a> · <a href=\"#providers\">المصادر<\/a> · <a href=\"#outputs\">المخرجات<\/a><\/p>\n", "en_body": "<ol><li>Open Point Climate Atlas Generator with an input point layer, or choose Offline with calculated point layers containing numeric fields.<\/li><li>Check CRS, identities and coordinates. Desktop additionally supports tabular X/Y mapping and map-based point entry.<\/li><li>Select provider, modules, period and units. Gridded products accept arbitrary points; NOAA requires actual station identity, and GHCN requires explicit GHCN_ID in its supported input path.<\/li><li>Download Only keeps point data and tables. To create surfaces configure interpolation, cell size, CRS and mask; see <a href=\"#raster\">rasters<\/a>.<\/li><li>Run and inspect status, coverage, actual source and outputs. Missing rainfall is not zero.<\/li><\/ol><p><a href=\"#parameters-points\">Toolbox parameter reference<\/a> · <a href=\"#providers\">Sources<\/a> · <a href=\"#outputs\">Outputs<\/a><\/p>\n"}, {"id": "tool-stations", "ar": "أداة محطات الأرصاد", "en": "Weather station tool", "group": "toolbox", "ar_body": "<ol><li>اختر وضع اختيار المحطات: شبكة دولة أو اختيار مكاني/مخصص، ثم المنطقة والدولة أو حدود الدراسة.<\/li><li>في Toolbox قد تعني قائمة محطات فارغة استخدام الشبكة الوطنية كاملة بحسب وضع الاختيار؛ في Desktop يجب تحديد نقاط العمل صراحة. ظهور الصفوف لا يعني تحديدها.<\/li><li>يمكن إضافة طبقة محطات محلية ونقاط داعمة. احتفظ بـUSAF وWBAN كنصوص وبالموقع؛ USAF منفردًا ليس مفتاحًا فريدًا.<\/li><li>اختر NOAA المستقل أو ERA5 المستقل أو الهجين أو مصدرًا شبكيًا مناسبًا. الهجين ينهي تنزيل NOAA لكل المواقع ثم ERA5 للنواقص ثم NASA، ثم الاستكمال الشهري الاختياري.<\/li><li>راجع عدد المحطات المختارة والنطاق والفترة والتغطية قبل تعميم التشغيل. إحداثيات الكتالوج ليست تحققًا ميدانيًا من دقة كل محطة.<\/li><\/ol><p><a href=\"#parameters-stations\">مرجع المعاملات<\/a> · <a href=\"#hybrid\">الهجين والفجوات<\/a><\/p>\n", "en_body": "<ol><li>Select national-network or spatial/custom station selection, then region/country or study boundary.<\/li><li>In the Toolbox an empty station list can mean the whole national network depending on selection mode. Desktop requires explicit working-point selection; visible rows are not selected rows.<\/li><li>Local station and supplementary point layers are supported. Keep USAF and WBAN as text plus location; USAF alone is not unique.<\/li><li>Choose standalone NOAA, standalone ERA5, Hybrid or a suitable gridded source. Hybrid completes NOAA for all sites, then ERA5 for gaps, then NASA, then optional monthly filling.<\/li><li>Check station count, region, dates and coverage before a large run. Catalogue coordinates do not constitute field verification.<\/li><\/ol><p><a href=\"#parameters-stations\">Parameter reference<\/a> · <a href=\"#hybrid\">Hybrid and gaps<\/a><\/p>\n"}, {"id": "tool-raster", "ar": "أداة الشبكة والراستر المناخي", "en": "Grid raster climate tool", "group": "toolbox", "ar_body": "<ol><li>حدد منطقة التنزيل Download AOI، وقناع القص النهائي. في Toolbox راجع إلزامية طبقة Final Clip في مرجع المعاملات؛ في Desktop يتاح قناع دراسة منفصل.<\/li><li>اختر NASA POWER أو CHIRPS أو CHELSA ضمن المنتجات الإقليمية المنفذة. TerraClimate وMODIS حاليًا مسارات نقاط، وليسا تنزيلًا إقليميًا في هذه الأداة.<\/li><li>حدد شهورًا كاملة ومجموعة عناصر تدعمها بيانات المصدر؛ CHIRPS أمطار شهرية. لا تضاعف مجموع مطر CHIRPS/CHELSA في عدد الأيام.<\/li><li>NASA يستخدم تنزيل الشبكة الإقليمية الشهرية؛ CHIRPS/CHELSA يقرآن مراكز الخلايا الأصلية داخل المضلع. لا تختلط دقة الخلية الأصلية مع حجم بكسل الاستيفاء.<\/li><li>اضبط مسقطًا مناسبًا بوحدات مترية وحجم الخلية والطريقة، ثم شغل وافحص بيانات النقاط والجداول والراستر والتحذيرات.<\/li><\/ol><p><a href=\"#parameters-raster\">مرجع المعاملات<\/a> · <a href=\"#regional\">خطوات المنطقة<\/a><\/p>\n", "en_body": "<ol><li>Select the Download AOI and final clip mask. Check the Toolbox Final Clip requirement in the parameter reference; Desktop allows a separate study mask.<\/li><li>Implemented regional products are NASA POWER, CHIRPS and CHELSA. TerraClimate and MODIS currently use point adapters, not regional extraction here.<\/li><li>Choose complete months and source-supported modules; CHIRPS provides monthly precipitation. CHIRPS/CHELSA rainfall totals are not multiplied by days.<\/li><li>NASA uses monthly regional-grid download; CHIRPS/CHELSA read original cell centres inside the polygon. Native source resolution differs from interpolation pixel size.<\/li><li>Set suitable metric CRS, cell size and method, then inspect point/table/raster outputs and warnings.<\/li><\/ol><p><a href=\"#parameters-raster\">Parameter reference<\/a> · <a href=\"#regional\">Regional steps<\/a><\/p>\n"}, {"id": "contributing", "ar": "المساهمة وتطوير مرصاد", "en": "Contributing to MIRSAD", "group": "support", "ar_body": "<p>المستودع: <a href=\"https://github.com/ahmadibrahim4geo/MIRSAD\">MIRSAD على GitHub<\/a>. راجع CONTRIBUTING ودليل إعداد المطور قبل التعديل. افتح اقتراحًا أو تقرير خطأ يحدد الإصدار والبيئة وخطوات الإعادة ورسالة الخطأ بعد إزالة بيانات الدخول.<\/p><p>يمكن المساهمة في التوثيق والترجمة والواجهة والاختبارات والمصادر. أي مصدر/نموذج علمي يحتاج تعريف الوحدات والتغطية والتبعيات واختبارات قيم متوقعة وحفظ البيانات الخام. توافق ArcMap وPro واستقلال Desktop شروط قائمة.<\/p><p>لا ترفع حسابات أو مفاتيح أو بيانات مشاريع شخصية. احفظ الاختبارات الحتمية منفصلة عن اختبارات الشبكة والحساب وArcGIS الأصلي. رخصة الكود MIT؛ تبقى تراخيص البيانات والتبعيات سارية.<\/p>\n", "en_body": "<p>Repository: <a href=\"https://github.com/ahmadibrahim4geo/MIRSAD\">MIRSAD on GitHub<\/a>. Read CONTRIBUTING and developer setup before changes. Reports should identify version, environment, reproduction steps and redacted error messages.<\/p><p>Contributions can improve documentation, translation, UI, tests and data adapters. Scientific additions require units, coverage, dependencies, independent expected-value checks and retained raw observations. ArcMap/Pro compatibility and Desktop independence remain requirements.<\/p><p>Do not upload credentials or personal project data. Separate deterministic tests from network/account/native ArcGIS tests. Code is MIT; data/dependency licences remain applicable.<\/p>\n"}, {"id": "parameters-points", "ar": "مرجع معاملات النقاط", "en": "Point parameter reference", "group": "toolbox", "ar_body": "<p>هذا مرجع معاملات أداة ArcGIS، وليس قائمة أوامر Desktop. القيم المعروضة لقطة التعريف الافتراضي من Pro 3.6؛ تغيرها الواجهة حسب المصدر والنمط والعناصر. خانة Required تخص التعريف، وقد تختلف الإلزامية الفعلية في Offline أو عند تعطيل خيار تابع. المصادر الشهرية تعطل Daily. حساب CDS/IMERG الفعلي وتوافق ArcMap الأصلي ما زالا ضمن حدود التحقق المعلنة.<\/p><p>MIRSAD_Climate_Atlas_Generator_10_8.pyt · 69 معاملًا<\/p><h3>نمط سير العمل والتشغيل <span dir=\"ltr\">(Operation_Mode)<\/span><\/h3><p>يختار التنزيل والحساب وإنتاج الأطلس، أو الاستيفاء من حقول نقاط محسوبة موجودة دون طلب بيانات مناخية جديدة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Download &amp; Generate Atlas (Full Pipeline) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Download &amp; Generate Atlas (Full Pipeline) [Default] | Interpolate &amp; Map Existing Data (Offline Mode - No Internet)<\/p><h3>نمط تنفيذ المعالجة وتدفق المهام <span dir=\"ltr\">(Execution_Workflow_Mode)<\/span><\/h3><p>يحدد تنزيل جميع البيانات أولًا ثم الحساب، أو معالجة عنصر بعد الآخر. المصادر المشتركة تحافظ على حواجز تتابع الهجين.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Batch Mode: Download All Then Process [Recommended]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Batch Mode: Download All Then Process [Recommended] | Sequential Mode: Element by Element<\/p><h3>تنزيل وحفظ بيانات النقاط فقط (تخطي الراسترات والأطلس) <span dir=\"ltr\">(Download_Only)<\/span><\/h3><p>يحفظ بيانات النقاط والجداول ويستبعد توليد أسطح الراستر والأطلس؛ لا يعني إيقاف حساب المؤشرات الجدولية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>طبقة نقاط الإدخال (شيب فايل أو فيتشر كلاس) <span dir=\"ltr\">(Input_Point_Features)<\/span><\/h3><p>طبقة النقاط المطلوب حساب المناخ عند مواقعها. يقرأ المسقط الحقيقي ويحوّل مواقع الطلب إلى WGS84 دون إعادة تعريف إحداثيات المصدر.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Point<\/p><h3>طبقة نقاط محسوبة مسبقاً (وضع أوفلاين) <span dir=\"ltr\">(Precalculated_Point_Layers)<\/span><\/h3><p>طبقات نقاط تحتوي حقولًا مناخية رقمية محسوبة مسبقًا، تستخدم في وضع Offline للاستيفاء دون تنزيل.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Point | Multipoint<\/p><h3>قناع حدود منطقة الدراسة (مضلع اختياري) <span dir=\"ltr\">(Study_Area_Mask)<\/span><\/h3><p>مضلع منطقة الدراسة المستخدم في حدود المعالجة وقص المخرجات؛ ليس طبقة نقاط التنزيل.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Polygon<\/p><h3>اسم منطقة الدراسة (اختياري - لتسمية الطبقات) <span dir=\"ltr\">(Study_Area_Name)<\/span><\/h3><p>اسم وصفي لمنطقة الدراسة يستخدم في تسمية مكونات المشروع؛ لا يغير إحداثياتها أو حدودها.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>مجلد مساحة عمل المخرجات الرئيسي <span dir=\"ltr\">(Output_Workspace)<\/span><\/h3><p>مجلد حفظ المشروع وقاعدة البيانات والجداول ومجلدات العناصر. استخدم مكانًا قابلًا للكتابة خارج مجلد تثبيت البرنامج.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Folder<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>نظام الإسناد المكاني للمخرجات (Spatial Reference) <span dir=\"ltr\">(Output_Spatial_Reference)<\/span><\/h3><p>نظام إحداثيات المخرجات. اختر وحدات ومسقطًا يناسبان المسافات والاستيفاء؛ اختيار اسم نظام لا يثبت دقة كل تحويل Datum.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Spatial Reference<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>نظام وحدات القياس (متري Metric / إمبراطوري Imperial) <span dir=\"ltr\">(Measurement_Units_System)<\/span><\/h3><p>يختار Metric أو Imperial أو الوحدات المخصصة. راجع حقول الوحدات في المخرجات قبل المقارنة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Metric (Celsius °C, mm, hPa, m/s, kWh/m2/day) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Metric (Celsius °C, mm, hPa, m/s, kWh/m2/day) [Default] | Imperial
