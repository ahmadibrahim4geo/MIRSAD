 dir=\"ltr\"><code>Cld_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_November_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_October_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_September_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_Spring_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_Winter_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_point_fields, seasonal_means_from_monthly<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-heat-index", "ar": "معادلات: مؤشر الحرارة والإجهاد الحراري", "en": "Equations: Heat Index", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">T2M, RH2M<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>F = 1.8*T_C + 32; H = clamp(RH_percent,0,100)<\/code><\/p><p dir=\"ltr\"><code>HI_F = -42.379 + 2.04901523*F + 10.14333127*H - 0.22475541*F*H<\/code><\/p><p dir=\"ltr\"><code>       -0.00683783*F^2 -0.05481717*H^2 +0.00122874*F^2*H<\/code><\/p><p dir=\"ltr\"><code>       +0.00085282*F*H^2 -0.00000199*F^2*H^2<\/code><\/p><p dir=\"ltr\"><code>If H&lt;13 and 80&lt;=F&lt;=112: HI_F -= (13-H)/4 * sqrt((17-abs(F-95))/17)<\/code><\/p><p dir=\"ltr\"><code>If H&gt;85 and 80&lt;=F&lt;=87: HI_F += (H-85)/10 * (87-F)/5<\/code><\/p><p dir=\"ltr\"><code>HI_C = (HI_F-32)/1.8; if F&lt;80: HI_C=T_C<\/code><\/p><p dir=\"ltr\"><code>e_hPa = 6.112 * 10^(7.5*T_C/(237.7+T_C)) * H/100<\/code><\/p><p dir=\"ltr\"><code>Humidex = T_C + (5/9)*(e_hPa-10)<\/code><\/p><p dir=\"ltr\"><code>Tw = T_C*atan(0.151977*sqrt(H+8.313659)) + atan(T_C+H) - atan(H-1.676331)<\/code><\/p><p dir=\"ltr\"><code>     +0.00391838*H^1.5*atan(0.023101*H) -4.686035<\/code><\/p><p dir=\"ltr\"><code>WBGT_shade = 0.7*Tw + 0.3*T_C<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>أولًا يحسب متوسط كل شهر تقويمي للحرارة والرطوبة؛ ثم يطبق Rothfusz على هذين المتوسطين لكل شهر. HI_Annual_Mean متوسط قيم Rothfusz الشهرية، وHI_Annual_Range مداها. استثناء مهم: HI_Winter_Mean متوسط Humidex لأشهر DJF، وليس متوسط HI_December/January/February. WBGT_Summer_Mean متوسط نموذج الظل المبسط باستخدام Stull لأشهر JJA.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>هذا تقييم مناخي شهري، وليس متوسط مؤشر محسوب من كل يوم أو ساعة؛ تطبيق دالة غير خطية على المتوسطين يختلف عن متوسط نتائجها. Tw تقريب تجريبي بنطاق تقريبي -20..50°C ورطوبة 5..99%؛ الكود يقص RH إلى 0..100 لكنه لا يمنع كل خروج عن نطاق الملاءمة. WBGT لا يشمل حمل الشمس أو تصحيح رياح Liljegren ولا يعد قياس سلامة مهنيًا معتمدًا.<\/p><h3>مثال محسوب<\/h3><p>عند T=20°C تعيد دالة Rothfusz الحرارة نفسها (20) لأن F&lt;80. Humidex الشتوي لنفس الحرارة قد يختلف حسب الرطوبة، لذا لا تستبدل عمود HI_Winter_Mean بمتوسط أعمدة HI الشهرية.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>HI_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_Autumn_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_December_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_February_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_January_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_July_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_June_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_March_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_Winter_Mean<\/code><\/td><td>متوسط Humidex الشهري في DJF؛ لا يستخدم Rothfusz هنا.<\/td><\/tr><tr><td dir=\"ltr\"><code>WBGT_Summer_Mean<\/code><\/td><td>متوسط 0.7Tw+0.3T الشهري في JJA.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → heat_index_c, humidex_c, wetbulb_stull_c, wbgt_shade_c, compute_thermal_stress_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">T2M, RH2M<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>F = 1.8*T_C + 32; H = clamp(RH_percent,0,100)<\/code><\/p><p dir=\"ltr\"><code>HI_F = -42.379 + 2.04901523*F + 10.14333127*H - 0.22475541*F*H<\/code><\/p><p dir=\"ltr\"><code>       -0.00683783*F^2 -0.05481717*H^2 +0.00122874*F^2*H<\/code><\/p><p dir=\"ltr\"><code>       +0.00085282*F*H^2 -0.00000199*F^2*H^2<\/code><\/p><p dir=\"ltr\"><code>If H&lt;13 and 80&lt;=F&lt;=112: HI_F -= (13-H)/4 * sqrt((17-abs(F-95))/17)<\/code><\/p><p dir=\"ltr\"><code>If H&gt;85 and 80&lt;=F&lt;=87: HI_F += (H-85)/10 * (87-F)/5<\/code><\/p><p dir=\"ltr\"><code>HI_C = (HI_F-32)/1.8; if F&lt;80: HI_C=T_C<\/code><\/p><p dir=\"ltr\"><code>e_hPa = 6.112 * 10^(7.5*T_C/(237.7+T_C)) * H/100<\/code><\/p><p dir=\"ltr\"><code>Humidex = T_C + (5/9)*(e_hPa-10)<\/code><\/p><p dir=\"ltr\"><code>Tw = T_C*atan(0.151977*sqrt(H+8.313659)) + atan(T_C+H) - atan(H-1.676331)<\/code><\/p><p dir=\"ltr\"><code>     +0.00391838*H^1.5*atan(0.023101*H) -4.686035<\/code><\/p><p dir=\"ltr\"><code>WBGT_shade = 0.7*Tw + 0.3*T_C<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>First compute climatological calendar-month temperature and RH, then apply Rothfusz to each monthly pair. HI_Annual_Mean averages monthly Rothfusz values and HI_Annual_Range is their range. Crucial exception: HI_Winter_Mean averages DJF Humidex, not the exported December/January/February Rothfusz fields. WBGT_Summer_Mean averages the simplified Stull-based shade model over JJA.<\/p><h3>Validity and missing-data rules<\/h3><p>This is monthly climatic screening, not a mean of daily/hourly index evaluations; nonlinear evaluation of means differs from averaging individual evaluations. Tw is an empirical fit approximately for -20..50°C and 5..99% RH; the code clips RH to 0..100 without enforcing all fit limits. WBGT omits solar load and Liljegren wind corrections and is not a certified occupational safety measurement.<\/p><h3>Worked example<\/h3><p>At T=20°C Rothfusz returns 20 because F&lt;80. Winter Humidex for the same temperature can differ with RH; do not replace HI_Winter_Mean by a mean of monthly HI columns.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>HI_Annual_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_April_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_August_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_Autumn_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_December_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_February_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_January_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_July_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_June_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_March_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_May_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_November_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_October_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_September_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_Spring_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>HI_Winter_Mean<\/code><\/td><td>Mean monthly Humidex over DJF; this field does not use Rothfusz.<\/td><\/tr><tr><td dir=\"ltr\"><code>WBGT_Summer_Mean<\/code><\/td><td>Mean monthly 0.7Tw+0.3T over JJA.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → heat_index_c, humidex_c, wetbulb_stull_c, wbgt_shade_c, compute_thermal_stress_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-wind-chill", "ar": "معادلات: برودة الرياح والإجهاد البارد", "en": "Equations: Wind Chill", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">T2M, WS10M<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>V_kmh = max(0, WS10M_mps)*3.6<\/code><\/p><p dir=\"ltr\"><code>WC = 13.12 +0.6215*T_C -11.37*V_kmh^0.16 +0.3965*T_C*V_kmh^0.16<\/code><\/p><p dir=\"ltr\"><code>If T_C&gt;10 or V_kmh&lt;4.8: WC=T_C<\/code><\/p><p dir=\"ltr\"><code>WC_Winter_Mean = mean(WC_12,WC_1,WC_2)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>يطبق النموذج على متوسط حرارة كل شهر تقويمي ومتوسط سرعة الرياح عند ارتفاع 10 م، بعد تحويل السرعة إلى كم/ساعة. ثم يجمع شهريًا وسنويًا وفصليًا. المجموعة الموسعة تنشر فصولًا ومدى وشهورًا إضافية عند اختيارها.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>عند الخروج من شرط البرد والرياح تعود حرارة الهواء وفق سياسة الكود، لا NULL. عند غياب مدخل لا تعوضه بصفر. متوسطات الشهر تطمس ليالي البرد الشديد، فلا تفسر النتيجة كأقصى إجهاد لحظي.<\/p><h3>مثال محسوب<\/h3><p>T=20°C تعطي WC=20 حتى لو وجدت رياح؛ المعادلة الباردة لا تطبق فوق 10°C.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>WC_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_Autumn_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_December_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_February_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_January_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_July_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_June_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_March_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_Winter_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → windchill_c, compute_winter_chill_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">T2M, WS10M<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>V_kmh = max(0, WS10M_mps)*3.6<\/code><\/p><p dir=\"ltr\"><code>WC = 13.12 +0.6215*T_C -11.37*V_kmh^0.16 +0.3965*T_C*V_kmh^0.16<\/code><\/p><p dir=\"ltr\"><code>If T_C&gt;10 or V_kmh&lt;4.8: WC=T_C<\/code><\/p><p dir=\"ltr\"><code>WC_Winter_Mean = mean(WC_12,WC_1,WC_2)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>Apply the model to climatological monthly temperature and 10-m wind-speed means after converting speed to km/h, then aggregate monthly/annual/seasonal outputs. The extended suite publishes additional seasonal/range/month fields when selected.<\/p><h3>Validity and missing-data rules<\/h3><p>Outside the cold/windy condition the code returns air temperature rather than NULL. Missing input is not zero. Monthly means smooth extreme cold nights, so this is not a peak instantaneous exposure index.<\/p><h3>Worked example<\/h3><p>T=20°C gives WC=20 even with wind; the cold formula is not applied above 10°C.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>WC_Annual_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_April_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_August_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_Autumn_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_December_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_February_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_January_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_July_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_June_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_March_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_May_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_November_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_October_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_September_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_Spring_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>WC_Winter_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → windchill_c, compute_winter_chill_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-de-martonne", "ar": "معادلات: الجفاف: دي مارتون", "en": "Equations: De Martonne Aridity", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">T2M, PRECTOTCORR<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>P_ann = sum_m max(0,C_m(P)); T_ann = mean_m C_m(T2M)<\/code><\/p><p dir=\"ltr\"><code>DM_Aridity_Annual = round(P_ann/(T_ann+10),2) if T_ann+10&gt;0.01<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>يحسب P_ann من مجموع مجاميع المطر الشهرية المناخية، وT_ann من متوسط شهور الحرارة. يستخدم المليمتر وCelsius داخليًا حتى عند اختيار وحدات عرض أخرى. لا يقرأ أعمدة Excel المقربة لإجراء المؤشر.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>يحتاج 12 شهرًا من الحرارة والمطر ومقامًا أكبر من 0.01. إذا اختلفت تغطية السنوات بين الشهور فقد يختلف P_ann الداخلي عن R_Annual_Mean الذي يعتمد السنوات المكتملة؛ تساويهما ليس مضمونًا مع الفجوات. القيم السالبة للمطر تقص إلى صفر داخل حساب الجفاف، بعد فصل القيم المفقودة.<\/p><h3>مثال محسوب<\/h3><p>مطر سنوي داخلي 600 مم وحرارة 20°C: DM=600/(20+10)=20.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>DM_Aridity_Annual<\/code><\/td><td>round(P_ann/(T_ann+10),2)<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_drought_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">T2M, PRECTOTCORR<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>P_ann = sum_m max(0,C_m(P)); T_ann = mean_m C_m(T2M)<\/code><\/p><p dir=\"ltr\"><code>DM_Aridity_Annual = round(P_ann/(T_ann+10),2) if T_ann+10&gt;0.01<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>P_ann is the sum of climatological monthly rainfall totals and T_ann the mean of climatological temperatures. Internal units are mm and Celsius even when display units differ. The index is not recomputed from rounded Excel columns.<\/p><h3>Validity and missing-data rules<\/h3><p>Requires all 12 temperature/rainfall months and denominator&gt;0.01. With uneven year coverage, internal P_ann can differ from R_Annual_Mean, which uses complete-year totals. Negative rain is clamped to zero within drought calculation after missing values are excluded.<\/p><h3>Worked example<\/h3><p>Internal annual rain 600 mm and temperature 20°C give DM=600/(20+10)=20.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>DM_Aridity_Annual<\/code><\/td><td>round(P_ann/(T_ann+10),2)<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_drought_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-pet", "ar": "معادلات: البخر والنتح: هارجريفز", "en": "Equations: Evapotranspiration", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">T2M, T2M_MAX, T2M_MIN<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><p>يستخدم هذا الحساب أيضًا خط العرض Latitude.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>J_m = [15,45,74,105,135,166,196,227,258,288,319,349][m-1]; phi=latitude*pi/180<\/code><\/p><p dir=\"ltr\"><code>delta = 0.409*sin(2*pi*J_m/365 -1.39); dr = 1+0.033*cos(2*pi*J_m/365)<\/code><\/p><p dir=\"ltr\"><code>omega_s = acos(clamp(-tan(phi)*tan(delta),-1,1))<\/code><\/p><p dir=\"ltr\"><code>Ra_MJ = (24*60/pi)*0.0820*dr*(omega_s*sin(phi)*sin(delta)+cos(phi)*cos(delta)*sin(omega_s))<\/code><\/p><p dir=\"ltr\"><code>Ra_mm = max(0,0.408*Ra_MJ)<\/code><\/p><p dir=\"ltr\"><code>PET_m = max(0,0.0023*Ra_mm*(C_m(T2M)+17.8)*sqrt(C_m(T2M_MAX)-C_m(T2M_MIN))*D_m)<\/code><\/p><p dir=\"ltr\"><code>D_m = [31,28.25,31,30,31,30,31,31,30,31,30,31]<\/code><\/p><p dir=\"ltr\"><code>ET_Annual_Mean = PET_Hargreaves_Annual = round(sum_m PET_m,1)<\/code><\/p><p dir=\"ltr\"><code>ET_Summer_Mean = round(PET_6+PET_7+PET_8,1)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>يستخدم هارجريفز-ساماني بالحرارة والمتوسط الشهري للعظمى والصغرى وخط العرض. يحسب الإشعاع خارج الغلاف Ra تقريبيًا في منتصف الشهر ثم يحوله إلى مكافئ مم/يوم ويضرب في أيام الشهر المناخية. لا يحتاج مطرًا لحساب PET ذاته. رغم اللاحقة Mean، الأعمدة السنوية والفصلية تحمل مجاميع مم/فترة؛ الشهرية مم/شهر.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>يشترط Tmax&gt;=Tmin وتوفر المدخلات الثلاثة؛ السنوي 12 شهرًا والفصل 3. فبراير=28.25 يومًا في PET المناخي الأساسي. المدى الشهري بين السنوات الاختياري يحسب PET لكل سنة بأيام التقويم الفعلية، ويقص فرق Tmax-Tmin إلى صفر؛ هذان مساران مختلفان. هذا ليس Thornthwaite أو FAO Penman-Monteith أو ET فعليًا من ميزان ماء التربة.<\/p><h3>مثال محسوب<\/h3><p>إذا كان Ra_mm=10، وT=20 وTmax=25 وTmin=15، وعدد الأيام=31: PET=0.0023×10×37.8×sqrt(10)×31 ≈85.23 مم. تستخدم الدالة خط العرض لحساب Ra الفعلي.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>ET_Annual_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_April_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_April_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_August_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_August_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_Autumn_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_December_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_December_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_February_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_February_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_January_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_January_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_July_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_July_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_June_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_June_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_March_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_March_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_May_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_May_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_November_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_November_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_October_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_October_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_September_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_September_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m])؛ ≥سنتين؛ PET لكل سنة بأيام التقويم الفعلية.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_Spring_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_Summer_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_Winter_Mean<\/code><\/td><td>قيمة PET للشهر، أو مجموع PET للشهور التابعة للفصل/السنة؛ تقريب منزلة واحدة.<\/td><\/tr><tr><td dir=\"ltr\"><code>PET_Hargreaves_Annual<\/code><\/td><td>مجموع PET_m للشهور الـ12؛ مم/سنة، تقريب منزلة.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → extraterrestrial_radiation_ra, compute_drought_fields, compute_point_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">T2M, T2M_MAX, T2M_MIN<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><p>This calculation also uses Latitude.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>J_m = [15,45,74,105,135,166,196,227,258,288,319,349][m-1]; phi=latitude*pi/180<\/code><\/p><p dir=\"ltr\"><code>delta = 0.409*sin(2*pi*J_m/365 -1.39); dr = 1+0.033*cos(2*pi*J_m/365)<\/code><\/p><p dir=\"ltr\"><code>omega_s = acos(clamp(-tan(phi)*tan(delta),-1,1))<\/code><\/p><p dir=\"ltr\"><code>Ra_MJ = (24*60/pi)*0.0820*dr*(omega_s*sin(phi)*sin(delta)+cos(phi)*cos(delta)*sin(omega_s))<\/code><\/p><p dir=\"ltr\"><code>Ra_mm = max(0,0.408*Ra_MJ)<\/code><\/p><p dir=\"ltr\"><code>PET_m = max(0,0.0023*Ra_mm*(C_m(T2M)+17.8)*sqrt(C_m(T2M_MAX)-C_m(T2M_MIN))*D_m)<\/code><\/p><p dir=\"ltr\"><code>D_m = [31,28.25,31,30,31,30,31,31,30,31,30,31]<\/code><\/p><p dir=\"ltr\"><code>ET_Annual_Mean = PET_Hargreaves_Annual = round(sum_m PET_m,1)<\/code><\/p><p dir=\"ltr\"><code>ET_Summer_Mean = round(PET_6+PET_7+PET_8,1)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>Hargreaves-Samani uses temperature, monthly maximum/minimum means and latitude. Estimate mid-month extraterrestrial Ra, convert it to mm/day equivalent, then multiply by climatological month length. PET itself does not require rainfall. Despite the Mean suffix, annual/seasonal fields are mm/period totals; monthly fields are mm/month.<\/p><h3>Validity and missing-data rules<\/h3><p>Needs Tmax&gt;=Tmin and all three temperatures; annual/seasonal totals need 12/3 months. Main climatological PET uses February=28.25 days. Optional interannual monthly ranges compute per-year PET with actual calendar days and clamp Tmax-Tmin at zero: these are distinct paths. This is not Thornthwaite, FAO Penman-Monteith or actual soil-water-balance ET.<\/p><h3>Worked example<\/h3><p>For Ra_mm=10, T=20, Tmax=25, Tmin=15 and 31 days: PET=0.0023×10×37.8×sqrt(10)×31≈85.23 mm. The function uses latitude to obtain the actual Ra.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>ET_Annual_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_April_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_April_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_August_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_August_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_Autumn_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_December_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_December_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_February_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_February_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_January_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_January_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_July_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_July_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_June_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_June_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_March_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_March_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_May_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_May_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_November_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_November_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_October_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_October_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_September_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_September_Range<\/code><\/td><td>max(PET[y,m])-min(PET[y,m]); ≥2 years; per-year PET uses actual calendar days.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_Spring_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_Summer_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>ET_Winter_Mean<\/code><\/td><td>Monthly PET or summed PET for the indicated season/year; rounded to one decimal.<\/td><\/tr><tr><td dir=\"ltr\"><code>PET_Hargreaves_Annual<\/code><\/td><td>Sum all 12 PET_m values; mm/year, rounded to one decimal.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → extraterrestrial_radiation_ra, compute_drought_fields, compute_point_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-unep", "ar": "معادلات: الجفاف: UNEP", "en": "Equations: UNEP Aridity", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">T2M, T2M_MAX, T2M_MIN, PRECTOTCORR<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><p>يستخدم هذا الحساب أيضًا خط العرض Latitude.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>UNEP_Aridity_Annual = round(P_ann/PET_ann,3) if PET_ann&gt;0.01<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>نسبة مجموع المطر المناخي إلى PET هارجريفز السنوي من نفس الحساب الداخلي. كلاهما مم/سنة؛ النتيجة نسبة بلا وحدة ولا تضرب في 100.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>يحتاج 12 شهرًا للمطر ومدخلات PET، ومقامًا أكبر من 0.01. راجع فرق P_ann الداخلي عن متوسط السنوات المكتملة عند الفجوات.<\/p><h3>مثال محسوب<\/h3><p>P_ann=600 وPET_ann=1200 مم: UNEP=0.500.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>UNEP_Aridity_Annual<\/code><\/td><td>round(P_ann/PET_ann,3)<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_drought_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">T2M, T2M_MAX, T2M_MIN, PRECTOTCORR<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><p>This calculation also uses Latitude.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>UNEP_Aridity_Annual = round(P_ann/PET_ann,3) if PET_ann&gt;0.01<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>Divide internal climatological annual rain by annual Hargreaves PET. Both are mm/year; the result is a dimensionless ratio, not multiplied by 100.<\/p><h3>Validity and missing-data rules<\/h3><p>Requires 12 rainfall/PET dependency months and denominator&gt;0.01. With gaps, distinguish internal P_ann from the mean of complete-year rainfall totals.<\/p><h3>Worked example<\/h3><p>P_ann=600 and PET_ann=1200 mm give UNEP=0.500.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>UNEP_Aridity_Annual<\/code><\/td><td>round(P_ann/PET_ann,3)<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_drought_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-water-deficit", "ar": "معادلات: العجز المائي", "en": "Equations: Water Deficit", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">T2M, T2M_MAX, T2M_MIN, PRECTOTCORR<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><p>يستخدم هذا الحساب أيضًا خط العرض Latitude.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>Water_Deficit_Annual = round(P_ann - PET_ann,1)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>يسجل الكود الفرق الموقع المطر ناقص PET. القيمة السالبة تعني أن الطلب المحتمل أكبر من المطر. لا يقص الفرق إلى صفر ولا يحول إشارته إلى عجز موجب.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>هذا فرق مناخي بسيط وليس نموذج رطوبة تربة أو جريان أو تخزين. يحتاج المطر وPET السنويين المكتملين، وقد تستخدم بعض المراجع اصطلاحًا معاكسًا للإشارة؛ اتبع اسم المعادلة هنا.<\/p><h3>مثال محسوب<\/h3><p>P_ann=600 وPET_ann=1200 مم: Water_Deficit_Annual=-600 مم.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>Water_Deficit_Annual<\/code><\/td><td>round(P_ann-PET_ann,1)<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_drought_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">T2M, T2M_MAX, T2M_MIN, PRECTOTCORR<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><p>This calculation also uses Latitude.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>Water_Deficit_Annual = round(P_ann - PET_ann,1)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>The implementation stores signed precipitation minus PET. A negative value means potential demand exceeds rainfall. It neither clips at zero nor flips the sign to a positive deficit.<\/p><h3>Validity and missing-data rules<\/h3><p>This is a simple climatic difference, not a soil-moisture, runoff or storage model. Complete annual rain/PET are required. Some references use the opposite deficit sign; follow the explicit equation here.<\/p><h3>Worked example<\/h3><p>P_ann=600 and PET_ann=1200 mm give Water_Deficit_Annual=-600 mm.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>Water_Deficit_Annual<\/code><\/td><td>round(P_ann-PET_ann,1)<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_drought_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-dry-months", "ar": "معادلات: عدد الأشهر الجافة", "en": "Equations: Dry Months", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">T2M, PRECTOTCORR<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>Dry_Months_Count = sum_m I(max(0,C_m(P)) &lt; 2*C_m(T2M))<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>يقارن مجموع مطر كل شهر مناخي بالمليمتر بضعف متوسط حرارته Celsius؛ يحسب عدد الشهور التي تحقق المقارنة الصارمة &lt; من 12 شهرًا.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>المساواة لا تعد شهرًا جافًا. يحتاج حرارة ومطرًا للشهور الـ12؛ لا يعمم عددًا محسوبًا من بعض الشهور على السنة. هذا معيار P&lt;2T التقليدي بوحداته المحددة، ولا يستبدل T بالفهرنهايت.<\/p><h3>مثال محسوب<\/h3><p>P=10 مم وT=20°C: الشهر جاف لأن 10&lt;40. إذا تكررت القيم في الشهور كلها يكون العدد 12. عند P=40 وT=20 لا يعد الشهر جافًا.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>Dry_Months_Count<\/code><\/td><td>عدد الشهور الصالحة التي P_m&lt;2T_m، بشرط اكتمال 12 شهرًا.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_drought_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">T2M, PRECTOTCORR<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>Dry_Months_Count = sum_m I(max(0,C_m(P)) &lt; 2*C_m(T2M))<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>Compare each climatological monthly rainfall total in mm with twice its Celsius temperature; count the 12 months satisfying strict &lt;.<\/p><h3>Validity and missing-data rules<\/h3><p>Equality is not dry. All 12 temperature/rainfall months are required; do not annualize a count from partial coverage. This is the conventional unit-specific P&lt;2T criterion; do not substitute Fahrenheit.<\/p><h3>Worked example<\/h3><p>P=10 mm and T=20°C is dry because 10&lt;40. Repeated for all months gives 12. P=40 and T=20 is not dry.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>Dry_Months_Count<\/code><\/td><td>Count months with P_m&lt;2T_m, requiring all 12 valid months.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_drought_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-trends", "ar": "معادلات: الاتجاهات والشذوذ عن خط الأساس", "en": "Equations: Trends & Anomalies", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">T2M, PRECTOTCORR<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>b_decade = 10*sum_i((year_i-mean(year))*(x_i-mean(x)))/sum_i((year_i-mean(year))^2)<\/code><\/p><p dir=\"ltr\"><code>Anomaly = mean(last up to 10 valid years) - mean(valid years in 1991..2020)<\/code><\/p><p dir=\"ltr\"><code>Rain_Anomaly_Pct = 100*(recent-baseline)/abs(baseline), if abs(baseline)&gt;=5 mm<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>للحرارة يستخدم متوسط السنة المكتملة وللمطر مجموعها؛ يطبق انحدار المربعات الصغرى على السنوات الفعلية ثم يضرب الميل في 10. الخط الموسمي يستخدم ثلاثة شهور مكتملة من نفس السنة. الخط الشهري يستخدم قيم نفس الشهر عبر السنوات. الشذوذ فرق أحدث حتى 10 سنوات صالحة عن خط الأساس 1991–2020؛ قد تتداخل النافذتان.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>الميل يحتاج 8 قيم سنوية/فصلية/شهرية صالحة على الأقل، ولا يشترط تواليها. الشذوذ يحتاج 20 سنة خط أساس و5 سنوات حديثة على الأقل في السلسلة المحددة؛ أقل من 5 مم في مقام شذوذ المطر النسبي يعطي NULL. الميل ليس اختبار دلالة إحصائية أو توقعًا مستقبليًا، ولا يوجد p-value أو Mann-Kendall هنا.<\/p><h3>مثال محسوب<\/h3><p>حرارة سنة 2000=10 ثم تزداد 1°C كل سنة إلى 2007 تعطي T_Annual_Trend_Decade=10°C/عقد. خط أساس مطر 100 وحديث 120 يعطي شذوذًا +20 مم و+20% عند كفاية السنوات.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>R_Annual_Anom<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Annual_Anom_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Annual_Trend_Decade<\/code><\/td><td>ميل OLS ×10 لسلسلة السنة/الفصل/شهر التقويم المحدد؛ ≥8 سنوات صالحة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_April<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_April_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_August<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_August_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_Autumn<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_Autumn_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_December<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_December_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_February<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_February_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_January<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_January_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_July<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_July_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_June<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_June_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_March<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_March_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_May<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_May_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_Month<\/code><\/td><td>متوسط القيم الشهرية الصالحة من أعمدة الشذوذ/الاتجاه، بعد حسابها وتقريبها.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_Month_Pct<\/code><\/td><td>متوسط النسب الشهرية المحسوبة والمقربة؛ ليس نسبة المتوسط السنوي بالضرورة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_November<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_November_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_October<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_October_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_September<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_September_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_Spring<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_Spring_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_Summer<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_Summer_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_Winter<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Anom_Winter_Pct<\/code><\/td><td>متوسط الحديث ناقص خط الأساس للفترة المحددة؛ النسبة ×100/abs(خط الأساس)، بشرط ≥5 مم.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_April m_i((year_i-mean(year))^2)<\/code><\/p><p dir=\"ltr\"><code>Anomaly = mean(last up to 10 valid years) - mean(valid years in 1991..2020)<\/code><\/p><p dir=\"ltr\"><code>Rain_Anomaly_Pct = 100*(recent-baseline)/abs(baseline), if abs(baseline)&gt;=5 mm<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>Use complete-year mean temperature and total rain, regress against actual year coordinates and multiply slope by 10. Seasonal trends use complete same-year three-month seasons; monthly trends use that calendar month&#x27;s values across years. Anomaly compares the latest up to 10 valid years with 1991–2020; windows may overlap.<\/p><h3>Validity and missing-data rules<\/h3><p>Slope needs at least 8 valid annual/seasonal/monthly year values, not necessarily consecutive. Anomaly needs at least 20 baseline and 5 recent values in that series; a rain-percentage baseline below 5 mm gives NULL. This is neither a significance test nor a forecast; no p-value or Mann-Kendall is calculated here.<\/p><h3>Worked example<\/h3><p>Annual temperature 10 in 2000 increasing 1°C/year through 2007 gives T_Annual_Trend_Decade=10°C/decade. A 100 mm baseline and 120 mm recent value give +20 mm and +20% when year requirements are met.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>R_Annual_Anom<\/code><\/td><td>Recent minus baseline mean for the indicated period.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Annual_Anom_Pct<\/code><\/td><td>Recent minus baseline mean for the indicated period; percentage ×100/abs(baseline), requiring ≥5 mm.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Annual_Trend_Decade<\/code><\/td><td>OLS slope ×10 for the indicated ann
