/td><\/tr><\/table><h3>Export Separate Excel Workbook per Year (also keep combined workbook) <span dir=\"ltr\">(Export_Separate_Years)<\/span><\/h3><p>For multi-year downloads, also export &lt;Element&gt;/Years/&lt;Element&gt;_&lt;Year&gt;.xls. Recomputes each year&#x27;s Data and Month summaries from that year&#x27;s data using the same units and gap filling; includes Source_Data and Daily sheets when daily saving is enabled. Reuses downloaded data. Does not create separate yearly rasters or GIS databases.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>NASA Earthdata username / اسم المستخدم — Need Sign In <span dir=\"ltr\">(Source_Username)<\/span><\/h3><p>Use your own NASA Earthdata account. Authorize GES DISC if required. Credentials are not included in MIRSAD output logs.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Source Account — Need Sign In<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>NASA Earthdata password / كلمة المرور — Need Sign In <span dir=\"ltr\">(Source_Password)<\/span><\/h3><p>Use your own NASA Earthdata account. Authorize GES DISC if required. Credentials are not included in MIRSAD output logs.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String Hidden<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Source Account — Need Sign In<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Masked / not retained<\/td><\/tr><\/table>\n"}, {"id": "parameters-stations", "ar": "مرجع معاملات المحطات", "en": "Station parameter reference", "group": "toolbox", "ar_body": "<p>هذا مرجع معاملات أداة ArcGIS، وليس قائمة أوامر Desktop. القيم المعروضة لقطة التعريف الافتراضي من Pro 3.6؛ تغيرها الواجهة حسب المصدر والنمط والعناصر. خانة Required تخص التعريف، وقد تختلف الإلزامية الفعلية في Offline أو عند تعطيل خيار تابع. المصادر الشهرية تعطل Daily. حساب CDS/IMERG الفعلي وتوافق ArcMap الأصلي ما زالا ضمن حدود التحقق المعلنة.<\/p><p>MIRSAD_Weather_Stations_Atlas_Generator.pyt · 76 معاملًا<\/p><h3>نمط اختيار محطات الأرصاد الجوية <span dir=\"ltr\">(Station_Selection_Mode)<\/span><\/h3><p>طريقة اختيار المحطات: شبكة وطنية أو تحديد مكاني/مخصص. يختلف معنى قائمة محطات فارغة باختلاف النمط.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Select by Country (National Network)<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Select by Country (National Network) | Spatial Intersect by Study Area Boundary (Polygon Clip) | Custom Station IDs (Manual Entry / From Explorer) | Global Network (Worldwide - Caution: High Station Count) | Local Saved Station Layer (Shapefile / Geodatabase) | Select Specific Stations by Country (Multiple Selection)<\/p><h3>نطاق الإقليم الجغرافي / القارة <span dir=\"ltr\">(Region_Filter)<\/span><\/h3><p>مرشح جغرافي أولي لتقليل قائمة الدول والشبكات المعروضة، دون تصحيح إحداثيات المحطات تلقائيًا.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Arab League Countries (22 Nations)<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Arab League Countries (22 Nations) | All Countries Worldwide (Global Open Dataset) | Africa | Asia | Europe | North America | South America | Oceania | Antarctica<\/p><h3>اختيار الدولة / النطاق الوطني <span dir=\"ltr\">(Select_Country)<\/span><\/h3><p>الدولة أو المجموعة الإقليمية التي تستخدم لتصفية شبكة المحطات حسب سياسة العرض الموثقة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">[All Arab League Countries (ARAB)]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> [All Arab League Countries (ARAB)] | Palestine (PS) | Egypt (EG) | Saudi Arabia (SA) | Algeria (AG) | Morocco (MO) | Iraq (IZ) | Sudan (SU) | Oman (MU) | Libya (LY) | Tunisia (TS) | Kuwait (KU) | Syria (SY) | Somalia (SO) | Jordan (JO) | United Arab Emirates (AE) | Qatar (QA) | Yemen (YM) | Mauritania (MR) | Comoros (CN) | Bahrain (BA) | Lebanon (LE) | Djibouti (DJ)<\/p><h3>اختر المحطات من الدولة (اختيار متعدد) <span dir=\"ltr\">(Selected_Stations)<\/span><\/h3><p>اختيار محطات محددة من الشبكة. في Toolbox قد يستخدم النمط الوطني الشبكة كاملة عند تركه فارغًا؛ Desktop يتطلب تحديدًا صريحًا.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>مضلع حدود منطقة الدراسة (قناع / استقطاع اختياري) <span dir=\"ltr\">(Study_Area_Polygon)<\/span><\/h3><p>مضلع لتحديد المحطات مكانيًا وضبط حدود الدراسة وقص الراستر، بحسب نمط الاختيار.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Polygon<\/p><h3>نقاط رفع إضافية داعمة (اختيارية - لتكثيف المناطق الفارغة) <span dir=\"ltr\">(Supplementary_Points)<\/span><\/h3><p>نقاط دعم إضافية عند مواقع المشروع أو المناطق غير الممثلة بمحطات. الموقع وحده لا يحولها إلى رصد محطة NOAA.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Point | Multipoint<\/p><h3>تضمين محطات النطاق العازل المجاورة (حرم 30 كم لدقة الاستيفاء) <span dir=\"ltr\">(Include_Buffer_Stations)<\/span><\/h3><p>إضافة محطات من نطاق دعم خارج حدود الدراسة لتقليل مشكلات الحافة. توثق المحطات المستخدمة وحدود القص النهائية منفصلًا.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">true<\/td><\/tr><\/table><h3>أكواد المحطات المخصصة (أكواد USAF مفصولة بفاصلة منقوطة) <span dir=\"ltr\">(Custom_Station_IDs)<\/span><\/h3><p>رموز USAF مخصصة يفصل بينها فاصلة منقوطة في مسار الاختيار. USAF وحده ليس معرفًا علميًا فريدًا؛ يحتفظ المسار أيضًا بـWBAN والموقع.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>طبقة محطات محلية محفوظة (شيب فايل أو فيتشر كلاس) <span dir=\"ltr\">(Local_Station_Features)<\/span><\/h3><p>طبقة محطات محلية محفوظة تحتوي الهويات والإحداثيات اللازمة. GHCN يحتاج حقل GHCN_ID الصريح عند استخدام مصدره.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Point | Multipoint<\/p><h3>نمط سير العمل والتشغيل <span dir=\"ltr\">(Operation_Mode)<\/span><\/h3><p>يختار التنزيل والحساب وإنتاج الأطلس، أو الاستيفاء من حقول نقاط محسوبة موجودة دون طلب بيانات مناخية جديدة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Download &amp; Generate Atlas (Full Pipeline) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Download &amp; Generate Atlas (Full Pipeline) [Default] | Interpolate &amp; Map Existing Data (Offline Mode - No Internet)<\/p><h3>نمط تنفيذ المعالجة وتدفق المهام <span dir=\"ltr\">(Execution_Workflow_Mode)<\/span><\/h3><p>يحدد تنزيل جميع البيانات أولًا ثم الحساب، أو معالجة عنصر بعد الآخر. المصادر المشتركة تحافظ على حواجز تتابع الهجين.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Batch Mode: Download All Then Process [Recommended]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Batch Mode: Download All Then Process [Recommended] | Sequential Mode: Element by Element<\/p><h3>تنزيل وحفظ بيانات النقاط فقط (تخطي الراسترات والأطلس) <span dir=\"ltr\">(Download_Only)<\/span><\/h3><p>يحفظ بيانات النقاط والجداول ويستبعد توليد أسطح الراستر والأطلس؛ لا يعني إيقاف حساب المؤشرات الجدولية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Precalculated Point Layer(s) (Offline Mode) <span dir=\"ltr\">(Precalculated_Point_Layers)<\/span><\/h3><p>طبقات نقاط تحتوي حقولًا مناخية رقمية محسوبة مسبقًا، تستخدم في وضع Offline للاستيفاء دون تنزيل.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Point | Multipoint<\/p><h3>اسم منطقة الدراسة (اختياري - لتسمية الطبقات) <span dir=\"ltr\">(Study_Area_Name)<\/span><\/h3><p>اسم وصفي لمنطقة الدراسة يستخدم في تسمية مكونات المشروع؛ لا يغير إحداثياتها أو حدودها.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>مجلد مساحة عمل المخرجات الرئيسي <span dir=\"ltr\">(Output_Workspace)<\/span><\/h3><p>مجلد حفظ المشروع وقاعدة البيانات والجداول ومجلدات العناصر. استخدم مكانًا قابلًا للكتابة خارج مجلد تثبيت البرنامج.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Folder<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>نظام الإسناد المكاني للمخرجات (Spatial Reference) <span dir=\"ltr\">(Output_Spatial_Reference)<\/span><\/h3><p>نظام إحداثيات المخرجات. اختر وحدات ومسقطًا يناسبان المسافات والاستيفاء؛ اختيار اسم نظام لا يثبت دقة كل تحويل Datum.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Spatial Reference<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>نظام وحدات القياس (متري Metric / إمبراطوري Imperial) <span dir=\"ltr\">(Measurement_Units_System)<\/span><\/h3><p>يختار Metric أو Imperial أو الوحدات المخصصة. راجع حقول الوحدات في المخرجات قبل المقارنة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Metric (Celsius °C, mm, hPa, m/s, kWh/m2/day) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Metric (Celsius °C, mm, hPa, m/s, kWh/m2/day) [Default] | Imperial (Fahrenheit °F, Inches in, inHg, mph, MJ/m2/day) | Custom Units<\/p><h3>Temperature Unit <span dir=\"ltr\">(Temperature_Unit)<\/span><\/h3><p>وحدة الحرارة في المخرجات: Celsius أو Fahrenheit أو Kelvin؛ لا يغير ذلك وحدة المصدر الخام المحفوظة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Celsius (°C) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Celsius (°C) [Default] | Fahrenheit (°F) | Kelvin (K)<\/p><h3>Precipitation Unit <span dir=\"ltr\">(Precipitation_Unit)<\/span><\/h3><p>وحدة المطر في المخرجات: ملليمتر أو بوصة. مجموع المطر الشهري يختلف عن معدل مم/يوم.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Millimeters (mm) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Millimeters (mm) [Default] | Inches (in)<\/p><h3>Pressure Unit <span dir=\"ltr\">(Pressure_Unit)<\/span><\/h3><p>وحدة الضغط الجوي/السطحي: hPa أو mbar أو kPa أو inHg بحسب الاختيار.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Hectopascals (hPa) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Hectopascals (hPa) [Default] | Millibars (mbar) | Inches of Mercury (inHg) | Kilopascals (kPa)<\/p><h3>Wind Speed Unit <span dir=\"ltr\">(Wind_Speed_Unit)<\/span><\/h3><p>وحدة سرعة الرياح: m/s أو km/h أو knot أو mph؛ اتجاه الرياح زاوية مستقلة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Meters per second (m/s) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Meters per second (m/s) [Default] | Kilometers per hour (km/h) | Knots (kt) | Miles per hour (mph)<\/p><h3>Solar Radiation Unit <span dir=\"ltr\">(Solar_Radiation_Unit)<\/span><\/h3><p>وحدة الإشعاع الشمسي وتجميعه الزمني. راجع وصف المصدر للتفريق بين W/m² والطاقة اليومية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Kilowatt-hours per square meter per day (kWh/m2/day) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Kilowatt-hours per square meter per day (kWh/m2/day) [Default] | Megajoules per square meter per day (MJ/m2/day) | Watt-hours per square meter per day (Wh/m2/day) | Calories per square centimeter per day (cal/cm2/day, Langley)<\/p><h3>Export Shapefiles (Optional) <span dir=\"ltr\">(Export_Shapefiles)<\/span><\/h3><p>يضيف ملفات Shapefile اختيارية بجانب قاعدة البيانات، مع قيود أسماء الحقول المختصرة لهذا التنسيق.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Output Options<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Create Arabic-Alias Database Copy (Optional) <span dir=\"ltr\">(Create_Arabic_Database)<\/span><\/h3><p>ينشئ نسخة قاعدة بيانات بأسماء عرض عربية للحقول؛ تظل معرفات الحقول الإنجليزية ثابتة للتوافق.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Output Options<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>مصدر البيانات المناخية ومحرك المعالجة <span dir=\"ltr\">(Climate_Data_Source)<\/span><\/h3><p>مصدر البيانات الفعلي. راجع التغطية والمتغيرات والحساب المطلوب. المصدر المستقل لا يستبدل تلقائيًا بمصدر آخر دون سياسة معلنة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Data Source<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Hybrid: NOAA Station Observations + NASA / ERA5 Gap-Filling<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Hybrid: NOAA Station Observations + NASA / ERA5 Gap-Filling | NOAA GSOD (Station Observations Only) | Open-Meteo ERA5 (Standalone - No NASA Supplement) | Hybrid: ERA5 + NASA POWER (Any Point) | Open-Meteo Historical API (ERA5 Reanalysis - High-Resolution) | NASA POWER API (Agroclimatology / MERRA-2)<\/p><h3>Resolution / Native Source Grid <span dir=\"ltr\">(OpenMeteo_Model)<\/span><\/h3><p>الافتراضي Auto يختار أدق منتج صالح لكل متغير داخل المصدر وللفترة كاملة. الاختيار اليدوي يثبت النموذج. بيانات المتغير ودقته الفعلية تحفظ في التوثيق.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Data Source<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Auto: Finest suitable model per variable [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Auto: Finest suitable model per variable [Default] | ERA5-Land (0.1 deg ~11 km API grid) [Manual] | ERA5-Seamless (0.1-0.25 deg; variable-dependent) | ERA5 (0.25 deg ~25 km API grid)<\/p><h3>Copernicus CDS API Key / Personal Token <span dir=\"ltr\">(CDS_API_Key)<\/span><\/h3><p>رمز CDS الشخصي للمستخدم بعد قبول شروط المنتج. ليس اسم المستخدم وكلمة المرور، ولا يحفظ ضمن المشروع أو السجلات.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String Hidden<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Data Source<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">مخفي / غير محفوظ<\/td><\/tr><\/table><h3>Time Mode <span dir=\"ltr\">(Time_Mode)<\/span><\/h3><p>اختيار سنة منفردة أو مدى سنوات أو تاريخي بداية ونهاية مخصصين؛ تتيح الواجهة الخانات الملائمة للنمط.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Single Year<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Single Year | Year Range | Custom Date Range<\/p><h3>Single Year (type any year) <span dir=\"ltr\">(Single_Year)<\/span><\/h3><p>السنة المطلوبة كاملة، في نمط السنة المنفردة. إتاحة السنة تعتمد على المصدر والعنصر والموقع.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">2024<\/td><\/tr><\/table><h3>Start Year (type any year) <span dir=\"ltr\">(Start_Year)<\/span><\/h3><p>أول سنة في المدى المطلوب؛ لا ينبغي أن تتجاوز سنة النهاية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">2015<\/td><\/tr><\/table><h3>End Year (type any year) <span dir=\"ltr\">(End_Year)<\/span><\/h3><p>آخر سنة في المدى المطلوب؛ آخر سنة منشورة قد لا تكون كاملة لكل العناصر.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">2024<\/td><\/tr><\/table><h3>Start Date <span dir=\"ltr\">(Start_Date)<\/span><\/h3><p>أول تاريخ في المدى المخصص. المصادر الشهرية تحتاج شهورًا كاملة ولا تنتج رصدًا يوميًا مصطنعًا.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Date<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">01/01/2024<\/td><\/tr><\/table><h3>End Date <span dir=\"ltr\">(End_Date)<\/span><\/h3><p>آخر تاريخ في المدى المخصص. راجع تأخر النشر واكتمال آخر شهر قبل تفسير القيم المفقودة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Date<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">31/12/2024<\/td><\/tr><\/table><h3>Temporal Resolution <span dir=\"ltr\">(Temporal_Resolution)<\/span><\/h3><p>الدقة الزمنية المطلوبة. المنتجات الشهرية/المركبة تقيد المعالجة الشهرية وتعطل تصدير Daily. لا يعني وجود بيانات يومية تنفيذ كل مؤشرات التطرف اليومية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Monthly<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Monthly | Daily<\/p><h3>Gap Fill Method <span dir=\"ltr\">(Gap_Fill_Method)<\/span><\/h3><p>طريقة الاستكمال الاختيارية بعد تنزيل المصادر. No Fill يترك القيم المفقودة. التقدير الشهري يوثق منفصلًا ولا يحول إلى رصد يومي.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Climatological Month Mean (Recommended)<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Climatological Month Mean (Recommended) | Linear + Boundary Interpolation | Spatial Nearest Neighbor Fallback | No Fill (skip missing)<\/p><h3>Point Tolerance (0 = off) <span dir=\"ltr\">(Point_Tolerance)<\/span><\/h3><p>مسافة دمج النقاط المتقاربة قبل بعض المعالجات؛ الصفر يعطل الدمج. تغييرها يؤثر في مجموعة المواقع المستخدمة، فراجع ملاءمتها.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Linear Unit<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Pre-Processing<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">0 Meters<\/td><\/tr><\/table><h3>Climate Modules &amp; Models <span dir=\"ltr\">(Climate_Modules)<\/span><\/h3><p>العناصر والنماذج المراد حسابها. عدم إتاحة تبعية مثل الحرارة أو المطر قد يمنع عنصرًا مشتقًا دون أن يلغي نتائج العناصر السليمة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Climate Modules &amp; Models<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Temperature | Land Surface Temperature | Precipitation | Sea Level Pressure | Surface Pressure | Wind | Relative Humidity | Dew Point | Solar Radiation | UV Index | Cloud Cover | Heat Index / Thermal Stress [Requires: Temperature, Relative Humidity] | Wind Chill / Cold Stress [Requires: Temperature, Wind] | De Martonne Aridity Index [Requires: Temperature, Precipitation] | Evapotranspiration (ET) [Requires: Temperature] | UNEP Aridity Index [Requires: Temperature, Precipitation] | Water Deficit Annual [Requires: Temperature, Precipitation] | Walter-Lieth Dry Months Count [Requires: Temperature, Precipitation] | Trends &amp; Baseline Anomalies [Requires: Temperature, Precipitation]<\/p><h3>Temporal Scope / Seasons <span dir=\"ltr\">(Temporal_Scope)<\/span><\/h3><p>تحديد الملخصات السنوية والفصول المطلوبة. فصل DJF في المحرك الحالي يتبع الأشهر 12 و1 و2 لنفس السنة المصدرة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Annual;Winter;Spring;Summer;Autumn<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Annual | Winter | Spring | Summer | Autumn<\/p><h3>Generate Monthly Climatology Rasters (Jan-Dec) <span dir=\"ltr\">(Generate_Monthly_Rasters)<\/span><\/h3><p>يطلب أسطح الشهور المناخية Jan–Dec عند استيفاء شرط المدى متعدد السنوات في المسار الحالي؛ لا ينشئ سلسلة يومية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>حفظ السلاسل الزمنية اليومية (شيتات Excel + قاعدة البيانات) <span dir=\"ltr\">(Save_Daily_Series)<\/span><\/h3><p>يحفظ السلسلة اليومية الحقيقية عندما تتاح ويكون الاختيار يوميًا. يعطل للمنتجات الشهرية/المركبة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Wind Chill Full Suite for Cold Regions (Seasons+Ranges+Monthly) <span dir=\"ltr\">(Extended_WC_Seasons)<\/span><\/h3><p>يضيف مجموعة Wind Chill الموسعة للفصول والمدى والشهور في حالات المناطق الباردة المناسبة، بدل افتراض معناها لجميع المناخات.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Monthly Ranges - Interannual Variability per Month <span dir=\"ltr\">(Monthly_Ranges)<\/span><\/h3><p>خيار مستقل لإضافة مدى تغير نفس الشهر بين السنوات؛ لا يمثل مدى درجات الحرارة داخل اليوم الواحد.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Heat Index Monthly Means (Opt-in Suite) <span dir=\"ltr\">(Extended_HI_Months)<\/span><\/h3><p>يضيف قيم Heat Index الشهرية الاختيارية. تفسير أشهر الشتاء يحتاج مراعاة صلاحية النموذج كما يشرح الدليل العلمي.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Field Filter Scope <span dir=\"ltr\">(Field_Filter_Scope)<\/span><\/h3><p>ينظم مجموعة الحقول المنشورة: المجموعة الكاملة أو فترات/فصول/حقول محددة. تظهر خانات الاختيار التابعة حسب النمط.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Full Suite (Annual + Seasonal + Monthly) [Recommended]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Full Suite (Annual + Seasonal + Monthly) [Recommended] | Annual Summaries Only | Seasonal Summaries Only | Monthly Climatology Only (Jan - Dec) | Filter by Specific Seasons &amp; Aggregations | Custom Field Checklist<\/p><h3>Included Summary Periods <span dir=\"ltr\">(Included_Aggregations)<\/span><\/h3><p>مستويات الملخصات المطلوبة عند استخدام مرشح الفترات، مثل السنوي والموسمي.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">&#x27;Annual Summaries&#x27;;&#x27;Seasonal Summaries&#x27;;&#x27;Extreme &amp; Bioclimatic Indices&#x27;<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Annual Summaries | Seasonal Summaries | Detailed Monthly Climatology (Jan-Dec) | Extreme &amp; Bioclimatic Indices<\/p><h3>Included Seasons <span dir=\"ltr\">(Included_Seasons)<\/span><\/h3><p>الفصول المطلوبة عند استخدام مرشح الفصول؛ اختيارها يغير مجموعة الملخصات المنشورة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">&#x27;Winter (DJF)&#x27;;&#x27;Spring (MAM)&#x27;;&#x27;Summer (JJA)&#x27;;&#x27;Autumn (SON)&#x27;<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Winter (DJF) | Spring (MAM) | Summer (JJA) | Autumn (SON)<\/p><h3>Variables Selection (Checklist) <span dir=\"ltr\">(Selected_Fields)<\/span><\/h3><p>قائمة الحقول المناخية المحددة للحساب والتصدير في نمط الاختيار المخصص.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>طريقة الاستيفاء المكاني للراستر <span dir=\"ltr\">(Interpolation_Method)<\/span><\/h3><p>طريقة الاستيفاء المكاني مثل IDW وKriging وSpline وNatural Neighbor. خيارات Toolbox تتبع Spatial Analyst؛ خيارات Desktop وحدود تكافئها موضحة منفصلًا.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">IDW<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> IDW | Ordinary Kriging | Spline | Natural Neighbor<\/p><h3>حجم الخلية الأساسي لأسطح الراستر (بالأمتار) <span dir=\"ltr\">(Base_Cell_Size)<\/span><\/h3><p>حجم بكسل سطح الإخراج بوحدات المعالجة المعلنة. بكسل أصغر لا يزيد دقة المصدر المناخي الأصلية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Linear Unit<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">500 Meters<\/td><\/tr><\/table><h3>Wind Vector Spacing / Cell Size (Meters) <span dir=\"ltr\">(Wind_Factor_Cell_Size)<\/span><\/h3><p>تباعد نقاط/أسهم الرياح بصورة مستقلة عن خلية سطح العناصر الأخرى، ويتاح عند اختيار الرياح.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Linear Unit<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">25000 Meters<\/td><\/tr><\/table><h3>IDW Curve Profile <span dir=\"ltr\">(IDW_Curve_Profile)<\/span><\/h3><p>إعداد جاهز لمنحنى تناقص وزن المسافة في IDW؛ يضبط قيمة القوة المرتبطة به.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Gentle / Smooth (Power 1.2)<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Gentle / Smooth (Power 1.2) | Standard Quadratic (Power 2.0) | Regional Broad (Power 0.7) | Custom Power<\/p><h3>IDW Power <span dir=\"ltr\">(IDW_Power)<\/span><\/h3><p>أس تناقص وزن المسافة في IDW. زيادة القيمة تزيد التأثير النسبي للنقاط القريبة؛ ليست شهادة على دقة أعلى.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">1.2<\/td><\/tr><\/table><h3>IDW Search Radius Type <span dir=\"ltr\">(IDW_Search_Type)<\/span><\/h3><p>حي بحث IDW متغير بعدد جيران أو نصف قطر ثابت؛ يحدد متى تستخدم مسافة البحث.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Variable<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Variable | Fixed<\/p><h3>IDW Number of Points <span dir=\"ltr\">(IDW_Num_Points)<\/span><\/h3><p>عدد الجيران المستخدم في بحث IDW بحسب نوع الحي المختار وتوافر النقاط.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">12<\/td><\/tr><\/table><h3>IDW Maximum Distance (metres, optional) <span dir=\"ltr\">(IDW_Max_Distance)<\/span><\/h3><p>حد مسافة البحث في IDW بالأمتار؛ يجب تفسيره مع نوع الحي وتوزيع النقاط.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Kriging Semivariogram Model <span dir=\"ltr\">(Krig_Model)<\/span><\/h3><p>شكل نموذج التغاير النصفي في Kriging. يعتمد ملاءمته على البيانات والتوزيع المكاني، وليس الاسم وحده.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Spherical<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Spherical | Circular | Exponential | Gaussian<\/p><h3>Kriging Type <span dir=\"ltr\">(Krig_Type)<\/span><\/h3><p>اختيار Ordinary أو Universal في مسار Toolbox عند إتاحته؛ لا يعني تطابق جميع الخيارات مع Desktop.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Ordinary<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Ordinary | Universal<\/p><h3>Kriging Number of Points <span dir=\"ltr\">(Krig_Num_Points)<\/span><\/h3><p>عدد الجيران لبحث Kriging في مسار الاستيفاء المحدد.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">12<\/td><\/tr><\/table><h3>Spline Type <span dir=\"ltr\">(Spline_Type)<\/span><\/h3><p>نوع Spline مثل Tension أو Regularized. يختلف سلوك السطح والتجاوز خارج قيم العينات حسب النوع والإعدادات.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Tension<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Tension | Regularized<\/p><h3>Spline Weight <span dir=\"ltr\">(Spline_Weight)<\/span><\/h3><p>معامل وزن/شد Spline، ويفسر وفق نوع Spline المختار؛ لا يقاس بدقة شبكة المصدر.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">5<\/td><\/tr><\/table><h3>Spline Number of Points <span dir=\"ltr\">(Spline_Num_Points)<\/span><\/h3><p>عدد النقاط المستخدمة محليًا في حساب سطح Spline.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">12<\/td><\/tr><\/table><h3>Enable Raster Reclassification <span dir=\"ltr\">(Enable_Raster_Reclass)<\/span><\/h3><p>يطلب نسخة مصنفة من السطح المستمر؛ راجع عدد الفئات وطريقتها، مع الاحتفاظ بالقيم المستمرة اللازمة للتحليل.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Raster Reclassification<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Number of Classes <span dir=\"ltr\">(Reclass_Classes_Count)<\/span><\/h3><p>عدد فئات التصنيف في النطاق المسموح. تتاح الخانة عند تفعيل التصنيف.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Raster Reclassification<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">7<\/td><\/tr><\/table><h3>Classification Method <span dir=\"ltr\">(Reclass_Method)<\/span><\/h3><p>الطريقة الإحصائية لتقسيم قيم السطح إلى فئات؛ تؤثر في العرض وحدود الفئات، ولا تغير المصدر الخام.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Raster Reclassification<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Natural Breaks (Jenks)<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Natural Breaks (Jenks) | Equal Interval | Equal Area (Quantile) | Geometric Interval | Standard Deviation<\/p><h3>Create PSL Isobar Contour (Optional) <span dir=\"ltr\">(Create_Isobars)<\/span><\/h3><p>طلب خطوط الضغط المتساوي عندما تتاح أسطح الضغط المناسبة في Toolbox؛ ليس خيارًا عامًا لكل العناصر.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Pressure Contour<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Pressure Contour Scheme (Optional) <span dir=\"ltr\">(Pressure_Interval_Scheme)<\/span><\/h3><p>اختيار فاصل خطوط الضغط من إعدادات جاهزة أو فاصل مخصص.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Pressure Contour<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Global Standard (4 mbar)<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Global Standard (4 mbar) | Local Detailed (2 mbar) | Custom Interval<\/p><h3>Custom Pressure Step (mbar) (Optional) <span dir=\"ltr\">(Custom_Pressure_Step)<\/span><\/h3><p>الفاصل المخصص لخطوط الضغط بوحدة mbar/hPa، ويجب أن يكون موجبًا عند تفعيل المخطط المخصص.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Pressure Contour<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">4<\/td><\/tr><\/table><h3>Apply Focal Smoothing <span dir=\"ltr\">(Focal_Smoothing)<\/span><\/h3><p>يفعل تنعيمًا مكانيًا لسطح الراستر الناتج؛ يغير السطح المنشور، لذا يوثق عند مقارنة النتائج.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Post-Processing<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Focal Statistic <span dir=\"ltr\">(Focal_Statistic)<\/span><\/h3><p>إحصاء النافذة المجاورة المستخدم عند تفعيل التنعيم مثل المتوسط.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Post-Processing<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">MEAN<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> MEAN | MEDIAN | MINIMUM | MAXIMUM | STD<\/p><h3>Focal Neighborhood (cells) <span dir=\"ltr\">(Focal_Neighborhood)<\/span><\/h3><p>حجم النافذة المربعة بعدد الخلايا، مثل 3×3. أثرها يعتمد على حجم الخلية الفعلي.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Post-Processing<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">3<\/td><\/tr><\/table><h3>Add Results To Current Map <span dir=\"ltr\">(Add_To_Map)<\/span><\/h3><p>إضافة النتائج النهائية إلى خريطة ArcGIS الحالية بعد التنفيذ، دون تغيير مجموعة النقاط الأصلية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Map Options<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Map Add Modules (elements to add) <span dir=\"ltr\">(Map_Add_Modules)<\/span><\/h3><p>العناصر التي تضاف نتائجها إلى الخريطة عند تفعيل Add To Map.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Map Options<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Purge Intermediate Cache <span dir=\"ltr\">(Purge_Cache)<\/span><\/h3><p>حذف الوسائط المؤقتة التي يملكها التشغيل بعد الاستخدام؛ لا يقصد به حذف المدخلات أو المخرجات النهائية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Maintenance &amp; Cache<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">true<\/td><\/tr><\/table><h3>تصدير ملف Excel مستقل لكل سنة (بالإضافة إلى الملف المجمع) <span dir=\"ltr\">(Export_Separate_Years)<\/span><\/h3><p>ينشئ ملفات سنوات منفردة بجانب الملف المجمع، بإعادة الحساب من بيانات كل سنة وليس بتكرار المتوسط متعدد السنوات.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>NASA Earthdata username / اسم المستخدم — Need Sign In <span dir=\"ltr\">(Source_Username)<\/span><\/h3><p>اسم مستخدم NASA Earthdata الخاص بك عند اختيار IMERG. قد تحتاج إجازة GES DISC في حسابك.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Source Account — Need Sign In<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>NASA Earthdata password / كلمة المرور — Need Sign In <span dir=\"ltr\">(Source_Password)<\/span><\/h3><p>كلمة مرور NASA Earthdata الخاصة بك لطلب IMERG، وتعرض مقنعة ولا تحفظ ضمن طلبات المشروع أو السجلات.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String Hidden<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Source Account — Need Sign In<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">مخفي / غير محفوظ<\/td><\/tr><\/table>\n", "en_body": "<p>This references the ArcGIS tool, not an identical Desktop command list. Values are a Pro 3.6 default-definition snapshot; controls change with provider, mode and modules. Required describes the declaration; runtime requirements can differ in Offline or disabled dependent controls. Monthly products disable Daily. Authenticated CDS/IMERG and native ArcMap verification limits remain explicit.<\/p><p>MIRSAD_Weather_Stations_Atlas_Generator.pyt · 76 parameters<\/p><h3>Station Selection Mode <span dir=\"ltr\">(Station_Selection_Mode)<\/span><\/h3><p>Choose how weather stations are chosen:<br>• &#x27;Select by Country (National Network)&#x27;: filters certified NOAA/WMO stations by country or region.<br>• &#x27;Spatial Intersect by Study Area Boundary&#x27;: clips stations falling within your polygon boundary (+ optional buffer).<br>• &#x27;Custom Station IDs&#x27;: specify USAF/WMO station IDs directly.<br>• &#x27;Global Network&#x27;: process all global stations worldwide.<br>• &#x27;Local Saved Station Layer&#x27;: load a pre-saved station feature layer from disk.<br>• &#x27;Select Specific Stations by Country&#x27;: choose a country, then one or more named stations.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Select by Country (National Network)<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Select by Country (National Network) | Spatial Intersect by Study Area Boundary (Polygon Clip) | Custom Station IDs (Manual Entry / From Explorer) | Global Network (Worldwide - Caution: High Station Count) | Local Saved Station Layer (Shapefile / Geodatabase) | Select Specific Stations by Country (Multiple Selection)<\/p><h3>Geographic Region / Continent Filter <span dir=\"ltr\">(Region_Filter)<\/span><\/h3><p>First-tier spatial filter to narrow down country list.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Arab League Countries (22 Nations)<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Arab League Countries (22 Nations) | All Countries Worldwide (Global Open Dataset) | Africa | Asia | Europe | North America | South America | Oceania | Antarctica<\/p><h3>Select Country / Scope <span dir=\"ltr\">(Select_Country)<\/span><\/h3><p>Second-tier national network filter or aggregate scope (e.g. All Arab League, All Asian).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">[All Arab League Countries (ARAB)]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> [All Arab League Countries (ARAB)] | Palestine (PS) | Egypt (EG) | Saudi Arabia (SA) | Algeria (AG) | Morocco (MO) | Iraq (IZ) | Sudan (SU) | Oman (MU) | Libya (LY) | Tunisia (TS) | Kuwait (KU) | Syria (SY) | Somalia (SO) | Jordan (JO) | United Arab Emirates (AE) | Qatar (QA) | Yemen (YM) | Mauritania (MR) | Comoros (CN) | Bahrain (BA) | Lebanon (LE) | Djibouti (DJ)<\/p><h3>Select Station(s) from Country (Multiple Selection) <span dir=\"ltr\">(Selected_Stations)<\/span><\/h3><p>Choose a region and country, then optionally select stations in national network mode. Leave empty to process the full national network. In &#x27;Select Specific Stations by Country&#x27; mode, at least one station is required. Labels show station name, USAF/WBAN codes and country.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Study Area Boundary Polygon (Optional Mask / Clip) <span dir=\"ltr\">(Study_Area_Polygon)<\/span><\/h3><p>OPTIONAL polygon feature layer. Used to spatially clip weather stations, define the processing extent/mask, and clip output rasters.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Polygon<\/p><h3>Supplementary Survey Points (Optional - To Densify Data-Sparse Areas) <span dir=\"ltr\">(Supplementary_Points)<\/span><\/h3><p>OPTIONAL point feature layer (shapefile or geodatabase feature class). Custom sampling points (e.g., in unmonitored desert regions or project sites) will be automatically merged with the selected certified weather stations to enhance spatial interpolation coverage.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Point | Multipoint<\/p><h3>Include Neighboring Buffer Stations (30 km Halo for Interpolation) <span dir=\"ltr\">(Include_Buffer_Stations)<\/span><\/h3><p>When polygon clipping is active, includes stations within a 30 km halo outside the boundary to prevent edge degradation and distortion during spatial interpolation.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">true<\/td><\/tr><\/table><h3>Custom Station IDs (Semicolon-Separated USAF Codes) <span dir=\"ltr\">(Custom_Station_IDs)<\/span><\/h3><p>OPTIONAL. Enter semicolon-separated USAF station codes (e.g. 623660;624140;623180).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Local Station Layer (Optional Point Layer) <span dir=\"ltr\">(Local_Station_Features)<\/span><\/h3><p>OPTIONAL. Load a pre-existing weather stations shapefile or GDB feature class.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Point | Multipoint<\/p><h3>Operation Mode <span dir=\"ltr\">(Operation_Mode)<\/span><\/h3><p>REQUIRED. Choose operation mode:<br>&#x27;Download &amp; Generate Atlas (Full Pipeline)&#x27;: Online mode. Queries climate data for input points, computes indicators, builds feature classes, and interpolates rasters.<br>&#x27;Interpolate &amp; Map Existing Data (Offline Mode)&#x27;: Offline mode. No internet queries. Takes a precalculated point layer already containing climate fields and directly performs spatial interpolation, masking, and atlas map generation.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Download &amp; Generate Atlas (Full Pipeline) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Download &amp; Generate Atlas (Full Pipeline) [Default] | Interpolate &amp; Map Existing Data (Offline Mode - No Internet)<\/p><h3>Execution Workflow Mode <span dir=\"ltr\">(Execution_Workflow_Mode)<\/span><\/h3><p>DOWNLOAD MODE ONLY. Choose workflow execution architecture:<br>&#x27;Batch Mode: Download All Then Process&#x27; (recommended): Queries and saves data for all requested climate modules and submodels into the Geodatabase first, ensuring total data safety against network interruptions, then interpolates all surfaces in a second pass.<br>&#x27;Sequential Mode: Element by Element&#x27;: Queries, computes, and interpolates surfaces for each climate module one by one, providing immediate visual progress in the map layout.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Batch Mode: Download All Then Process [Recommended]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Batch Mode: Download All Then Process [Recommended] | Sequential Mode: Element by Element<\/p><h3>Download &amp; Save Point Data Only (Skip Rasters &amp; Atlas) <span dir=\"ltr\">(Download_Only)<\/span><\/h3><p>OPTIONAL (default OFF). When checked, the tool downloads climate data and saves complete point feature classes and Excel tables for each element, but skips surface interpolation, raster creation, contours, and layer styling.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Precalculated Point Layer(s) (Offline Mode) <span dir=\"ltr\">(Precalculated_Point_Layers)<\/span><\/h3><p>REQUIRED for Offline mode. One or more existing point layers (from GDB or Shapefile) containing pre-calculated climate attributes. The tool automatically merges them by coordinates/Source_ID.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Point | Multipoint<\/p><h3>Study Area Name (Optional) <span dir=\"ltr\">(Study_Area_Name)<\/span><\/h3><p>OPTIONAL. Name of the study area (e.g. &#x27;Egypt&#x27;, &#x27;Sinai&#x27;, &#x27;Aswan&#x27;, &#x27;Nile Basin&#x27;). Used to title the atlas, name the boundary layer archived in GDB, and generate the Classification Workbook.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Output Folder Workspace <span dir=\"ltr\">(Output_Workspace)<\/span><\/h3><p>Writable project output directory, with the dated climate database, element folders, tables and reports. Keep user projects outside the application installation.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Folder<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Output Spatial Reference <span dir=\"ltr\">(Output_Spatial_Reference)<\/span><\/h3><p>OPTIONAL. Target coordinate system for all outputs. DEFAULT: same as input points.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Spatial Reference<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Measurement Units System <span dir=\"ltr\">(Measurement_Units_System)<\/span><\/h3><p>Select the measurement units system for atlas outputs.<br>• Metric (Default): Celsius (°C), Millimeters (mm), Hectopascals (hPa), Meters/second (m/s), kWh/m2/day conforming to WMO and Egyptian standards.<br>• Imperial: Fahrenheit (°F), Inches (in), Inches of Mercury (inHg), Miles/hour (mph), MJ/m2/day.<br>• Custom Units: Manually customize units for each climate variable below.<br><\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Metric (Celsius °C, mm, hPa, m/s, kWh/m2/day) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Metric (Celsius °C, mm, hPa, m/s, kWh/m2/day) [Default] | Imperial (Fahrenheit °F, Inches in, inHg, mph, MJ/m2/day) | Custom Units<\/p><h3>Temperature Unit <span dir=\"ltr\">(Temperature_Unit)<\/span><\/h3><p>Measurement unit for temperature variables: Celsius (°C, default), Fahrenheit (°F), or Kelvin (K).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Celsius (°C) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Celsius (°C) [Default] | Fahrenheit (°F) | Kelvin (K)<\/p><h3>Precipitation Unit <span dir=\"ltr\">(Precipitation_Unit)<\/span><\/h3><p>Measurement unit for precipitation and rainfall: Millimeters (mm, default) or Inches (in).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Millimeters (mm) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Millimeters (mm) [Default] | Inches (in)<\/p><h3>Pressure Unit <span dir=\"ltr\">(Pressure_Unit)<\/span><\/h3><p>Measurement unit for atmospheric and sea level pressure: Hectopascals (hPa, default), Millibars (mbar), Inches of Mercury (inHg), or Kilopascals (kPa).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Hectopascals (hPa) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Hectopascals (hPa) [Default] | Millibars (mbar) | Inches of Mercury (inHg) | Kilopascals (kPa)<\/p><h3>Wind Speed Unit <span dir=\"ltr\">(Wind_Speed_Unit)<\/span><\/h3><p>Measurement unit for surface wind speed: Meters/second (m/s, default), km/h, kt, or mph.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Meters per second (m/s) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Meters per second (m/s) [Default] | Kilometers per hour (km/h) | Knots (kt) | Miles per hour (mph)<\/p><h3>Solar Radiation Unit <span dir=\"ltr\">(Solar_Radiation_Unit)<\/span><\/h3><p>Measurement unit for surface solar radiation: Kilowatt-hours/m2/day (kWh/m2/day, default in Egypt &amp; WMO), Megajoules/m2/day (MJ/m2/day), Watt-hours/m2/day (Wh/m2/day), or Calories/cm2/day (cal/cm2/day, Langley).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Kilowatt-hours per square meter per day (kWh/m2/day) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Kilowatt-hours per square meter per day (kWh/m2/day) [Default] | Megajoules per square meter per day (MJ/m2/day) | Watt-hours per square meter per day (Wh/m2/day) | Calories per square centimeter per day (cal/cm2/day, Langley)<\/p><h3>Export Shapefiles (Optional) <span dir=\"ltr\">(Export_Shapefiles)<\/span><\/h3><p>OPTIONAL (default OFF). When checked, exports per-element shapefiles to the Export_SHP folder and wind vector shapefiles. When unchecked, only the File Geodatabase, rasters and tables are produced.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Output Options<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Create Arabic-Alias Database Copy (Optional) <span dir=\"ltr\">(Create_Arabic_Database)<\/span><\/h3><p>OPTIONAL (default OFF). Creates a second GDB copy (&lt;name&gt;_AR.gdb) with Arabic field aliases only - field names stay English so the copy remains reusable as offline input. For Arabic users to read and understand the columns.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Output Options<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Climate Data Source <span dir=\"ltr\">(Climate_Data_Source)<\/span><\/h3><p>The selected provider controls actual requests and supported variables. See Sources for coverage, sign-in and standalone versus Hybrid policy.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Data Source<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Hybrid: NOAA Station Observations + NASA / ERA5 Gap-Filling<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Hybrid: NOAA Station Observations + NASA / ERA5 Gap-Filling | NOAA GSOD (Station Observations Only) | Open-Meteo ERA5 (Standalone - No NASA Supplement) | Hybrid: ERA5 + NASA POWER (Any Point) | Open-Meteo Historical API (ERA5 Reanalysis - High-Resolution) | NASA POWER API (Agroclimatology / MERRA-2)<\/p><h3>Resolution / Native Source Grid <span dir=\"ltr\">(OpenMeteo_Model)<\/span><\/h3><p>Auto chooses the finest suitable product per variable and whole interval within the selected source; manual profiles fix a model. Actual product resolution is retained in provenance.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Data Source<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Auto: Finest suitable model per variable [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Auto: Finest suitable model per variable [Default] | ERA5-Land (0.1 deg ~11 km API grid) [Manual] | ERA5-Seamless (0.1-0.25 deg; variable-dependent) | ERA5 (0.25 deg ~25 km API grid)<\/p><h3>Copernicus CDS API Key / Personal Token <span dir=\"ltr\">(CDS_API_Key)<\/span><\/h3><p>Need Sign In: your own CDS personal token. Accept the dataset terms on CDS. Never include the token in shared projects or logs. Public sources do not require it.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String Hidden<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Data Source<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Masked / not retained<\/td><\/tr><\/table><h3>Time Mode <span dir=\"ltr\">(Time_Mode)<\/span><\/h3><p>REQUIRED. &#x27;Single Year&#x27; queries January-December of one year. &#x27;Year Range&#x27; computes multi-year climatological normals. &#x27;Custom Date Range&#x27; queries specific start/end dates via calendar or text.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Single Year<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Single Year | Year Range | Custom Date Range<\/p><h3>Single Year (type any year) <span dir=\"ltr\">(Single_Year)<\/span><\/h3><p>Type any year you need (free entry, no list).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">2024<\/td><\/tr><\/table><h3>Start Year (type any year) <span dir=\"ltr\">(Start_Year)<\/span><\/h3><p>Type the first year of the period (free entry, no list).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">2015<\/td><\/tr><\/table><h3>End Year (type any year) <span dir=\"ltr\">(End_Year)<\/span><\/h3><p>Type the last year of the period (free entry, no list).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">2024<\/td><\/tr><\/table><h3>Start Date <span dir=\"ltr\">(Start_Date)<\/span><\/h3><p>CUSTOM DATE RANGE ONLY. Pick from the built-in calendar (any past or future year) or type the date directly.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Date<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">01/01/2024<\/td><\/tr><\/table><h3>End Date <span dir=\"ltr\">(End_Date)<\/span><\/h3><p>CUSTOM DATE RANGE ONLY. Pick from the built-in calendar (any past or future year) or type the date directly.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Date<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">31/12/2024<\/td><\/tr><\/table><h3>Temporal Resolution <span dir=\"ltr\">(Temporal_Resolution)<\/span><\/h3><p>Daily preserves actual daily observations where supported. Native monthly/composite products force Monthly and disable Daily export; this does not implement every daily extreme index.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Monthly<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Monthly | Daily<\/p><h3>Gap Fill Method <span dir=\"ltr\">(Gap_Fill_Method)<\/span><\/h3><p>OPTIONAL. How to handle missing months or stations (NoData/-999). &#x27;Climatological Month Mean&#x27; (recommended): fills gaps with the average of the same calendar month across years, with station mean fallback. &#x27;Linear + Boundary Interpolation&#x27;: fills interior gaps linearly and endpoints using boundary fill. &#x27;Spatial Nearest Neighbor Fallback&#x27;: estimates missing fields from nearest valid spatial stations. &#x27;No Fill&#x27;: ignores missing values.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Climatological Month Mean (Recommended)<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Climatological Month Mean (Recommended) | Linear + Boundary Interpolation | Spatial Nearest Neighbor Fallback | No Fill (skip missing)<\/p><h3>Point Tolerance (0 = off) <span dir=\"ltr\">(Point_Tolerance)<\/span><\/h3><p>OPTIONAL (default 0 = OFF). Merges points closer than this distance before download to reduce interpolation artifacts.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Linear Unit<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Pre-Processing<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">0 Meters<\/td><\/tr><\/table><h3>Climate Modules &amp; Models <span dir=\"ltr\">(Climate_Modules)<\/span><\/h3><p>Select primary climate modules and applied bioclimatic models to compute and export. Submodels (De Martonne, Evapotranspiration, UNEP, Water Deficit, Walter-Lieth, Heat Index) are located at the bottom of the list and can be selected directly; prerequisite variables are retrieved automatically if not selected.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Climate Modules &amp; Models<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Temperature | Land Surface Temperature | Precipitation | Sea Level Pressure | Surface Pressure | Wind | Relative Humidity | Dew Point | Solar Radiation | UV Index | Cloud Cover | Heat Index / Thermal Stress [Requires: Temperature, Relative Humidity] | Wind Chill / Cold Stress [Requires: Temperature, Wind] | De Martonne Aridity Index [Requires: Temperature, Precipitation] | Evapotranspiration (ET) [Requires: Temperature] | UNEP Aridity Index [Requires: Temperature, Precipitation] | Water Deficit Annual [Requires: Temperature, Precipitation] | Walter-Lieth Dry Months Count [Requires: Temperature, Precipitation] | Trends &amp; Baseline Anomalies [Requires: Temperature, Precipitation]<\/p><h3>Temporal Scope / Seasons <span dir=\"ltr\">(Temporal_Scope)<\/span><\/h3><p>TEMPORAL MATRIX SCOPE. Select which temporal scopes and seasons to compute and map (Annual, Winter, Spring, Summer, Autumn). Uncheck any seasons not needed (e.g. keep only Annual for fast regional atlas, or Summer only for heat waves). The tool computes only the Cartesian product of selected Climate Modules and selected Temporal Scope.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Annual;Winter;Spring;Summer;Autumn<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Annual | Winter | Spring | Summer | Autumn<\/p><h3>Generate Monthly Climatology Rasters (Jan-Dec) <span dir=\"ltr\">(Generate_Monthly_Rasters)<\/span><\/h3><p>Request monthly climatology surfaces when the current multi-year interval requirement is satisfied. This never synthesizes daily observations.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Save Daily Time Series (Excel Sheets + GDB Table) <span dir=\"ltr\">(Save_Daily_Series)<\/span><\/h3><p>When enabled (with Daily temporal resolution), saves the complete daily time series into Daily sheets in Excel and a table inside the Geodatabase. Large daily series use additional Excel sheets; CSV is used only if Excel export fails.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Wind Chill Full Suite for Cold Regions (Seasons+Ranges+Monthly) <span dir=\"ltr\">(Extended_WC_Seasons)<\/span><\/h3><p>OPT-IN FOR COLD REGIONS ONLY (e.g. Patagonia, Iceland, high mountains, Canada): publishes WC_Spring/Summer/Autumn_Mean, WC_Annual_Range and the 12 monthly WC means in addition to WC_Winter_Mean and WC_Annual_Mean. OFF by default: warm regions (e.g. Egypt) keep the clean 2-field schema, where extra fields would merely repeat air temperature (passthrough). Same NWS equation/threshold.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Monthly Ranges - Interannual Variability per Month <span dir=\"ltr\">(Monthly_Ranges)<\/span><\/h3><p>OPT-IN, independent toggle (default OFF): adds per-calendar-month interannual ranges (&lt;Prefix&gt;_&lt;Month&gt;_Range, e.g. ET_December_Range = wettest December minus driest December across years) for the mean-type modules (T, R, PSL, PS, Wind speed, RH, Td, Solar, UV, Cloud, ET). Wind direction excluded. Month sheet and Month/ rasters carry them like the monthly means. Needs &gt;= 2 valid years per month; gap-filled months yield 0.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Heat Index Monthly Means (Opt-in Suite) <span dir=\"ltr\">(Extended_HI_Months)<\/span><\/h3><p>OPT-IN, independent toggle (default OFF): publishes the 12 monthly Rothfusz heat-index means (HI_January_Mean ... HI_December_Mean) in addition to the 8 base Heat Index fields. Documented winter caveat: monthly values use Rothfusz year-round (= air T below 26.7C), while the seasonal HI_Winter_Mean uses Humidex. Month sheet and Month/ rasters carry them like the other monthly m
