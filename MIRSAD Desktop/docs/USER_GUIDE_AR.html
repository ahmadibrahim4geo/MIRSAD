3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>W_Dir_Annual_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_April_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_August_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_Autumn_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_December_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_February_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_January_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_July_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_June_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_March_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_May_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_November_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_October_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_September_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_Spring_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_Summer_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_Winter_Mean<\/code><\/td><td>متوسط دائري للاتجاهات الشهرية الصالحة التابعة للفترة؛ أوزان متساوية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_Annual_Max_Month<\/code><\/td><td>أعلى قيمة للسرعة الشهرية المناخية؛ الناتج سرعة وليس رقم الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_Annual_Min_Month<\/code><\/td><td>أدنى قيمة للسرعة الشهرية المناخية؛ الناتج سرعة وليس رقم الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><c x_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_Winter_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_wind_fields, circular_mean_deg<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">WS10M, WD10M<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>W_Spd_Annual_Mean = mean_m C_m(WS10M)<\/code><\/p><p dir=\"ltr\"><code>S = mean_i sin(theta_i*pi/180); C = mean_i cos(theta_i*pi/180)<\/code><\/p><p dir=\"ltr\"><code>W_Dir = atan2(S,C)*180/pi mod 360<\/code><\/p><p dir=\"ltr\"><code>W_Spd_Annual_Range = max_m C_m(WS10M) - min_m C_m(WS10M)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>WS10M speed uses arithmetic aggregation. WD10M direction uses sine/cosine circular averaging. Annual direction uses all valid monthly directions across years; seasonal direction uses records whose month belongs to the season. Weights are equal, not speed-weighted.<\/p><h3>Validity and missing-data rules<\/h3><p>No valid directions, or both mean components below 1e-12, gives NULL. Do not average angles arithmetically or use a linear direction range. Convert degrees to radians inside sin/cos.<\/p><h3>Worked example<\/h3><p>350° and 10° average near 0°, not 180°. Opposing 90° and 270° cancel and give NULL.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>W_Dir_Annual_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_April_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_August_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_Autumn_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_December_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_February_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_January_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_July_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_June_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_March_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_May_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_November_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period; equal weights.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Dir_October_Mean<\/code><\/td><td>Circular mean of valid monthly directions in the indicated period d dir=\"ltr\"><code>W_Spd_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>W_Spd_Winter_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_wind_fields, circular_mean_deg<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-humidity", "ar": "معادلات: الرطوبة النسبية", "en": "Equations: Relative Humidity", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">RH2M<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>RH_Annual_Mean = mean_m C_m(RH2M)<\/code><\/p><p dir=\"ltr\"><code>RH_Annual_Range = max_m C_m(RH2M) - min_m C_m(RH2M)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>RH2M رطوبة نسبية بالمئة، تؤخذ من المصدر أو من تحويل المصدر المعلن، ثم تجمع بقاعدة المتوسط. إذا كانت بيانات المصدر كسرًا بين 0 و1 يجب تحويلها إلى المئة قبل المحرك.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>المحرك العام لا يعيد اشتقاق RH من الأعمدة المناخية المعروضة. محول CDS يشتقها من الحرارة والندى بطريقة Magnus الموضحة في صفحة التحويلات. قص الرطوبة إلى 0..100 داخل HI لا يعني قص كل صادرات الرطوبة تلقائيًا.<\/p><h3>مثال محسوب<\/h3><p>شهور رطوبتها 60% كلها تعطي RH_Annual_Mean=60 وRH_Annual_Range=0.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>RH_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_Autumn_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_December_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_February_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_January_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_July_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_June_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_March_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_Winter_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_point_fields, seasonal_means_from_monthly<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">RH2M<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>RH_Annual_Mean = mean_m C_m(RH2M)<\/code><\/p><p dir=\"ltr\"><code>RH_Annual_Range = max_m C_m(RH2M) - min_m C_m(RH2M)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>RH2M is relative humidity in percent, provided by the source or its declared adapter conversion, then aggregated by the common mean rule. A source fraction in 0..1 must be converted to percent before the kernel.<\/p><h3>Validity and missing-data rules<\/h3><p>The generic kernel does not rederive RH from displayed climate columns. The CDS adapter derives it from temperature/dewpoint with the Magnus relation documented under conversions. RH clipping inside HI does not imply automatic clipping of every RH export.<\/p><h3>Worked example<\/h3><p>Twelve 60% monthly values give RH_Annual_Mean=60 and RH_Annual_Range=0.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>RH_Annual_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_April_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_August_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_Autumn_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_December_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_February_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_January_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_July_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_June_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_March_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_May_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_November_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_October_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_September_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_Spring_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>RH_Winter_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_point_fields, seasonal_means_from_monthly<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-dewpoint", "ar": "معادلات: نقطة الندى", "en": "Equations: Dew Point", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">T2MDEW<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>Td_Annual_Mean = mean_m C_m(T2MDEW)<\/code><\/p><p dir=\"ltr\"><code>Td_Annual_Range = max_m C_m(T2MDEW) - min_m C_m(T2MDEW)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>تؤخذ T2MDEW من سلسلة نقطة الندى المصدرية بعد تحويل الوحدة إلى Celsius، ثم تحسب المتوسطات والمدى. ليست هناك معادلة عكسية عامة لحساب الندى من RH في هذه الدالة.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>لا تستخدم T2M مكان نقطة الندى عند فقدها؛ تبقى التبعية مفقودة إلا إذا جاءت من المصدر أو استكمال معلن.<\/p><h3>مثال محسوب<\/h3><p>T2MDEW=12°C في كل شهر ينتج Td_Annual_Mean=12.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>Td_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_Autumn_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_December_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_February_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_January_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_July_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_June_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_March_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_Winter_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_point_fields, seasonal_means_from_monthly<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">T2MDEW<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>Td_Annual_Mean = mean_m C_m(T2MDEW)<\/code><\/p><p dir=\"ltr\"><code>Td_Annual_Range = max_m C_m(T2MDEW) - min_m C_m(T2MDEW)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>Read source T2MDEW after Celsius normalization and compute means/range. This function does not apply a general inverse RH-to-dewpoint equation.<\/p><h3>Validity and missing-data rules<\/h3><p>Do not substitute T2M for missing dewpoint; it stays missing unless supplied by a source or declared filling stage.<\/p><h3>Worked example<\/h3><p>Constant T2MDEW=12°C gives Td_Annual_Mean=12.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>Td_Annual_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_April_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_August_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_Autumn_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_December_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_February_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_January_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_July_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_June_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_March_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_May_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_November_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_October_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_September_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_Spring_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Td_Winter_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_point_fields, seasonal_means_from_monthly<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-solar", "ar": "معادلات: الإشعاع الشمسي", "en": "Equations: Solar Radiation", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">ALLSKY_SFC_SW_DWN<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>E_kWh_per_m2_per_day[y,m] = ALLSKY_SFC_SW_DWN_MJ_per_m2_per_day[y,m] / 3.6<\/code><\/p><p dir=\"ltr\"><code>Sol_Annual_Mean = mean_m C_m(E)<\/code><\/p><p dir=\"ltr\"><code>Sol_Annual_Total = mean_years(sum_valid_months E[y,m] * days(y,m))<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>السلسلة المعيارية تدخل بوحدة MJ/m²/day. تقسم على 3.6 ثم تجمع للمتوسط اليومي، أو تضرب في عدد أيام كل شهر لجمع الطاقة السنوية. Sol_Annual_Total متوسط المجاميع بين السنوات، وليس مجموع الدراسة كلها.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>دالة الطاقة القديمة تجمع الشهور المتاحة في السنة إذا وجد شهر واحد على الأقل؛ لا تفرض بنفسها اكتمال 12 شهرًا. Desktop يحرس الحقول السنوية لاحقًا، لكن يجب فحص التغطية في كل مسار. لا تضرب متوسط W/m² في الأيام قبل تحويله إلى طاقة يومية.<\/p><h3>مثال محسوب<\/h3><p>18 MJ/m²/day تساوي 5 kWh/m²/day. ثباتها طوال سنة 2024 المكتملة يعطي Sol_Annual_Total=1830 kWh/m².<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>Sol_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Annual_Total<\/code><\/td><td>متوسط مجاميع E[y,m]×أيام الشهر عبر السنوات ذات بيانات؛ انظر قيد التغطية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Autumn_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_December_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_February_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_January_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_July_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_June_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_March_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Winter_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_solar_fields, solar_mj_to_kwh<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">ALLSKY_SFC_SW_DWN<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>E_kWh_per_m2_per_day[y,m] = ALLSKY_SFC_SW_DWN_MJ_per_m2_per_day[y,m] / 3.6<\/code><\/p><p dir=\"ltr\"><code>Sol_Annual_Mean = mean_m C_m(E)<\/code><\/p><p dir=\"ltr\"><code>Sol_Annual_Total = mean_years(sum_valid_months E[y,m] * days(y,m))<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>The normalized input is MJ/m²/day. Divide by 3.6 for daily energy means, or multiply by each month&#x27;s actual day count before annual energy summation. Sol_Annual_Total averages yearly totals rather than summing the whole study.<\/p><h3>Validity and missing-data rules<\/h3><p>The legacy solar function sums available months in a year once any month exists; it does not enforce 12-month completeness itself. Desktop guards annual fields later, but coverage must be inspected per path. Convert W/m² to daily energy before multiplying by days.<\/p><h3>Worked example<\/h3><p>18 MJ/m²/day equals 5 kWh/m²/day. Constant coverage for complete leap year 2024 gives Sol_Annual_Total=1830 kWh/m².<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>Sol_Annual_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Annual_Total<\/code><\/td><td>Mean yearly sums of E[y,m]×calendar days for years with data; see coverage limitation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_April_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_August_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Autumn_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_December_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_February_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_January_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_July_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_June_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_March_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_May_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_November_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_October_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_September_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Spring_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Sol_Winter_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_solar_fields, solar_mj_to_kwh<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-uv", "ar": "معادلات: الأشعة فوق البنفسجية", "en": "Equations: UV Index", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">ALLSKY_SFC_UV_INDEX<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><p>يستخدم هذا الحساب أيضًا خط العرض Latitude.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>UV_noon_estimate[y,m] = UV_24h_mean[y,m] * 24 / (daylight_hours(latitude,m) * 0.435)<\/code><\/p><p dir=\"ltr\"><code>declination = -23.44*pi/180 * cos(2*pi*(J_m+10)/365)<\/code><\/p><p dir=\"ltr\"><code>daylight_hours = 2*acos(-tan(latitude_rad)*tan(declination))*180/pi/15<\/code><\/p><p dir=\"ltr\"><code>UV_Annual_Mean = mean_m C_m(UV_noon_estimate)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>عند تعريف السلسلة على أنها NASA متوسط 24 ساعة، يحولها المحرك لكل شهر إلى تقدير لقيمة الظهر باستخدام خط العرض وطول النهار ومعامل الشكل التجريبي 0.435، ثم يحسب المتوسطات. سلسلة موصوفة بأنها قيمة قصوى جاهزة تستخدم مباشرة عند تمرير uv_source=&#x27;om&#x27;.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>هذا تقريب محلي في الكود وليس تحويلًا فيزيائيًا مثبتًا عالميًا أو تنفيذًا مباشرًا لتعريف WHO الطيفي. القيم غير الموجبة أو نهار أقل من 0.5 ساعة تعطي صفرًا؛ الليل القطبي صفر والنهار القطبي 24 ساعة. يستخدم منتصف الشهر J=[15,45,74,105,135,166,196,227,258,288,319,349] وسنة 365 يومًا في التقريب. يجب مراجعة uv_source الفعلي؛ المحول الحالي في Desktop يمرر nasa إلى النواة.<\/p><h3>مثال محسوب<\/h3><p>عند نهار مقداره 12 ساعة ومتوسط UV مقداره 1: التقدير=24/(12×0.435)=4.5977 تقريبًا. لا يعاد هذا التحويل لقيمة قصوى جاهزة.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>UV_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_Autumn_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_December_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_February_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_January_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_July_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_June_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_March_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_Winter_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → daylength_hours, uv_mean24_to_noonmax, compute_point_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">ALLSKY_SFC_UV_INDEX<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><p>This calculation also uses Latitude.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>UV_noon_estimate[y,m] = UV_24h_mean[y,m] * 24 / (daylight_hours(latitude,m) * 0.435)<\/code><\/p><p dir=\"ltr\"><code>declination = -23.44*pi/180 * cos(2*pi*(J_m+10)/365)<\/code><\/p><p dir=\"ltr\"><code>daylight_hours = 2*acos(-tan(latitude_rad)*tan(declination))*180/pi/15<\/code><\/p><p dir=\"ltr\"><code>UV_Annual_Mean = mean_m C_m(UV_noon_estimate)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>For a NASA-labelled 24-hour mean, the kernel estimates a noon value per month using latitude, daylight and empirical shape factor 0.435, then aggregates. An already maximum-valued series bypasses this conversion when uv_source=&#x27;om&#x27;.<\/p><h3>Validity and missing-data rules<\/h3><p>This is a repository-specific approximation, not a globally validated physical conversion or direct WHO spectral definition. Nonpositive input or daylight below 0.5 h gives zero; polar night/day clamp to 0/24 h. Mid-month J=[15,45,74,105,135,166,196,227,258,288,319,349] and a 365-day approximation are used. Inspect the actual uv_source; the current Desktop adapter passes nasa to the kernel.<\/p><h3>Worked example<\/h3><p>For daylight=12 h and a 24-hour UV mean of 1, the estimate is 24/(12×0.435)=4.5977 approximately. Do not reconvert an already maximum-valued input.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>UV_Annual_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_April_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_August_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_Autumn_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_December_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_February_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_January_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_July_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_June_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_March_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_May_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_November_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_October_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_September_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_Spring_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>UV_Winter_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → daylength_hours, uv_mean24_to_noonmax, compute_point_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-cloud", "ar": "معادلات: الغطاء السحابي", "en": "Equations: Cloud Cover", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">CLOUD_AMT<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>Cld_Annual_Mean = mean_m C_m(CLOUD_AMT)<\/code><\/p><p dir=\"ltr\"><code>Cld_Annual_Range = max_m C_m(CLOUD_AMT) - min_m C_m(CLOUD_AMT)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>CLOUD_AMT هو الغطاء السحابي بالمئة من المصدر. يجمع حسابيًا بعد فك ترميز المصدر ووحدته؛ لا يشتق من الرطوبة أو الأشعة الشمسية داخل المحرك العام.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>اختلاف تعريف الغطاء أو أخذ العينات بين المنتجات لا يختفي بمجرد وحدة %؛ احتفظ بالمصدر والدقة الزمنية.<\/p><h3>مثال محسوب<\/h3><p>CLOUD_AMT=40% في الشهور كلها يعطي Cld_Annual_Mean=40 والمدى صفر.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>Cld_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_Autumn_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_December_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_February_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_January_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_July_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_June_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_March_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_Winter_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_point_fields, seasonal_means_from_monthly<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">CLOUD_AMT<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>Cld_Annual_Mean = mean_m C_m(CLOUD_AMT)<\/code><\/p><p dir=\"ltr\"><code>Cld_Annual_Range = max_m C_m(CLOUD_AMT) - min_m C_m(CLOUD_AMT)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>CLOUD_AMT is source cloud cover in percent. Aggregate it after source decoding/unit normalization; the generic kernel does not derive cloud cover from RH or solar radiation.<\/p><h3>Validity and missing-data rules<\/h3><p>A common percent unit does not remove differences in product cloud definitions or sampling; retain source and temporal resolution.<\/p><h3>Worked example<\/h3><p>Constant CLOUD_AMT=40% gives Cld_Annual_Mean=40 and range zero.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>Cld_Annual_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_April_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_August_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_Autumn_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_December_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_February_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_January_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_July_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_June_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_March_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>Cld_May_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td
