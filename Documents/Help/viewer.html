<!doctype html><html lang="@@LANG@@"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIRSAD Help | مساعدة مرصاد</title><style>
:root{color-scheme:light;--bg:#f6f6f6;--panel:#fff;--text:#202020;--muted:#595959;--line:#d7d7d7;--active:#e7f3f4;--link:#086770}body.dark{color-scheme:dark;--bg:#181818;--panel:#202020;--text:#f5f5f5;--muted:#b4b4b4;--line:#3b3b3b;--active:#263b3e;--link:#75d9d3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 'Segoe UI',Arial,sans-serif}button,select,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px}button{cursor:pointer}button:hover,button[aria-selected=true]{background:var(--active)}:focus-visible{outline:2px solid var(--link);outline-offset:2px}button:disabled{opacity:.5;cursor:default}header{padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line)}header strong{font-size:22px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.layout{display:flex;height:calc(100vh - 140px);min-height:450px}aside{width:310px;min-width:230px;max-width:50vw;overflow:auto;padding:14px;border-inline-end:1px solid var(--line)}.tabs{display:flex;gap:4px}.tabs button{flex:1;padding:5px}#query{width:100%;margin:12px 0}.tree details{margin:8px 0}.tree summary{cursor:pointer;font-weight:600}.result{display:block;text-align:start;width:100%;margin:4px 0;border:0;background:transparent}.result small{display:block;color:var(--muted)}main{flex:1;min-width:0;overflow:auto;padding:25px 42px;background:var(--panel)}article{max-width:1000px;margin:auto}h1{font-size:28px;line-height:1.4}h2,h3{line-height:1.5}a{color:var(--link)}table{border-collapse:collapse;width:100%;margin:15px 0}th,td{border:1px solid var(--line);padding:10px;text-align:start;overflow-wrap:anywhere}th{background:var(--bg)}code{font-family:Consolas,monospace}#crumb,#status{color:var(--muted);font-size:14px}footer{border-top:1px solid var(--line);padding-top:15px;margin-top:30px;display:flex;gap:10px}.hide{display:none!important}@media(max-width:760px){.layout{height:auto;min-height:90vh}aside{width:220px;min-width:175px}main{padding:18px}header{padding:10px}.toolbar button,table{font-size:14px}}@media print{header,aside,#crumb,footer{display:none!important}body,main{background:#fff!important;color:#111!important}.layout{display:block;height:auto}main{overflow:visible;padding:0}article{max-width:none}a{color:#111}tr{break-inside:avoid}h1,h2,h3{break-after:avoid}table{font-size:10pt}th,td{border-color:#888}}
</style></head><body><header><strong>MIRSAD · <span id="caption"></span></strong><div class="toolbar"><button id="back"></button><button id="forward"></button><button id="home"></button><button id="toggle"></button><button id="star"></button><button id="print"></button><button id="smaller" aria-label="Smaller text">A−</button><button id="larger" aria-label="Larger text">A+</button><button id="theme"></button><select id="language" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option></select></div></header><div class="layout"><aside><div class="tabs" role="tablist"><button id="contentsTab" role="tab"></button><button id="searchTab" role="tab"></button><button id="favoritesTab" role="tab"></button></div><div id="searchpane" class="hide"><input id="query" type="search"><div id="results" aria-live="polite"></div></div><div id="contents" class="tree"></div><div id="favorites" class="hide"></div></aside><main><article><div id="crumb"></div><h1 id="title"></h1><div id="body"></div><footer><button id="previous"></button><button id="next"></button></footer><p id="status" aria-live="polite"></p></article></main></div><script id="helpdata" type="application/json">@@PAYLOAD@@</script><script>
'use strict';
const data=JSON.parse(document.getElementById('helpdata').textContent),$=id=>document.getElementById(id);let lang='@@LANG@@',current='start',trail=[],cursor=-1,size=16,favorites=[];
const words={ar:{caption:'مركز المساعدة',back:'رجوع',forward:'تقدم',home:'الرئيسية',toggle:'الفهرس',star:'☆ المفضلة',print:'طباعة',theme:'فاتح / داكن',contentsTab:'المحتويات',searchTab:'بحث',favoritesTab:'المفضلة',previous:'الموضوع السابق',next:'الموضوع التالي',search:'ابحث في كامل الدليل…',empty:'لا توجد نتائج',offline:'دليل محلي · الإصدار ',unstar:'★ إزالة المفضلة'},en:{caption:'Help Centre',back:'Back',forward:'Forward',home:'Home',toggle:'Contents pane',star:'☆ Bookmark',print:'Print',theme:'Light / Dark',contentsTab:'Contents',searchTab:'Search',favoritesTab:'Favorites',previous:'Previous topic',next:'Next topic',search:'Search the entire manual…',empty:'No results',offline:'Offline manual · Version ',unstar:'★ Remove bookmark'}};
try{favorites=JSON.parse(localStorage.getItem('mirsad.help.favorites')||'[]');if(!Array.isArray(favorites))favorites=[]}catch(e){}favorites=favorites.filter(id=>data.sections.some(s=>s.id===id));
function plain(html){const node=document.createElement('div');node.innerHTML=html;return node.textContent||''}
function norm(text){return text.toLowerCase().normalize('NFKC').replace(/[\u064b-\u065f\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا')}
function button(topic,container,snippet){const node=document.createElement('button');node.className='result';node.textContent=topic[lang];node.onclick=()=>openTopic(topic.id);if(snippet){const sub=document.createElement('small');sub.textContent=snippet;node.append(sub)}container.append(node)}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('language').value=lang;for(const id of Object.keys(words[lang]))if($(id))$(id).textContent=words[lang][id];$('query').placeholder=words[lang].search;$('query').setAttribute('aria-label',words[lang].search);$('contents').replaceChildren();for(const group of data.groups){const children=data.sections.filter(s=>s.group===group.id);if(!children.length)continue;const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent=group[lang];details.open=children.some(s=>s.id===current);details.append(summary);children.forEach(s=>button(s,details));$('contents').append(details)}renderFavorites();openTopic(current,false);search()}
function renderFavorites(){$('favorites').replaceChildren();favorites.forEach(id=>button(data.sections.find(s=>s.id===id),$('favorites')));if(!favorites.length)$('favorites').textContent=words[lang].empty}
function openTopic(id,push=true){const topic=data.sections.find(s=>s.id===id)||data.sections[0];current=topic.id;if(push){trail=trail.slice(0,cursor+1);trail.push(current);cursor=trail.length-1}const group=data.groups.find(g=>g.id===topic.group);$('crumb').textContent=(group?group[lang]:'')+' · '+data.version;$('title').textContent=topic[lang];$('body').innerHTML=topic[lang+'_body'];$('status').textContent=words[lang].offline+data.version+' · '+data.reviewed;$('star').textContent=favorites.includes(current)?words[lang].unstar:words[lang].star;$('back').disabled=cursor<=0;$('forward').disabled=cursor>=trail.length-1;const i=data.sections.indexOf(topic);$('previous').disabled=i===0;$('next').disabled=i===data.sections.length-1;document.querySelector('main').scrollTop=0;globalThis.history.replaceState(null,'','#'+current)}
function search(){const query=norm($('query').value.trim());$('results').replaceChildren();if(!query)return;let count=0;for(const topic of data.sections){const text=plain(topic[lang+'_body']),position=norm(topic[lang]+' '+text).indexOf(query);if(position<0)continue;count++;button(topic,$('results'),text.slice(Math.max(0,position-45),position+150))}if(!count)$('results').textContent=words[lang].empty}
function chooseTab(name){for(const id of ['contents','search','favorites']){$(id==='search'?'searchpane':id).classList.toggle('hide',id!==name);$(id+'Tab').setAttribute('aria-selected',id===name)}if(name==='search')$('query').focus()}
$('back').onclick=()=>{if(cursor>0)openTopic(trail[--cursor],false)};$('forward').onclick=()=>{if(cursor<trail.length-1)openTopic(trail[++cursor],false)};$('home').onclick=()=>openTopic('start');$('toggle').onclick=()=>document.querySelector('aside').classList.toggle('hide');$('star').onclick=()=>{favorites=favorites.includes(current)?favorites.filter(id=>id!==current):favorites.concat(current);try{localStorage.setItem('mirsad.help.favorites',JSON.stringify(favorites))}catch(e){}renderFavorites();openTopic(current,false)};$('print').onclick=()=>window.print();$('smaller').onclick=()=>{size=Math.max(12,size-1);$('body').style.fontSize=size+'px'};$('larger').onclick=()=>{size=Math.min(26,size+1);$('body').style.fontSize=size+'px'};$('theme').onclick=()=>document.body.classList.toggle('dark');$('language').onchange=()=>{lang=$('language').value;render()};$('query').oninput=search;for(const id of ['contents','search','favorites'])$(id+'Tab').onclick=()=>chooseTab(id);$('previous').onclick=()=>openTopic(data.sections[data.sections.findIndex(s=>s.id===current)-1].id);$('next').onclick=()=>openTopic(data.sections[data.sections.findIndex(s=>s.id===current)+1].id);$('body').onclick=event=>{const link=event.target.closest('a');if(link&&link.getAttribute('href').startsWith('#')){event.preventDefault();openTopic(link.hash.slice(1))}};document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='f'){event.preventDefault();document.querySelector('aside').classList.remove('hide');chooseTab('search')}});current=location.hash.slice(1)||'start';render();openTopic(current);
</script></body></html>
