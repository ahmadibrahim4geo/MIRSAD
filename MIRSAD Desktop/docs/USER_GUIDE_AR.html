eans.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Field Filter Scope <span dir=\"ltr\">(Field_Filter_Scope)<\/span><\/h3><p>REQUIRED. Controls which variables, seasons, and indicators are computed and exported. &#x27;Full Suite (Annual + Seasonal + Monthly)&#x27; (default): calculates and maps all annual, seasonal, monthly and extreme fields. &#x27;Annual Summaries Only&#x27;: restricts processing strictly to annual summaries, means and totals. &#x27;Seasonal Summaries Only&#x27;: restricts processing strictly to seasonal summaries (Winter, Spring, Summer, Autumn). &#x27;Monthly Climatology Only (Jan - Dec)&#x27;: restricts processing strictly to the 12 individual calendar months (Jan-Dec). &#x27;Filter by Specific Seasons &amp; Aggregations&#x27;: quickly filter by specific season or summary level. &#x27;Custom Field Checklist&#x27;: interactive checklist table at the end of this group to select/unselect exact fields by name.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Full Suite (Annual + Seasonal + Monthly) [Recommended]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Full Suite (Annual + Seasonal + Monthly) [Recommended] | Annual Summaries Only | Seasonal Summaries Only | Monthly Climatology Only (Jan - Dec) | Filter by Specific Seasons &amp; Aggregations | Custom Field Checklist<\/p><h3>Included Summary Periods <span dir=\"ltr\">(Included_Aggregations)<\/span><\/h3><p>PERIOD FILTER ONLY. Choose summary levels to generate. &#x27;Annual Summaries&#x27;: annual means and totals. &#x27;Seasonal Summaries&#x27;: seasonal means and totals (Winter, Spring, Summer, Autumn). &#x27;Detailed Monthly Climatology&#x27;: 12 individual monthly climatologies (Jan-Dec). &#x27;Extreme &amp; Bioclimatic Indices&#x27;: heat index, ranges, extreme months, rain days.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">&#x27;Annual Summaries&#x27;;&#x27;Seasonal Summaries&#x27;;&#x27;Extreme &amp; Bioclimatic Indices&#x27;<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Annual Summaries | Seasonal Summaries | Detailed Monthly Climatology (Jan-Dec) | Extreme &amp; Bioclimatic Indices<\/p><h3>Included Seasons <span dir=\"ltr\">(Included_Seasons)<\/span><\/h3><p>SEASONS FILTER ONLY. Select which seasons to generate. Uncheck any season you do not need (e.g. keep only Summer or only Winter).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">&#x27;Winter (DJF)&#x27;;&#x27;Spring (MAM)&#x27;;&#x27;Summer (JJA)&#x27;;&#x27;Autumn (SON)&#x27;<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Winter (DJF) | Spring (MAM) | Summer (JJA) | Autumn (SON)<\/p><h3>Variables Selection (Checklist) <span dir=\"ltr\">(Selected_Fields)<\/span><\/h3><p>VARIABLES SELECTION. Interactive checklist of climate variables and indicators to compute. All fields for the selected Climate Modules are included by default. Check or uncheck individual variables as needed, or use the Filter Scope above to filter by seasons/periods.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Interpolation Method <span dir=\"ltr\">(Interpolation_Method)<\/span><\/h3><p>REQUIRED. IDW (default) | Ordinary Kriging | Spline | Natural Neighbor. Requires Spatial Analyst.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">IDW<\/td><\/tr><\/table><p><b>Initial choices:<\/b> IDW | Ordinary Kriging | Spline | Natural Neighbor<\/p><h3>Base Cell Size (Meters) [Default: 500 Meters] <span dir=\"ltr\">(Base_Cell_Size)<\/span><\/h3><p>REQUIRED. Cell size for all rasters in Meters or Kilometers. Default: 500 Meters. NOTE: fine cells improve appearance only; native NASA POWER resolution stays coarse (~0.5 deg).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Linear Unit<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">500 Meters<\/td><\/tr><\/table><h3>Wind Vector Spacing / Cell Size (Meters) <span dir=\"ltr\">(Wind_Factor_Cell_Size)<\/span><\/h3><p>OPTIONAL. Independent coarser spacing for wind arrow points in Meters or Kilometers. Default: 25000 Meters. Enabled only when Wind module is selected.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Linear Unit<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">25000 Meters<\/td><\/tr><\/table><h3>IDW Curve Profile <span dir=\"ltr\">(IDW_Curve_Profile)<\/span><\/h3><p>IDW ONLY. Distance decay curve profile. &#x27;Gentle / Smooth&#x27; (power 1.2) eliminates concentric island/bullseye artifacts. &#x27;Standard&#x27; (power 2.0) is the classical steep quadratic decay. &#x27;Regional Broad&#x27; (power 0.7) gives extended regional smoothing. &#x27;Custom Power&#x27; allows typing an arbitrary power.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Gentle / Smooth (Power 1.2)<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Gentle / Smooth (Power 1.2) | Standard Quadratic (Power 2.0) | Regional Broad (Power 0.7) | Custom Power<\/p><h3>IDW Power <span dir=\"ltr\">(IDW_Power)<\/span><\/h3><p>IDW ONLY. Power parameter. DEFAULT 1.2 for smooth, seamless climate surfaces without artificial bullseyes.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">1.2<\/td><\/tr><\/table><h3>IDW Search Radius Type <span dir=\"ltr\">(IDW_Search_Type)<\/span><\/h3><p>IDW ONLY. &#x27;Variable&#x27; (default): expand search. &#x27;Fixed&#x27;: fixed radius.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Variable<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Variable | Fixed<\/p><h3>IDW Number of Points <span dir=\"ltr\">(IDW_Num_Points)<\/span><\/h3><p>IDW ONLY. Number of neighbouring points. DEFAULT 12.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">12<\/td><\/tr><\/table><h3>IDW Maximum Distance (metres, optional) <span dir=\"ltr\">(IDW_Max_Distance)<\/span><\/h3><p>IDW ONLY, OPTIONAL. Caps the search neighbourhood in metres.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Kriging Semivariogram Model <span dir=\"ltr\">(Krig_Model)<\/span><\/h3><p>KRIGING ONLY. DEFAULT Spherical.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Spherical<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Spherical | Circular | Exponential | Gaussian<\/p><h3>Kriging Type <span dir=\"ltr\">(Krig_Type)<\/span><\/h3><p>KRIGING ONLY. &#x27;Ordinary&#x27; (default) or &#x27;Universal&#x27;.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Ordinary<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Ordinary | Universal<\/p><h3>Kriging Number of Points <span dir=\"ltr\">(Krig_Num_Points)<\/span><\/h3><p>KRIGING ONLY. DEFAULT 12.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">12<\/td><\/tr><\/table><h3>Spline Type <span dir=\"ltr\">(Spline_Type)<\/span><\/h3><p>SPLINE ONLY. &#x27;Tension&#x27; (recommended for climate): produces taut, smooth surfaces that honor exact point values without overshoots. &#x27;Regularized&#x27;: smooth surface that may overshoot local extremes.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Tension<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Tension | Regularized<\/p><h3>Spline Weight <span dir=\"ltr\">(Spline_Weight)<\/span><\/h3><p>SPLINE ONLY. Weight parameter. For Tension Spline, higher weights (e.g. 5.0-10.0) produce stiffer, less smoothed surfaces closely matching points; smaller weights produce smoother surfaces. DEFAULT 5.0.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">5<\/td><\/tr><\/table><h3>Spline Number of Points <span dir=\"ltr\">(Spline_Num_Points)<\/span><\/h3><p>SPLINE ONLY. Number of neighbouring points used for interpolation. DEFAULT 12.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Interpolation Parameters<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">12<\/td><\/tr><\/table><h3>Enable Raster Reclassification <span dir=\"ltr\">(Enable_Raster_Reclass)<\/span><\/h3><p>OPTIONAL (default OFF). When checked, generates classified rasters (_cls.tif) with discrete thematic classes and embedded colormaps alongside the continuous rasters. When unchecked, outputs only raw continuous floating-point rasters.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Raster Reclassification<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Number of Classes <span dir=\"ltr\">(Reclass_Classes_Count)<\/span><\/h3><p>RECLASS ONLY. Number of classification bins/classes (2 to 32). Default: 7.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Raster Reclassification<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">7<\/td><\/tr><\/table><h3>Classification Method <span dir=\"ltr\">(Reclass_Method)<\/span><\/h3><p>RECLASS ONLY. Statistical classification method to partition raster continuous values.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Raster Reclassification<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Natural Breaks (Jenks)<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Natural Breaks (Jenks) | Equal Interval | Equal Area (Quantile) | Geometric Interval | Standard Deviation<\/p><h3>Create PSL Isobar Contour (Optional) <span dir=\"ltr\">(Create_Isobars)<\/span><\/h3><p>OPTIONAL. Creates isobar polylines from pressure rasters when a pressure module is selected.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Pressure Contour<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Pressure Contour Scheme (Optional) <span dir=\"ltr\">(Pressure_Interval_Scheme)<\/span><\/h3><p>ISOBARS ONLY. Contour interval preset.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Pressure Contour<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Global Standard (4 mbar)<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Global Standard (4 mbar) | Local Detailed (2 mbar) | Custom Interval<\/p><h3>Custom Pressure Step (mbar) (Optional) <span dir=\"ltr\">(Custom_Pressure_Step)<\/span><\/h3><p>ISOBARS ONLY, CUSTOM SCHEME ONLY. Step in mbar/hPa. Must be &gt; 0.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Pressure Contour<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">4<\/td><\/tr><\/table><h3>Apply Focal Smoothing <span dir=\"ltr\">(Focal_Smoothing)<\/span><\/h3><p>OPTIONAL. Smooths interpolated rasters with Focal Statistics.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Post-Processing<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Focal Statistic <span dir=\"ltr\">(Focal_Statistic)<\/span><\/h3><p>FOCAL ONLY. DEFAULT MEAN.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Post-Processing<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">MEAN<\/td><\/tr><\/table><p><b>Initial choices:<\/b> MEAN | MEDIAN | MINIMUM | MAXIMUM | STD<\/p><h3>Focal Neighborhood (cells) <span dir=\"ltr\">(Focal_Neighborhood)<\/span><\/h3><p>FOCAL ONLY. Square neighbourhood in cells (3 = 3x3). DEFAULT 3.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Post-Processing<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">3<\/td><\/tr><\/table><h3>Add Results To Current Map <span dir=\"ltr\">(Add_To_Map)<\/span><\/h3><p>OPTIONAL (default OFF). Safely adds final layers to the current map sequentially.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Map Options<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Map Add Modules (elements to add) <span dir=\"ltr\">(Map_Add_Modules)<\/span><\/h3><p>ADD-TO-MAP ONLY. Choose which elements to add to the map.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Map Options<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Purge Intermediate Cache <span dir=\"ltr\">(Purge_Cache)<\/span><\/h3><p>OPTIONAL (default ON). Deletes intermediate products after use.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Maintenance &amp; Cache<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">true<\/td><\/tr><\/table><h3>Export Separate Excel Workbook per Year (also keep combined workbook) <span dir=\"ltr\">(Export_Separate_Years)<\/span><\/h3><p>For multi-year downloads, also export &lt;Element&gt;/Years/&lt;Element&gt;_&lt;Year&gt;.xls. Recomputes each year&#x27;s Data and Month summaries from that year&#x27;s data using the same units and gap filling; includes Source_Data and Daily sheets when daily saving is enabled. Reuses downloaded data. Does not create separate yearly rasters or GIS databases.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Variable &amp; Field Selection<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>NASA Earthdata username / اسم المستخدم — Need Sign In <span dir=\"ltr\">(Source_Username)<\/span><\/h3><p>Use your own NASA Earthdata account. Authorize GES DISC if required. Credentials are not included in MIRSAD output logs.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Source Account — Need Sign In<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>NASA Earthdata password / كلمة المرور — Need Sign In <span dir=\"ltr\">(Source_Password)<\/span><\/h3><p>Use your own NASA Earthdata account. Authorize GES DISC if required. Credentials are not included in MIRSAD output logs.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String Hidden<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Source Account — Need Sign In<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Masked / not retained<\/td><\/tr><\/table>\n"}, {"id": "parameters-raster", "ar": "مرجع معاملات الراستر", "en": "Raster parameter reference", "group": "toolbox", "ar_body": "<p>هذا مرجع معاملات أداة ArcGIS، وليس قائمة أوامر Desktop. القيم المعروضة لقطة التعريف الافتراضي من Pro 3.6؛ تغيرها الواجهة حسب المصدر والنمط والعناصر. خانة Required تخص التعريف، وقد تختلف الإلزامية الفعلية في Offline أو عند تعطيل خيار تابع. المصادر الشهرية تعطل Daily. حساب CDS/IMERG الفعلي وتوافق ArcMap الأصلي ما زالا ضمن حدود التحقق المعلنة.<\/p><p>MIRSAD_Grid_Raster_Climate_Atlas_Generator.pyt · 36 معاملًا<\/p><h3>نمط سير العمل والتشغيل <span dir=\"ltr\">(Operation_Mode)<\/span><\/h3><p>يختار التنزيل والحساب وإنتاج الأطلس، أو الاستيفاء من حقول نقاط محسوبة موجودة دون طلب بيانات مناخية جديدة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Download Gridded Data &amp; Generate Atlas (Full Pipeline) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Download Gridded Data &amp; Generate Atlas (Full Pipeline) [Default] | Interpolate &amp; Map Existing Data (Offline Mode - No Internet)<\/p><h3>نمط تنفيذ المعالجة وتدفق المهام <span dir=\"ltr\">(Execution_Workflow_Mode)<\/span><\/h3><p>يحدد تنزيل جميع البيانات أولًا ثم الحساب، أو معالجة عنصر بعد الآخر. المصادر المشتركة تحافظ على حواجز تتابع الهجين.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Batch Mode: Download All Then Process [Recommended]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Batch Mode: Download All Then Process [Recommended] | Sequential Mode: Element by Element<\/p><h3>طبقة نقاط محسوبة مسبقاً (وضع أوفلاين) <span dir=\"ltr\">(Precalculated_Point_Layers)<\/span><\/h3><p>طبقات نقاط تحتوي حقولًا مناخية رقمية محسوبة مسبقًا، تستخدم في وضع Offline للاستيفاء دون تنزيل.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Point | Multipoint<\/p><h3>1. مضلع نطاق التنزيل الشبكي (الطبقة 1 - AOI) <span dir=\"ltr\">(Download_Extent_Layer)<\/span><\/h3><p>مضلع منطقة طلب البيانات الأصلية من المصدر، وقد يختلف عن مضلع القص النهائي.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>2. قناع القص النهائي لحدود منطقة الدراسة (الطبقة 2) <span dir=\"ltr\">(Final_Clip_Layer)<\/span><\/h3><p>قناع القص النهائي للراستر في أداة Toolbox؛ راجع إلزاميته في تعريف المعامل والنمط المستخدم.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>اسم منطقة الدراسة (اختياري - لتسمية الطبقات) <span dir=\"ltr\">(Study_Area_Name)<\/span><\/h3><p>اسم وصفي لمنطقة الدراسة يستخدم في تسمية مكونات المشروع؛ لا يغير إحداثياتها أو حدودها.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>3. مصدر البيانات المناخية ومحرك المعالجة <span dir=\"ltr\">(Climate_Data_Source)<\/span><\/h3><p>مصدر البيانات الفعلي. راجع التغطية والمتغيرات والحساب المطلوب. المصدر المستقل لا يستبدل تلقائيًا بمصدر آخر دون سياسة معلنة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Data Provider &amp; Authentication<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">NASA POWER Regional Grid<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> NASA POWER Regional Grid | CHIRPS v3 (Monthly Rainfall) | CHELSA v2.1 (Monthly Climate)<\/p><h3>NASA Earthdata Username <span dir=\"ltr\">(Earthdata_Username)<\/span><\/h3><p>حقل توافق قديم في الأداة الإقليمية؛ لا يعني تمكين تنزيل Earthdata/IMERG الإقليمي. المنتجات الإقليمية المعلنة هي NASA POWER وCHIRPS وCHELSA.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Data Provider &amp; Authentication<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>NASA Earthdata Password / Token <span dir=\"ltr\">(Earthdata_Password)<\/span><\/h3><p>حقل حساب قديم محفوظ للتوافق؛ لا تدخل حسابًا لمصدر غير متاح. IMERG المنفذ يستخدم حقول الحساب في مسار النقاط/المحطات.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String Hidden<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Data Provider &amp; Authentication<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">مخفي / غير محفوظ<\/td><\/tr><\/table><h3>Copernicus CDS API Key / Token <span dir=\"ltr\">(CDS_API_Key)<\/span><\/h3><p>رمز CDS الشخصي للمستخدم بعد قبول شروط المنتج. ليس اسم المستخدم وكلمة المرور، ولا يحفظ ضمن المشروع أو السجلات.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String Hidden<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Data Provider &amp; Authentication<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">مخفي / غير محفوظ<\/td><\/tr><\/table><h3>النمط الزمني للبيانات <span dir=\"ltr\">(Time_Mode)<\/span><\/h3><p>اختيار سنة منفردة أو مدى سنوات أو تاريخي بداية ونهاية مخصصين؛ تتيح الواجهة الخانات الملائمة للنمط.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Single Year<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Single Year | Year Range | Custom Date Range<\/p><h3>Single Year (type any year) <span dir=\"ltr\">(Single_Year)<\/span><\/h3><p>السنة المطلوبة كاملة، في نمط السنة المنفردة. إتاحة السنة تعتمد على المصدر والعنصر والموقع.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">2024<\/td><\/tr><\/table><h3>Start Year (type any year) <span dir=\"ltr\">(Start_Year)<\/span><\/h3><p>أول سنة في المدى المطلوب؛ لا ينبغي أن تتجاوز سنة النهاية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">2015<\/td><\/tr><\/table><h3>End Year (type any year) <span dir=\"ltr\">(End_Year)<\/span><\/h3><p>آخر سنة في المدى المطلوب؛ آخر سنة منشورة قد لا تكون كاملة لكل العناصر.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">2024<\/td><\/tr><\/table><h3>Start Date <span dir=\"ltr\">(Start_Date)<\/span><\/h3><p>أول تاريخ في المدى المخصص. المصادر الشهرية تحتاج شهورًا كاملة ولا تنتج رصدًا يوميًا مصطنعًا.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Date<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">01/01/2024<\/td><\/tr><\/table><h3>End Date <span dir=\"ltr\">(End_Date)<\/span><\/h3><p>آخر تاريخ في المدى المخصص. راجع تأخر النشر واكتمال آخر شهر قبل تفسير القيم المفقودة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Date<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">31/12/2024<\/td><\/tr><\/table><h3>Temporal Scope / Seasons <span dir=\"ltr\">(Temporal_Scope)<\/span><\/h3><p>تحديد الملخصات السنوية والفصول المطلوبة. فصل DJF في المحرك الحالي يتبع الأشهر 12 و1 و2 لنفس السنة المصدرة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Annual;Winter;Spring;Summer;Autumn<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Annual | Winter | Spring | Summer | Autumn<\/p><h3>Included Temporal Aggregations <span dir=\"ltr\">(Included_Aggregations)<\/span><\/h3><p>مستويات الملخصات المطلوبة عند استخدام مرشح الفترات، مثل السنوي والموسمي.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">&#x27;Annual Summaries&#x27;;&#x27;Seasonal Summaries (DJF, MAM, JJA, SON)&#x27;<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Annual Summaries | Seasonal Summaries (DJF, MAM, JJA, SON) | Monthly Climatology (Jan-Dec)<\/p><h3>Wind Chill Full Suite for Cold Regions (Seasons+Ranges+Monthly) <span dir=\"ltr\">(Extended_WC_Seasons)<\/span><\/h3><p>يضيف مجموعة Wind Chill الموسعة للفصول والمدى والشهور في حالات المناطق الباردة المناسبة، بدل افتراض معناها لجميع المناخات.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Monthly Ranges - Interannual Variability per Month <span dir=\"ltr\">(Monthly_Ranges)<\/span><\/h3><p>خيار مستقل لإضافة مدى تغير نفس الشهر بين السنوات؛ لا يمثل مدى درجات الحرارة داخل اليوم الواحد.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Heat Index Monthly Means (Opt-in Suite) <span dir=\"ltr\">(Extended_HI_Months)<\/span><\/h3><p>يضيف قيم Heat Index الشهرية الاختيارية. تفسير أشهر الشتاء يحتاج مراعاة صلاحية النموذج كما يشرح الدليل العلمي.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Climate Modules &amp; Models <span dir=\"ltr\">(Climate_Modules)<\/span><\/h3><p>العناصر والنماذج المراد حسابها. عدم إتاحة تبعية مثل الحرارة أو المطر قد يمنع عنصرًا مشتقًا دون أن يلغي نتائج العناصر السليمة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Climate Modules &amp; Models<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Temperature<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Temperature | Land Surface Temperature | Precipitation | Sea Level Pressure | Surface Pressure | Wind | Relative Humidity | Dew Point | Solar Radiation | UV Index | Cloud Cover | Heat Index / Thermal Stress [Requires: Temperature, Relative Humidity] | Wind Chill / Cold Stress [Requires: Temperature, Wind] | De Martonne Aridity Index [Requires: Temperature, Precipitation] | Evapotranspiration (ET) [Requires: Temperature] | UNEP Aridity Index [Requires: Temperature, Precipitation] | Water Deficit Annual [Requires: Temperature, Precipitation] | Walter-Lieth Dry Months Count [Requires: Temperature, Precipitation] | Trends &amp; Baseline Anomalies [Requires: Temperature, Precipitation]<\/p><h3>طريقة الاستيفاء المكاني للراستر <span dir=\"ltr\">(Interpolation_Method)<\/span><\/h3><p>طريقة الاستيفاء المكاني مثل IDW وKriging وSpline وNatural Neighbor. خيارات Toolbox تتبع Spatial Analyst؛ خيارات Desktop وحدود تكافئها موضحة منفصلًا.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Cartography &amp; Spatial Interpolation<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Inverse Distance Weighted (IDW)<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Inverse Distance Weighted (IDW) | Ordinary Kriging (Spherical) | Spline (Regularized) | Natural Neighbor<\/p><h3>Base Cell Size (Meters) [Default: 500 Meters] <span dir=\"ltr\">(Output_Cell_Size)<\/span><\/h3><p>حجم خلية الاستيفاء الإقليمي بالمتر؛ يختلف عن أبعاد خلايا المنتج المناخي الأصلية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Cartography &amp; Spatial Interpolation<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">500<\/td><\/tr><\/table><h3>Wind Vector Spacing / Cell Size (Meters) <span dir=\"ltr\">(Wind_Factor_Cell_Size)<\/span><\/h3><p>تباعد نقاط/أسهم الرياح بصورة مستقلة عن خلية سطح العناصر الأخرى، ويتاح عند اختيار الرياح.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Cartography &amp; Spatial Interpolation<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">25000<\/td><\/tr><\/table><h3>Export Individual Shapefiles per Season/Indicator <span dir=\"ltr\">(Export_Individual_Shapefiles)<\/span><\/h3><p>إضافة ملفات Shapefile منفردة للمؤشرات/الفصول عند دعم التصدير المختار، مع مراعاة قيود أسماء الحقول.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Output Options<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>مجلد مساحة عمل المخرجات الرئيسي <span dir=\"ltr\">(Output_Workspace)<\/span><\/h3><p>مجلد حفظ المشروع وقاعدة البيانات والجداول ومجلدات العناصر. استخدم مكانًا قابلًا للكتابة خارج مجلد تثبيت البرنامج.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Folder<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Output Options<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>نظام الإسناد المكاني للمخرجات (Spatial Reference) <span dir=\"ltr\">(Output_Spatial_Reference)<\/span><\/h3><p>نظام إحداثيات المخرجات. اختر وحدات ومسقطًا يناسبان المسافات والاستيفاء؛ اختيار اسم نظام لا يثبت دقة كل تحويل Datum.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Spatial Reference<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Output Options<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>نظام وحدات القياس (متري Metric / إمبراطوري Imperial) <span dir=\"ltr\">(Measurement_Units_System)<\/span><\/h3><p>يختار Metric أو Imperial أو الوحدات المخصصة. راجع حقول الوحدات في المخرجات قبل المقارنة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Metric (Celsius °C, mm, hPa, m/s, kWh/m2/day) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Metric (Celsius °C, mm, hPa, m/s, kWh/m2/day) [Default] | Imperial (Fahrenheit °F, Inches in, inHg, mph, MJ/m2/day) | Custom Units<\/p><h3>Temperature Unit <span dir=\"ltr\">(Temperature_Unit)<\/span><\/h3><p>وحدة الحرارة في المخرجات: Celsius أو Fahrenheit أو Kelvin؛ لا يغير ذلك وحدة المصدر الخام المحفوظة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Celsius (°C) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Celsius (°C) [Default] | Fahrenheit (°F) | Kelvin (K)<\/p><h3>Precipitation Unit <span dir=\"ltr\">(Precipitation_Unit)<\/span><\/h3><p>وحدة المطر في المخرجات: ملليمتر أو بوصة. مجموع المطر الشهري يختلف عن معدل مم/يوم.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Millimeters (mm) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Millimeters (mm) [Default] | Inches (in)<\/p><h3>Pressure Unit <span dir=\"ltr\">(Pressure_Unit)<\/span><\/h3><p>وحدة الضغط الجوي/السطحي: hPa أو mbar أو kPa أو inHg بحسب الاختيار.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Hectopascals (hPa) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Hectopascals (hPa) [Default] | Millibars (mbar) | Inches of Mercury (inHg) | Kilopascals (kPa)<\/p><h3>Wind Speed Unit <span dir=\"ltr\">(Wind_Speed_Unit)<\/span><\/h3><p>وحدة سرعة الرياح: m/s أو km/h أو knot أو mph؛ اتجاه الرياح زاوية مستقلة.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Meters per second (m/s) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Meters per second (m/s) [Default] | Kilometers per hour (km/h) | Knots (kt) | Miles per hour (mph)<\/p><h3>Solar Radiation Unit <span dir=\"ltr\">(Solar_Radiation_Unit)<\/span><\/h3><p>وحدة الإشعاع الشمسي وتجميعه الزمني. راجع وصف المصدر للتفريق بين W/m² والطاقة اليومية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Kilowatt-hours per square meter per day (kWh/m2/day) [Default]<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Kilowatt-hours per square meter per day (kWh/m2/day) [Default] | Megajoules per square meter per day (MJ/m2/day) | Watt-hours per square meter per day (Wh/m2/day) | Calories per square centimeter per day (cal/cm2/day, Langley)<\/p><h3>Generate Monthly Climatology Rasters (Offline, Jan-Dec) <span dir=\"ltr\">(Generate_Monthly_Rasters)<\/span><\/h3><p>يطلب أسطح الشهور المناخية Jan–Dec عند استيفاء شرط المدى متعدد السنوات في المسار الحالي؛ لا ينشئ سلسلة يومية.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Resolution / Native Source Grid <span dir=\"ltr\">(Source_Resolution)<\/span><\/h3><p>بيان دقة شبكة المصدر الأصلية. ليس خيارًا لزيادة الدقة بإنشاء بكسلات أصغر في المخرجات.<\/p><table><tr><th>النوع<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>الإلزامية في التعريف<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>الاتجاه<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>المجموعة<\/th><td dir=\"auto\">Data Provider &amp; Authentication<\/td><\/tr><tr><th>الافتراضي في اللقطة<\/th><td dir=\"auto\">Native POWER grids (meteo 0.5 x 0.625 deg; solar 1 x 1 deg)<\/td><\/tr><\/table><p><b>الخيارات الأولية:<\/b> Native POWER grids (meteo 0.5 x 0.625 deg; solar 1 x 1 deg)<\/p>\n", "en_body": "<p>This references the ArcGIS tool, not an identical Desktop command list. Values are a Pro 3.6 default-definition snapshot; controls change with provider, mode and modules. Required describes the declaration; runtime requirements can differ in Offline or disabled dependent controls. Monthly products disable Daily. Authenticated CDS/IMERG and native ArcMap verification limits remain explicit.<\/p><p>MIRSAD_Grid_Raster_Climate_Atlas_Generator.pyt · 36 parameters<\/p><h3>Operation Mode <span dir=\"ltr\">(Operation_Mode)<\/span><\/h3><p>Select &#x27;Download Gridded Data &amp; Generate Atlas&#x27; to fetch fresh gridded data from web APIs. Select &#x27;Interpolate &amp; Map Existing Data (Offline Mode)&#x27; to work without internet using existing point layers.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Download Gridded Data &amp; Generate Atlas (Full Pipeline) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Download Gridded Data &amp; Generate Atlas (Full Pipeline) [Default] | Interpolate &amp; Map Existing Data (Offline Mode - No Internet)<\/p><h3>Execution Workflow Mode <span dir=\"ltr\">(Execution_Workflow_Mode)<\/span><\/h3><p>DOWNLOAD MODE ONLY. Choose workflow execution architecture:<br>&#x27;Batch Mode: Download All Then Process&#x27; (recommended): Downloads gridded data and builds master point layers in the Geodatabase for all requested modules first, ensuring data integrity against network interruptions, then interpolates all surfaces in a second pass.<br>&#x27;Sequential Mode: Element by Element&#x27;: Downloads, builds points, and interpolates surfaces for each module one by one, providing immediate visual progress in the map layout.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Batch Mode: Download All Then Process [Recommended]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Batch Mode: Download All Then Process [Recommended] | Sequential Mode: Element by Element<\/p><h3>Precalculated Point Layer(s) (Offline Mode) <span dir=\"ltr\">(Precalculated_Point_Layers)<\/span><\/h3><p>REQUIRED for Offline mode. One or more existing point layers (from GDB or Shapefiles) containing pre-calculated climate attributes. The tool merges them automatically by coordinates or OID.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Point | Multipoint<\/p><h3>1. Download Extent Layer (Layer 1 - Grid AOI) <span dir=\"ltr\">(Download_Extent_Layer)<\/span><\/h3><p>REQUIRED for Download Mode. Polygon layer defining the download extent (AOI) to query gridded climate data from the web service (e.g. REC boundary).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>2. Final Clip Mask Layer (Layer 2 - Study Area) <span dir=\"ltr\">(Final_Clip_Layer)<\/span><\/h3><p>REQUIRED. Polygon layer used to clip and mask the final interpolated rasters (e.g. Egypt boundary).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Feature Layer<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Study Area Name (Optional) <span dir=\"ltr\">(Study_Area_Name)<\/span><\/h3><p>OPTIONAL. Name of the study area (e.g. &#x27;Egypt&#x27;, &#x27;Sinai&#x27;, &#x27;Nile Basin&#x27;). Used to title the atlas, name the boundary layer archived in GDB, and generate the Classification Workbook.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\"><\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>3. Climate Data Source <span dir=\"ltr\">(Climate_Data_Source)<\/span><\/h3><p>The selected provider controls actual requests and supported variables. See Sources for coverage, sign-in and standalone versus Hybrid policy.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Data Provider &amp; Authentication<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">NASA POWER Regional Grid<\/td><\/tr><\/table><p><b>Initial choices:<\/b> NASA POWER Regional Grid | CHIRPS v3 (Monthly Rainfall) | CHELSA v2.1 (Monthly Climate)<\/p><h3>NASA Earthdata Username <span dir=\"ltr\">(Earthdata_Username)<\/span><\/h3><p>Legacy regional compatibility field; this does not enable regional Earthdata/IMERG. Implemented regional products are NASA POWER, CHIRPS and CHELSA.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Data Provider &amp; Authentication<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>NASA Earthdata Password / Token <span dir=\"ltr\">(Earthdata_Password)<\/span><\/h3><p>Legacy regional compatibility field; the implemented IMERG point/station adapter uses its own masked credentials controls.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String Hidden<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Data Provider &amp; Authentication<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Masked / not retained<\/td><\/tr><\/table><h3>Copernicus CDS API Key / Token <span dir=\"ltr\">(CDS_API_Key)<\/span><\/h3><p>OPTIONAL. Copernicus CDS Personal Access Token. If omitted, ERA5 raster grid is extracted seamlessly.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String Hidden<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Data Provider &amp; Authentication<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Masked / not retained<\/td><\/tr><\/table><h3>Time Mode <span dir=\"ltr\">(Time_Mode)<\/span><\/h3><p>REQUIRED. &#x27;Single Year&#x27; queries January-December of one year. &#x27;Year Range&#x27; computes multi-year climatological normals. &#x27;Custom Date Range&#x27; queries specific start/end dates via calendar or text.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Single Year<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Single Year | Year Range | Custom Date Range<\/p><h3>Single Year (type any year) <span dir=\"ltr\">(Single_Year)<\/span><\/h3><p>Type any year you need (free entry, no list).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">2024<\/td><\/tr><\/table><h3>Start Year (type any year) <span dir=\"ltr\">(Start_Year)<\/span><\/h3><p>Type the first year of the period (free entry, no list).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">2015<\/td><\/tr><\/table><h3>End Year (type any year) <span dir=\"ltr\">(End_Year)<\/span><\/h3><p>Type the last year of the period (free entry, no list).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Long<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">2024<\/td><\/tr><\/table><h3>Start Date <span dir=\"ltr\">(Start_Date)<\/span><\/h3><p>CUSTOM DATE RANGE ONLY. Pick from the built-in calendar (any past or future year) or type the date directly.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Date<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">01/01/2024<\/td><\/tr><\/table><h3>End Date <span dir=\"ltr\">(End_Date)<\/span><\/h3><p>CUSTOM DATE RANGE ONLY. Pick from the built-in calendar (any past or future year) or type the date directly.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Date<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">31/12/2024<\/td><\/tr><\/table><h3>Temporal Scope / Seasons <span dir=\"ltr\">(Temporal_Scope)<\/span><\/h3><p>TEMPORAL MATRIX SCOPE. Select which temporal scopes and seasons to compute and map (Annual, Winter, Spring, Summer, Autumn). Uncheck any seasons not needed (e.g. keep only Annual for fast regional atlas, or Summer only for heat waves). The tool computes only the Cartesian product of selected Climate Modules and selected Temporal Scope.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Annual;Winter;Spring;Summer;Autumn<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Annual | Winter | Spring | Summer | Autumn<\/p><h3>Included Temporal Aggregations <span dir=\"ltr\">(Included_Aggregations)<\/span><\/h3><p>Select which temporal summaries to generate (Annual, Seasonal, Monthly Climatology).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">&#x27;Annual Summaries&#x27;;&#x27;Seasonal Summaries (DJF, MAM, JJA, SON)&#x27;<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Annual Summaries | Seasonal Summaries (DJF, MAM, JJA, SON) | Monthly Climatology (Jan-Dec)<\/p><h3>Wind Chill Full Suite for Cold Regions (Seasons+Ranges+Monthly) <span dir=\"ltr\">(Extended_WC_Seasons)<\/span><\/h3><p>OPT-IN FOR COLD REGIONS ONLY (e.g. Patagonia, Iceland, high mountains, Canada): publishes WC_Spring/Summer/Autumn_Mean, WC_Annual_Range and the 12 monthly WC means in addition to WC_Winter_Mean and WC_Annual_Mean. OFF by default: warm regions keep the clean 2-field schema.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Monthly Ranges - Interannual Variability per Month <span dir=\"ltr\">(Monthly_Ranges)<\/span><\/h3><p>OPT-IN, independent toggle (default OFF): adds per-calendar-month interannual ranges (&lt;Prefix&gt;_&lt;Month&gt;_Range, e.g. ET_December_Range) for the mean-type modules. Month sheet and Month/ rasters carry them like the monthly means. Needs &gt;= 2 valid years per month.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Heat Index Monthly Means (Opt-in Suite) <span dir=\"ltr\">(Extended_HI_Months)<\/span><\/h3><p>OPT-IN, independent toggle (default OFF): publishes the 12 monthly Rothfusz heat-index means (HI_January_Mean ... HI_December_Mean) alongside the 8 base Heat Index fields. Month/ rasters carry them like the other monthly means.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Climate Modules &amp; Models <span dir=\"ltr\">(Climate_Modules)<\/span><\/h3><p>Select climate modules and applied bioclimatic models to compute and export. Submodels (De Martonne, Evapotranspiration, UNEP, Water Deficit, Walter-Lieth, Heat Index) can be selected directly; prerequisite variables are retrieved automatically if not selected.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Climate Modules &amp; Models<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Temperature<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Temperature | Land Surface Temperature | Precipitation | Sea Level Pressure | Surface Pressure | Wind | Relative Humidity | Dew Point | Solar Radiation | UV Index | Cloud Cover | Heat Index / Thermal Stress [Requires: Temperature, Relative Humidity] | Wind Chill / Cold Stress [Requires: Temperature, Wind] | De Martonne Aridity Index [Requires: Temperature, Precipitation] | Evapotranspiration (ET) [Requires: Temperature] | UNEP Aridity Index [Requires: Temperature, Precipitation] | Water Deficit Annual [Requires: Temperature, Precipitation] | Walter-Lieth Dry Months Count [Requires: Temperature, Precipitation] | Trends &amp; Baseline Anomalies [Requires: Temperature, Precipitation]<\/p><h3>Interpolation Method <span dir=\"ltr\">(Interpolation_Method)<\/span><\/h3><p>Optional export control; see the tool workflow and Output section.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Cartography &amp; Spatial Interpolation<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Inverse Distance Weighted (IDW)<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Inverse Distance Weighted (IDW) | Ordinary Kriging (Spherical) | Spline (Regularized) | Natural Neighbor<\/p><h3>Base Cell Size (Meters) [Default: 500 Meters] <span dir=\"ltr\">(Output_Cell_Size)<\/span><\/h3><p>Base cell size for raster interpolation in meters (e.g. 500.0). When using a Geographic Coordinate System (degrees), the tool automatically converts meters to decimal degrees.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Cartography &amp; Spatial Interpolation<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">500<\/td><\/tr><\/table><h3>Wind Vector Spacing / Cell Size (Meters) <span dir=\"ltr\">(Wind_Factor_Cell_Size)<\/span><\/h3><p>Independent spacing for wind vector grid points in meters (default: 25000.0). Controls density of wind vector arrows to prevent crowding on maps. Enabled only when Wind module is selected.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Double<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Cartography &amp; Spatial Interpolation<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">25000<\/td><\/tr><\/table><h3>Export Individual Shapefiles per Season/Indicator <span dir=\"ltr\">(Export_Individual_Shapefiles)<\/span><\/h3><p>Optional export control; see the tool workflow and Output section.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Output Options<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Output Atlas Folder <span dir=\"ltr\">(Output_Workspace)<\/span><\/h3><p>Writable project output directory, with the dated climate database, element folders, tables and reports. Keep user projects outside the application installation.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Folder<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Required<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Output Options<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Output Spatial Reference <span dir=\"ltr\">(Output_Spatial_Reference)<\/span><\/h3><p>Optional export control; see the tool workflow and Output section.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Spatial Reference<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Output Options<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">—<\/td><\/tr><\/table><h3>Measurement Units System <span dir=\"ltr\">(Measurement_Units_System)<\/span><\/h3><p>Select the measurement units system for atlas outputs.<br>• Metric (Default): Celsius (°C), Millimeters (mm), Hectopascals (hPa), Meters/second (m/s), kWh/m2/day conforming to WMO and Egyptian standards.<br>• Imperial: Fahrenheit (°F), Inches (in), Inches of Mercury (inHg), Miles/hour (mph), MJ/m2/day.<br>• Custom Units: Manually customize units for each climate variable below.<br><\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Metric (Celsius °C, mm, hPa, m/s, kWh/m2/day) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Metric (Celsius °C, mm, hPa, m/s, kWh/m2/day) [Default] | Imperial (Fahrenheit °F, Inches in, inHg, mph, MJ/m2/day) | Custom Units<\/p><h3>Temperature Unit <span dir=\"ltr\">(Temperature_Unit)<\/span><\/h3><p>Measurement unit for temperature variables: Celsius (°C, default), Fahrenheit (°F), or Kelvin (K).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Celsius (°C) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Celsius (°C) [Default] | Fahrenheit (°F) | Kelvin (K)<\/p><h3>Precipitation Unit <span dir=\"ltr\">(Precipitation_Unit)<\/span><\/h3><p>Measurement unit for precipitation and rainfall: Millimeters (mm, default) or Inches (in).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Millimeters (mm) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Millimeters (mm) [Default] | Inches (in)<\/p><h3>Pressure Unit <span dir=\"ltr\">(Pressure_Unit)<\/span><\/h3><p>Measurement unit for atmospheric and sea level pressure: Hectopascals (hPa, default), Millibars (mbar), Inches of Mercury (inHg), or Kilopascals (kPa).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Hectopascals (hPa) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Hectopascals (hPa) [Default] | Millibars (mbar) | Inches of Mercury (inHg) | Kilopascals (kPa)<\/p><h3>Wind Speed Unit <span dir=\"ltr\">(Wind_Speed_Unit)<\/span><\/h3><p>Measurement unit for surface wind speed: Meters/second (m/s, default), km/h, kt, or mph.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Meters per second (m/s) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Meters per second (m/s) [Default] | Kilometers per hour (km/h) | Knots (kt) | Miles per hour (mph)<\/p><h3>Solar Radiation Unit <span dir=\"ltr\">(Solar_Radiation_Unit)<\/span><\/h3><p>Measurement unit for surface solar radiation: Kilowatt-hours/m2/day (kWh/m2/day, default in Egypt &amp; WMO), Megajoules/m2/day (MJ/m2/day), Watt-hours/m2/day (Wh/m2/day), or Calories/cm2/day (cal/cm2/day, Langley).<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Measurement Units &amp; Standards<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Kilowatt-hours per square meter per day (kWh/m2/day) [Default]<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Kilowatt-hours per square meter per day (kWh/m2/day) [Default] | Megajoules per square meter per day (MJ/m2/day) | Watt-hours per square meter per day (Wh/m2/day) | Calories per square centimeter per day (cal/cm2/day, Langley)<\/p><h3>Generate Monthly Climatology Rasters (Offline, Jan-Dec) <span dir=\"ltr\">(Generate_Monthly_Rasters)<\/span><\/h3><p>Request monthly climatology surfaces when the current multi-year interval requirement is satisfied. This never synthesizes daily observations.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">Boolean<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Time Window<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">false<\/td><\/tr><\/table><h3>Resolution / Native Source Grid <span dir=\"ltr\">(Source_Resolution)<\/span><\/h3><p>Fixed source grids vary by variable. Output raster cell size is a separate processing setting, not new climate information.<\/p><table><tr><th>Type<\/th><td dir=\"auto\">String<\/td><\/tr><tr><th>Declared requirement<\/th><td dir=\"auto\">Optional<\/td><\/tr><tr><th>Direction<\/th><td dir=\"auto\">Input<\/td><\/tr><tr><th>Category<\/th><td dir=\"auto\">Data Provider &amp; Authentication<\/td><\/tr><tr><th>Snapshot default<\/th><td dir=\"auto\">Native POWER grids (meteo 0.5 x 0.625 deg; solar 1 x 1 deg)<\/td><\/tr><\/table><p><b>Initial choices:<\/b> Native POWER grids (meteo 0.5 x 0.625 deg; solar 1 x 1 deg)<\/p>\n"}, {"id": "calculation-flow", "ar": "الرموز والمدخلات وتدفق الحساب", "en": "Symbols, inputs and calculation flow", "group": "equations", "ar_body": "<p>يوثق هذا المرجع الحساب المنفذ بالفعل وحدوده. لكل عنصر مناخي صفحة مستقلة بها المعادلات والمدخلات ومثال محسوب وأسماء أعمدة النتائج الفعلية. العنصر المحمل مثل الغطاء السحابي لا يصبح نموذجًا فيزيائيًا جديدًا لمجرد حساب متوسطه داخل مرصاد.<\/p>\n<h3>الرموز وأعمدة المدخلات<\/h3>\n<table><tr><th>الرمز / الكود المعياري<\/th><th>المعنى والوحدة الداخلية<\/th><\/tr>\n<tr><td dir=\"ltr\">y, m, d; n_m<\/td><td>السنة وشهر التقويم واليوم؛ وعدد السنوات ذات القيم الصالحة المشاركة في الشهر m.<\/td><\/tr>\n<tr><td dir=\"ltr\">X[y,m]; C_m(X)<\/td><td>قيمة شهرية موحدة؛ ومتوسط القيم الصالحة لنفس شهر التقويم عبر السنوات المختارة. قيمة المطر الشهرية مجموع، بينما الحرارة متوسط.<\/td><\/tr>\n<tr><td dir=\"ltr\">T, T2M; Tmax, T2M_MAX; Tmin, T2M_MIN<\/td><td>متوسط حرارة الهواء والعظمى والصغرى بوحدة °C. المدخلات الشهرية للعظمى والصغرى ملخصات المصدر، وليست أشد واقعة خلال الدراسة كلها.<\/td><\/tr>\n<tr><td dir=\"ltr\">TS; T2MDEW<\/td><td>حرارة سطح الأرض؛ ودرجة حرارة نقطة الندى، بوحدة °C.<\/td><\/tr>\n<tr><td dir=\"ltr\">P, PRECTOTCORR<\/td><td>المطر بالمليمتر لكل شهر بعد توحيد المصدر. القيم اليومية مجاميع مم/يوم؛ معدل NASA الشهري يحتاج تحويلًا منفصلًا بعدد الأيام.<\/td><\/tr>\n<tr><td dir=\"ltr\">RH, RH2M; CLOUD_AMT<\/td><td>الرطوبة النسبية والغطاء السحابي بالمئة (0–100).<\/td><\/tr>\n<tr><td dir=\"ltr\">PS; SLP<\/td><td>الضغط السطحي والضغط عند مستوى البحر؛ توحد محولات المصادر الوحدات، ثم تتعامل الدالة المشتركة مع kPa/hPa وفق صفحة الضغط.<\/td><\/tr>\n<tr><td dir=\"ltr\">WS10M; WD10M<\/td><td>سرعة الرياح عند ارتفاع 10 م بوحدة م/ث؛ واتجاهها بالدرجات.<\/td><\/tr>\n<tr><td dir=\"ltr\">ALLSKY_SFC_SW_DWN; ALLSKY_SFC_UV_INDEX<\/td><td>الطاقة الشمسية بوحدة MJ/m²/day قبل تحويل النواة؛ ومؤشر UV المصدري الذي يوضح تحويله في صفحته.<\/td><\/tr>\n<tr><td dir=\"ltr\">Latitude, φ; J; D_m; Ra; PET<\/td><td>خط العرض بالدرجات، أو بالراديان عند استخدام φ؛ يوم السنة التقريبي؛ أيام الشهر؛ الإشعاع خارج الغلاف؛ والبخر والنتح المحتمل. وحدات كل خطوة موضحة في صفحة هارجريفز.<\/td><\/tr>\n<tr><td dir=\"ltr\">Σ, mean, min, max, I(condition), clamp<\/td><td>المجموع والمتوسط الحسابي والأدنى والأعلى، و1 عند تحقق الشرط وإلا 0، وحصر القيمة بين حدين. الدوال المثلثية تستخدم الراديان، وatan وacos تعيدان راديان؛ sqrt الجذر التربيعي.<\/td><\/tr><\/table>\n<h3>من سجل المصدر إلى عمود النتيجة<\/h3>\n<ol><li>قراءة المصدر المحدد مع حفظ المعرفات والزمن والموقع والوحدات وأعلام الفقد وتتبع المصدر. أسماء استجابة المصدر قد تختلف عن الأكواد المعيارية أعلاه؛ وقد يكون جدول Daily طوليًا أو عريضًا.<\/li>\n<li>فك رموز الفقد إلى NULL وتوحيد الوحدات ثم تجهيز المدخل الشهري. مجموع المطر اليومي يحتاج اكتمال شهر التقويم. المسار اليومي القديم قد يأخذ متوسط الأيام المتاحة للعناصر الأخرى، بينما تجهيز الشهور اليومي في Desktop يتطلب اكتمال الشهر. المنتجات الشهرية والمركبة تحتفظ بتغطيتها الحقيقية ولا تصطنع أرصادًا يومية.<\/li>\n<li>في Hybrid ينتهي تنزيل المحطات أولًا، ثم يعوض المصدر الثانوي الخلايا المفقودة المؤهلة فقط. ملء الفجوات الشهري، عند اختياره، مرحلة لاحقة منفصلة؛ راجع صفحة Hybrid وسياسات التتبع.<\/li>\n<li>حساب C_m(X) لكل شهر تقويمي ثم تطبيق معادلة العنصر. تطبيق مؤشر غير خطي على المتوسطات الشهرية لا يساوي متوسط حسابه لكل يوم.<\/li>\n<li>تطبيق حراس التغطية ومرشحات الأعمدة الخاصة بالواجهة، ثم تحويل وحدات العرض والتقريب. أعمدة التصدير قيم محسوبة وليست صيغ Excel. تستخدم صادرات الجداول والمكان داخل الواجهة نفسها السجل المحسوب نفسه.<\/li><\/ol>\n<h3>الفترات والقيم المفقودة<\/h3>\n<p>المتوسط السنوي في النواة العامة متوسط الشهور المناخية الصالحة دون ترجيح بطول الشهر. المدى السنوي أعلى شهر مناخي ناقص أدناه. أما January_Range الاختياري فمدى قيم يناير بين سنتين صالحتين على الأقل، وهو إحصاء مختلف. مجاميع المطر وPET السنوية تحتاج 12 شهرًا، والفصلية ثلاثة. الشتاء DJF يستخدم ديسمبر ويناير وفبراير المرتبطة بمفتاح السنة نفسه، ولا ينقل ديسمبر إلى سنة الشتاء السابقة. الربيع MAM والشهور 3–5، والصيف JJA و6–8، والخريف SON و9–11؛ هذه التسميات ثابتة حتى في نصف الكرة الجنوبي.<\/p>\n<p>يحجب Desktop النتائج السنوية عند غياب أي سنة كاملة لمدخلات العنصر. ملخصا الحرارة والمطر اليوميان المباشران يستخدمان أيضًا مسار تلخيص الفترات المكتملة؛ أما Hybrid والمنتجات الشهرية الأصلية فيحتفظان بتجميع النواة مع حراس التغطية. لذا لا تعني مشاركة المعادلات تطابق التجميع عند اختلاف الفجوات أو مسار المدخل. T_Period_Mean متوسط الأيام الصالحة، بينما R_Period_Total لا يظهر إلا عند اكتمال الفترة اليومية المطلوبة. اقرأ النتيجة مع التغطية وأعلام المصدر. المطر المفقود لا يعوض بصفر ضمنيًا.<\/p>\n<p>تظل تسمية الخريطة مختصرة، مثل «متوسط هطول الأمطار»، مع تحديد الفترة والوحدة في العنوان أو وسيلة الإيضاح. حساب المتوسط قد يكون مبنيًا على تراكميات: R_Annual_Mean هو متوسط مجاميع السنوات المكتملة، وR_Summer_Mean متوسط مجاميع الصيف، وكلاهما متوسط مناخي صحيح، لا متوسط قيم يومية. لا يلزم وضع شرح خطوات التجميع كلها في عنوان الخريطة؛ مكانه المنهجية. أما ET_Annual_Mean فيحمل مجموع PET المحسوب من الشهور المناخية، كما يوضح جدول العنصر. استخدم جدول الأعمدة لتحديد العملية والوحدة دون تغيير أسماء الخرائط أو الحقول. المديات الشهرية ومجموعة HI/WC الموسعة ليست مفعلة في كل تصدير.<\/p>\n<p><a href=\"#modules\">قائمة العناصر<\/a> · <a href=\"#hybrid\">الهجين والفجوات<\/a> · <a href=\"#calculation-units\">الوحدات والحدود<\/a><\/p>\n", "en_body": "<p>This reference describes the implemented calculation, including its limits. Each climate element has a separate page with equations, dependencies, a worked example and exact calculated field names. A measured or downloaded element such as cloud cover does not acquire an extra physical model merely because MIRSAD aggregates it.<\/p>\n<h3>Symbols and input columns<\/h3>\n<table><tr><th>Symbol / normalized code<\/th><th>Meaning and internal unit<\/th><\/tr>\n<tr><td>y, m, d; n_m<\/td><td>Year, calendar month, day; count of valid years contributing to month m.<\/td><\/tr>\n<tr><td>X[y,m]; C_m(X)<\/td><td>A normalized monthly value; mean of valid values for the same calendar month across selected years. A monthly rainfall value is a total, while temperature is a mean.<\/td><\/tr>\n<tr><td>T, T2M; Tmax, T2M_MAX; Tmin, T2M_MIN<\/td><td>Air mean, maximum and minimum temperature, °C. Monthly max/min inputs are source monthly summaries, not the largest/smallest event in the entire study.<\/td><\/tr>\n<tr><td>TS; T2MDEW<\/td><td>Land-surface temperature; dew-point temperature, °C.<\/td><\/tr>\n<tr><td>P, PRECTOTCORR<\/td><td>Precipitation, mm per month after source normalization. Daily source values are mm/day totals; NASA monthly rates need a separate days conversion.<\/td><\/tr>\n<tr><td>RH, RH2M; CLOUD_AMT<\/td><td>Relative humidity and cloud cover, percent (0–100).<\/td><\/tr>\n<tr><td>PS; SLP<\/td><td>Surface and mean-sea-level pressure; adapters normalize source units. The shared helper handles kPa/hPa as described on the pressure pages.<\/td><\/tr>\n<tr><td>WS10M; WD10M<\/td><td>10-m wind speed, m/s; wind direction, degrees.<\/td><\/tr>\n<tr><td>ALLSKY_SFC_SW_DWN; ALLSKY_SFC_UV_INDEX<\/td><td>Solar energy in MJ/m²/day before kernel conversion; UV source index, with the source-specific conversion described on its page.<\/td><\/tr>\n<tr><td>Latitude, φ; J; D_m; Ra; PET<\/td><td>Latitude in degrees, or radians as φ; approximate day of year; days/month; extraterrestrial radiation; potential evapotranspiration. See Hargreaves for units at each step.<\/td><\/tr>\n<tr><td>Σ, mean, min, max, I(condition), clamp<\/td><td>Sum, arithmetic mean, minimum, maximum, 1 if condition is true otherwise 0, and a bounded value. sin/cos/tan use radians; atan and acos return radians; sqrt is square root.<\/td><\/tr><\/table>\n<h3>From source record to exported field<\/h3>\n<ol><li>Read the selected source and preserve identifiers, time, location, units, missing flags and provenance. Source response names can differ from the normalized variable codes above; a Daily sheet may use a long or wide layout.<\/li>\n<li>Decode missing sentinels to NULL, normalize units and aggregate to monthly input. Daily precipitation needs a complete calendar month before summing. The legacy daily path can average available non-rain days, whereas Desktop daily monthly assembly requires complete months. Native monthly/composite products retain their actual support; they do not fabricate daily observations.<\/li>\n<li>For Hybrid, complete station download first, then fill only eligible missing source cells from the secondary source. Monthly gap filling, if selected, is a later separate stage. Consult the Hybrid page for its provenance and policies.<\/li>\n<li>Compute C_m(X) for each calendar month, then evaluate the selected element's formula. Nonlinear indices evaluated on monthly means are not equivalent to means of daily indices.<\/li>\n<li>Apply host coverage guards and output filters, then display-unit conversion and rounding. Exported columns contain values, not Excel formulas. The same calculated record feeds spatial and tabular exports in that host.<\/li><\/ol>\n<h3>Periods and missing data<\/h3>\n<p>Annual means in the generic kernel average valid climatological months without weighting month length. Annual range means the largest minus smallest climatological month. An optional January_Range means the spread of January values between at least two years; it is a different statistic. Rainfall and PET annual totals require all 12 months, seasonal totals require all three. DJF means December, January and February associated with the same year key; it does not move December to the previous winter year. MAM, JJA and SON use 3–5, 6–8 and 9–11; these names are fixed, including in the Southern Hemisphere.<\/p>\n<p>Desktop guards annual output when no complete dependency year exists. Direct daily Temperature/Precipitation summaries also use their complete-period summary path; Hybrid/native-monthly routes retain kernel aggregation with the coverage guards. Thus shared equations alone do not guarantee identical aggregates with different gaps or input routes. T_Period_Mean averages valid daily observations; R_Period_Total is only reported for a complete requested daily period. Coverage and source flags must accompany interpretation. Missing precipitation is never silently zero.<\/p>\n<p>Keep map titles concise, for example “Mean precipitation”, with the period and unit in the title or legend. A climatic mean can average accumulations: R_Annual_Mean averages complete annual totals, and R_Summer_Mean averages summer totals. Both are means, rather than means of daily rainfall. Put the aggregation steps in the methodology instead of expanding the map title into the entire calculation. ET_Annual_Mean carries PET summed from climatological months, as its element table explains. Use each field table to identify the operation and unit while retaining existing map titles and field names. Optional ranges and extended HI/WC fields are not enabled in every export.<\/p>\n<p><a href=\"#modules\">Element list<\/a> · <a href=\"#hybrid\">Hybrid and gaps<\/a> · <a href=\"#calculation-units\">Units and limitations<\/a><\/p>\n"}, {"id": "calculation-units", "ar": "تحويل الوحدات وحدود الحساب", "en": "Unit conversion and calculation limits", "group": "equations", "ar_body": "<p>تحسب المؤشرات المشتقة بوحداتها الداخلية المحددة قبل تحويل المخرجات. تغيير وحدة العرض لا يضع الفهرنهايت في معيار P&lt;2T أو البوصة في دي مارتون. المدى والشذوذ والميل وفرق الحرارة فروق حرارية، وليست درجات حرارة مطلقة.<\/p>\n<table><tr><th>الكمية<\/th><th>التحويل من وحدة الحساب<\/th><\/tr>\n<tr><td>الحرارة المطلقة °C<\/td><td dir=\"ltr\">°F=1.8×°C+32; K=°C+273.15.<\/td><\/tr>\n<tr><td>فرق الحرارة °C<\/td><td>فرق °F يساوي الفرق ×1.8؛ وفرق K يساوي الفرق نفسه. ينطبق على المدى والاتجاه والشذوذ؛ راجع قيد فرق LST أدناه.<\/td><\/tr>\n<tr><td>المطر وPET والفرق المائي الموقع، مم<\/td><td>البوصة=مم/25.4؛ لا تحول الأعداد والنسب المئوية.<\/td><\/tr>\n<tr><td>الضغط hPa<\/td><td dir=\"ltr\">
