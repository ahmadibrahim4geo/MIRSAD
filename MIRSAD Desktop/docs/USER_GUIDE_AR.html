kPa=hPa/10; inHg=hPa×0.029530.<\/td><\/tr>\n<tr><td>سرعة الرياح م/ث<\/td><td>كم/ساعة=م/ث ×3.6؛ عقدة=م/ث ×1.943844؛ ميل/ساعة=م/ث ×2.236936. الاتجاه يبقى بالدرجات.<\/td><\/tr>\n<tr><td>الشمس kWh/m²/day والمجموع kWh/m²/year<\/td><td>MJ=القيمة ×3.6؛ Wh=القيمة ×1000؛ cal/cm² أو Langley=القيمة ×85.9845؛ تبقى الفترة يومية أو سنوية حسب الحقل.<\/td><\/tr>\n<tr><td>الرطوبة والسحب وUV والجفاف والشهور الجافة<\/td><td>نسبة مئوية، ومؤشر UV مصدري/تقديري، ونسبة/مؤشر جفاف، وعدد شهور على الترتيب. UNEP ليس نسبة مئوية.<\/td><\/tr><\/table>\n<h3>فرق موثق في التنفيذ: حرارة السطح ناقص الهواء<\/h3>\n<p>يتعرف محول الوحدات في التول بوكس القديم على الفرق من أسماء تحتوي Range أو Trend أو Anom أو Diff. أسماء LST_minus_T_* لا تحقق هذا الشرط؛ لذا يضيف التحويل الحالي إلى Fahrenheit/Kelvin إزاحة الحرارة المطلقة لها بالخطأ. يصحح Desktop هذه الحقول صراحة بعد التحويل. لتفسير متسق لهذا الفرق بين الواجهتين استخدم Celsius إلى أن يصحح المحول القديم ويختبر كتعديل مستقل. إضافة الشرح هنا لا تغير الحسابات أو النتائج السابقة ضمنيًا.<\/p>\n<h3>قراءة الأعمدة المقربة<\/h3>\n<p>تستخدم الحسابات عمومًا المدخلات الداخلية غير المقربة ثم تقرب النتائج. يستثنى الفرق الشهري LST الموثق الذي يستخدم عمودي الحرارة الشهريين المقربين، وكذلك ملخصات الاتجاه/الشذوذ الشهرية التي تأخذ متوسط نتائجها الشهرية المقربة. قد لا تطابق قسمة أعمدة المطر وPET المقربة مؤشر الجفاف المحسوب داخليًا، خصوصًا مع تفاوت تغطية السنوات. احتفظ بالمدخلات الخام والتغطية.<\/p>\n<h3>مراجع الطرق ونطاق التنفيذ<\/h3>\n<p><a href=\"https://www.fao.org/4/x0490e/x0490e07.htm\">FAO-56: الإشعاع والحسابات المناخية<\/a>؛ <a href=\"https://www.wpc.ncep.noaa.gov/html/heatindex_equation.shtml\">NOAA/WPC: مؤشر Rothfusz<\/a>؛ <a href=\"https://www.weather.gov/safety/cold-wind-chill-chart\">NWS: برودة الرياح<\/a>؛ <a href=\"https://doi.org/10.1175/JAMC-D-11-0143.1\">Stull (2011): تقريب البصيلة الرطبة<\/a>. هذه مراجع للطرق وليست إقرارًا بتنفيذ كل معيار أو حارس صلاحية كاملًا. توثق صفحات المعادلات سلوك الكود الذي روجع في 18 أكتوبر 2026.<\/p>\n", "en_body": "<p>Derived indices are calculated in their prescribed internal units before output conversion. Changing a display unit must not put Fahrenheit into P&lt;2T or inches into De Martonne. A range, anomaly, slope or temperature difference is a delta, not an absolute temperature.<\/p>\n<table><tr><th>Quantity<\/th><th>Conversion from calculation unit<\/th><\/tr>\n<tr><td>Absolute temperature, °C<\/td><td>°F=1.8×°C+32; K=°C+273.15.<\/td><\/tr>\n<tr><td>Temperature delta, °C<\/td><td>°F delta=1.8×delta; K delta=delta. Applies to ranges, trends and anomalies; see the LST difference limitation below.<\/td><\/tr>\n<tr><td>Rainfall / PET / signed water difference, mm<\/td><td>inches=mm/25.4. Counts and percentages are not converted.<\/td><\/tr>\n<tr><td>Pressure, hPa<\/td><td>kPa=hPa/10; inHg=hPa×0.029530.<\/td><\/tr>\n<tr><td>Wind, m/s<\/td><td>km/h=m/s×3.6; knots=m/s×1.943844; mph=m/s×2.236936. Direction remains degrees.<\/td><\/tr>\n<tr><td>Solar, kWh/m²/day (total: kWh/m²/year)<\/td><td>MJ=value×3.6; Wh=value×1000; cal/cm² or Langley=value×85.9845; period denominator stays daily or annual as appropriate.<\/td><\/tr>\n<tr><td>RH/cloud, UV, aridity, dry months<\/td><td>Percent, source/estimated UV index, ratio/index, and number of months respectively. UNEP is not percent.<\/td><\/tr><\/table>\n<h3>Recorded implementation difference: LST minus air temperature<\/h3>\n<p>The legacy toolbox converter recognizes delta names containing Range, Trend, Anom or Diff. LST_minus_T_* does not match that rule: its Fahrenheit/Kelvin conversion currently adds the absolute offset incorrectly. Desktop explicitly corrects these LST difference fields after conversion. For consistent interpretation of this difference between the hosts, use Celsius until the legacy converter is separately corrected and verified. This documentation change does not silently change calculations or old output files.<\/p>\n<h3>Reading rounded columns<\/h3>\n<p>Calculations generally use unrounded internal inputs and then round output fields. The documented monthly LST difference is an exception using rounded monthly temperature columns; summary-of-monthly trend fields also average their already rounded monthly results. Rainfall totals may not reproduce a derived aridity ratio by dividing rounded exported columns, especially with unequal year coverage. Keep raw inputs and coverage information.<\/p>\n<h3>Method references and implementation scope<\/h3>\n<p><a href=\"https://www.fao.org/4/x0490e/x0490e07.htm\">FAO-56: radiation and meteorological calculations<\/a>; <a href=\"https://www.wpc.ncep.noaa.gov/html/heatindex_equation.shtml\">NOAA/WPC: Rothfusz heat index<\/a>; <a href=\"https://www.weather.gov/safety/cold-wind-chill-chart\">NWS: wind chill<\/a>; <a href=\"https://doi.org/10.1175/JAMC-D-11-0143.1\">Stull (2011): wet-bulb approximation<\/a>. These describe methods, not a claim that every standard or validity guard is fully implemented. The equation pages state the actual repository behavior reviewed on 18 October 2026.<\/p>\n"}, {"id": "formula-temperature", "ar": "معادلات: درجة حرارة الهواء", "en": "Equations: Temperature", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">T2M, T2M_MAX, T2M_MIN<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>C_m(X) = sum_y X[y,m] / n_m (valid years for calendar month m)<\/code><\/p><p dir=\"ltr\"><code>T_Annual_Mean = mean_m C_m(T2M)<\/code><\/p><p dir=\"ltr\"><code>T_Summer_Mean = mean(C_6, C_7, C_8)<\/code><\/p><p dir=\"ltr\"><code>T_Annual_Range = max_m C_m(T2M) - min_m C_m(T2M)<\/code><\/p><p dir=\"ltr\"><code>T_Annual_Max_Mean = mean_m C_m(T2M_MAX); T_Annual_Min_Mean = mean_m C_m(T2M_MIN)<\/code><\/p><p dir=\"ltr\"><code>T_Max_Summer_Month_Mean = max(C_6(T2M), C_7(T2M), C_8(T2M))<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>يجمع مرصاد بيانات T2M وT2M_MAX وT2M_MIN الشهرية حسب شهر التقويم عبر السنوات، ثم يحسب المتوسطات السنوية والفصلية دون ترجيحها بطول الشهر. العظمى والصغرى المصدرية ليستا أكبر وأصغر قيمة يومية خلال كامل الدراسة. حقل أقصى شهر صيفي يستخدم T2M، وليس T2M_MAX.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>الحساب العام يتجاهل الشهور المفقودة؛ قد تعطي دالة المتوسط قيمة من شهور جزئية. Desktop يطبق حارس السنوات الكاملة على الحقول السنوية، ومسار Temperature اليومي المباشر قد يستبدل الملخصات بمتوسط سنوات/فصول مكتملة. راجع صفحة تدفق الحساب للفروق.<\/p><h3>مثال محسوب<\/h3><p>إذا كانت الشهور الـ12 كلها 20°C، تكون T_Annual_Mean=20 وT_Annual_Range=0. إذا كانت متوسطات يونيو ويوليو وأغسطس 28 و30 و29، يكون T_Summer_Mean=29 وأقصى شهر صيفي=30.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>T_Annual_Max_Mean<\/code><\/td><td>متوسط الشهور المناخية لـT2M_MAX.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Annual_Min_Mean<\/code><\/td><td>متوسط الشهور المناخية لـT2M_MIN.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Autumn_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_December_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_February_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_January_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_July_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_June_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_March_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Max_Summer_Month_Mean<\/code><\/td><td>max(C_6(T2M),C_7(T2M),C_8(T2M))<\/td><\/tr><tr><td dir=\"ltr\"><code>T_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Min_Winter_Month_Mean<\/code><\/td><td>min(C_12(T2M),C_1(T2M),C_2(T2M))<\/td><\/tr><tr><td dir=\"ltr\"><code>T_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Winter_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_temperature_fields, seasonal_means_from_monthly, annual_temp_range<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">T2M, T2M_MAX, T2M_MIN<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>C_m(X) = sum_y X[y,m] / n_m (valid years for calendar month m)<\/code><\/p><p dir=\"ltr\"><code>T_Annual_Mean = mean_m C_m(T2M)<\/code><\/p><p dir=\"ltr\"><code>T_Summer_Mean = mean(C_6, C_7, C_8)<\/code><\/p><p dir=\"ltr\"><code>T_Annual_Range = max_m C_m(T2M) - min_m C_m(T2M)<\/code><\/p><p dir=\"ltr\"><code>T_Annual_Max_Mean = mean_m C_m(T2M_MAX); T_Annual_Min_Mean = mean_m C_m(T2M_MIN)<\/code><\/p><p dir=\"ltr\"><code>T_Max_Summer_Month_Mean = max(C_6(T2M), C_7(T2M), C_8(T2M))<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>Group monthly T2M, T2M_MAX and T2M_MIN by calendar month across years, then average the monthly climatology without month-length weighting. Source maximum/minimum variables are not the all-period daily extremes. The warmest summer-month field uses T2M, not T2M_MAX.<\/p><h3>Validity and missing-data rules<\/h3><p>The generic mean kernel skips missing months and can return a partial-month aggregate. Desktop applies a complete-year guard to annual fields, and direct daily Temperature can replace summaries with means of complete years/seasons. See calculation flow for these differences.<\/p><h3>Worked example<\/h3><p>Twelve monthly values of 20°C give T_Annual_Mean=20 and T_Annual_Range=0. June/July/August values 28, 30, 29 give T_Summer_Mean=29 and warmest summer-month mean=30.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>T_Annual_Max_Mean<\/code><\/td><td>Mean climatological months of T2M_MAX.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Annual_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Annual_Min_Mean<\/code><\/td><td>Mean climatological months of T2M_MIN.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_April_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_August_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Autumn_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_December_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_February_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_January_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_July_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_June_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_March_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Max_Summer_Month_Mean<\/code><\/td><td>max(C_6(T2M),C_7(T2M),C_8(T2M))<\/td><\/tr><tr><td dir=\"ltr\"><code>T_May_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Min_Winter_Month_Mean<\/code><\/td><td>min(C_12(T2M),C_1(T2M),C_2(T2M))<\/td><\/tr><tr><td dir=\"ltr\"><code>T_November_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_October_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_September_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Spring_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>T_Winter_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_temperature_fields, seasonal_means_from_monthly, annual_temp_range<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-lst", "ar": "معادلات: درجة حرارة سطح الأرض", "en": "Equations: Land Surface Temperature", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">TS, T2M<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>LST_Annual_Mean = mean_m C_m(TS)<\/code><\/p><p dir=\"ltr\"><code>LST_minus_T_Annual = round(mean_m C_m(TS) - mean_m C_m(T2M), 2)<\/code><\/p><p dir=\"ltr\"><code>LST_minus_T_January = round(round(C_1(TS),2) - round(C_1(T2M),2),2)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>المصدر TS هو حرارة سطح الأرض؛ يحسب له نفس تجميع المتوسطات والمدى. تحسب الفروق مع حرارة الهواء T2M بعد تجميع كل سلسلة، وليس باستنتاج حرارة الهواء من TS. الفرق الشهري يستخدم القيم الشهرية المقربة إلى منزلتين كما يفعل الكود.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>MODIS النهاري والليلي منفصلان، وقيمهما عينات سماء صافية وليست متوسط حرارة هواء أو رصدًا مستمرًا على مدار اليوم. غياب T2M يترك فرق السطح/الهواء NULL مع إمكان وجود LST. توجد ملاحظة تحويل وحدات خاصة بالفروق في صفحة الوحدات.<\/p><h3>مثال محسوب<\/h3><p>TS=28°C وT2M=20°C في كل شهر: LST_Annual_Mean=28 وLST_minus_T_Annual=8°C.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>LST_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_Autumn_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_December_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_February_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_January_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_July_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_June_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_March_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_Winter_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_Annual<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_April<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_August<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_Autumn<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_December<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_February<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_January<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_July<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_June<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_March<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_May<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_November<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_October<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_September<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_Spring<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_Summer<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_Winter<\/code><\/td><td>فرق متوسطات TS وT2M للفترة المحددة، تقريب منزلتين؛ الشهر يستخدم قيمتي الشهر المقربتين.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_point_fields, seasonal_means_from_monthly<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">TS, T2M<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>LST_Annual_Mean = mean_m C_m(TS)<\/code><\/p><p dir=\"ltr\"><code>LST_minus_T_Annual = round(mean_m C_m(TS) - mean_m C_m(T2M), 2)<\/code><\/p><p dir=\"ltr\"><code>LST_minus_T_January = round(round(C_1(TS),2) - round(C_1(T2M),2),2)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>TS is land-surface temperature and receives the common means/range aggregation. Differences subtract separately aggregated T2M air temperature; air temperature is not inferred from TS. Monthly differences use already rounded two-decimal monthly values, as implemented.<\/p><h3>Validity and missing-data rules<\/h3><p>MODIS day/night products are separate clear-sky samples, not air temperature or continuous all-day observations. Missing T2M leaves surface-air differences NULL while LST may exist. See the units page for a legacy difference-conversion limitation.<\/p><h3>Worked example<\/h3><p>TS=28°C and T2M=20°C in every month give LST_Annual_Mean=28 and LST_minus_T_Annual=8°C.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>LST_Annual_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_April_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_August_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_Autumn_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_December_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_February_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_January_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_July_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_June_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_March_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_May_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_November_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_October_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_September_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_Spring_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_Winter_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_Annual<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_April<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_August<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_Autumn<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_December<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_February<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_January<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_July<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_June<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_March<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_May<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_November<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_October<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_September<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_Spring<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_Summer<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><tr><td dir=\"ltr\"><code>LST_minus_T_Winter<\/code><\/td><td>Difference of TS and T2M means for the indicated period, rounded to two decimals; months use already rounded monthly values.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → compute_point_fields, seasonal_means_from_monthly<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-rain", "ar": "معادلات: الأمطار", "en": "Equations: Precipitation", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">PRECTOTCORR<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>P[y,m] = sum_d p[y,m,d] (complete daily month)<\/code><\/p><p dir=\"ltr\"><code>P[y,m] = monthly_rate_mm_per_day[y,m] * days(y,m) (NASA monthly rate only)<\/code><\/p><p dir=\"ltr\"><code>R_Annual_Mean = mean_complete_years(sum_m=1..12 P[y,m])<\/code><\/p><p dir=\"ltr\"><code>R_Winter_Mean = mean_complete_DJF_years(P[y,12]+P[y,1]+P[y,2])<\/code><\/p><p dir=\"ltr\"><code>R_January_Mean = round(mean_y P[y,1],2)<\/code><\/p><p dir=\"ltr\"><code>R_Annual_Range = max_m C_m(P) - min_m C_m(P)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>تحدد وحدة المصدر أولًا: القيم اليومية تجمع إلى مجموع شهر، ومعدل NASA الشهري مم/يوم يضرب مرة واحدة في أيام الشهر الفعلية. CHIRPS وCHELSA وTerraClimate توفر مجموعًا شهريًا، فلا تضربه في الأيام. الحقل السنوي متوسط مجاميع السنوات المكتملة، وليس متوسط شهور السنة ولا مجموع كل سنوات الدراسة.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>المطر المفقود ليس صفرًا. المجموع السنوي يحتاج 12 شهرًا صالحًا والفصل ثلاثة شهور. DJF يجمع ديسمبر ويناير وفبراير لنفس السنة المصدرة. R_Annual_Range هو مدى الشهور المناخية، وليس مدى المجاميع السنوية بين السنوات.<\/p><h3>مثال محسوب<\/h3><p>50 مم كل شهر تعطي 600 مم للسنة. معدل 2 مم/يوم في فبراير 2024 يعطي 58 مم؛ مجموع شهري جاهز مقداره 58 مم يبقى 58 مم.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>R_Annual_Mean<\/code><\/td><td>متوسط مجاميع المطر للسنوات/الفصول المكتملة فقط.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_April_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_August_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Autumn_Mean<\/code><\/td><td>متوسط مجاميع المطر للسنوات/الفصول المكتملة فقط.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_December_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_February_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_January_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_July_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_June_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_March_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_May_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_November_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_October_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_September_Mean<\/code><\/td><td>متوسط مجموع المطر لنفس الشهر عبر السنوات.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Spring_Mean<\/code><\/td><td>متوسط مجاميع المطر للسنوات/الفصول المكتملة فقط.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Summer_Mean<\/code><\/td><td>متوسط مجاميع المطر للسنوات/الفصول المكتملة فقط.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Winter_Mean<\/code><\/td><td>متوسط مجاميع المطر للسنوات/الفصول المكتملة فقط.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → monthly_precip_total_from_rate, seasonal_totals_from_monthly_totals, compute_point_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">PRECTOTCORR<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>P[y,m] = sum_d p[y,m,d] (complete daily month)<\/code><\/p><p dir=\"ltr\"><code>P[y,m] = monthly_rate_mm_per_day[y,m] * days(y,m) (NASA monthly rate only)<\/code><\/p><p dir=\"ltr\"><code>R_Annual_Mean = mean_complete_years(sum_m=1..12 P[y,m])<\/code><\/p><p dir=\"ltr\"><code>R_Winter_Mean = mean_complete_DJF_years(P[y,12]+P[y,1]+P[y,2])<\/code><\/p><p dir=\"ltr\"><code>R_January_Mean = round(mean_y P[y,1],2)<\/code><\/p><p dir=\"ltr\"><code>R_Annual_Range = max_m C_m(P) - min_m C_m(P)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>Identify the source unit first: sum daily rainfall to a monthly total; multiply a NASA monthly mm/day rate once by actual calendar days. CHIRPS, CHELSA and TerraClimate monthly totals must not be multiplied by days. The annual field averages complete-year totals; it is neither a monthly mean nor the grand total across study years.<\/p><h3>Validity and missing-data rules<\/h3><p>Missing rain is not zero. Annual totals require 12 valid months and seasonal totals all three months. DJF uses December/January/February of the same exported year. R_Annual_Range is the range of monthly climatology, not interannual annual-total range.<\/p><h3>Worked example<\/h3><p>50 mm each month gives 600 mm/year. A 2 mm/day rate in February 2024 gives 58 mm; an already monthly 58 mm total remains 58 mm.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>R_Annual_Mean<\/code><\/td><td>Mean rainfall totals of complete years/seasons only.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_April_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_August_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Autumn_Mean<\/code><\/td><td>Mean rainfall totals of complete years/seasons only.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_December_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_February_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_January_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_July_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_June_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_March_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_May_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_November_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_October_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_September_Mean<\/code><\/td><td>Mean rainfall total for that calendar month across years.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Spring_Mean<\/code><\/td><td>Mean rainfall totals of complete years/seasons only.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Summer_Mean<\/code><\/td><td>Mean rainfall totals of complete years/seasons only.<\/td><\/tr><tr><td dir=\"ltr\"><code>R_Winter_Mean<\/code><\/td><td>Mean rainfall totals of complete years/seasons only.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → monthly_precip_total_from_rate, seasonal_totals_from_monthly_totals, compute_point_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-sea-pressure", "ar": "معادلات: الضغط عند سطح البحر", "en": "Equations: Sea Level Pressure", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">SLP<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>SLP_hPa = 10 * SLP_kPa<\/code><\/p><p dir=\"ltr\"><code>PSL_Annual_Mean = mean_m C_m(SLP_hPa)<\/code><\/p><p dir=\"ltr\"><code>PSL_Annual_Range = max_m C_m(SLP_hPa) - min_m C_m(SLP_hPa)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>SLP متغير الضغط المصحح إلى مستوى البحر القادم من المصدر. يحوله مرصاد إلى hPa/mbar ثم يجمعه. اسم الحقل الناتج يبدأ PSL بينما رمز المدخل هو SLP. لا يحسب المحرك اختزال الضغط إلى مستوى البحر من ارتفاع المحطة.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>الدالة القديمة تلقائيًا تضرب القيمة في 10 عندما abs(value)&lt;200، وتبقي الأكبر كما هي؛ لذلك يجب ضبط وحدة المدخل في المحول قبل الحساب، لا استنتاجها من اسم عمود المستخدم.<\/p><h3>مثال محسوب<\/h3><p>SLP=101.3 kPa في كل شهر ينتج PSL_Annual_Mean=1013 hPa.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>PSL_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_Autumn_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_December_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_February_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_January_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_July_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_June_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_March_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_Winter_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → pressure_kpa_to_mbar, compute_point_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">SLP<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>SLP_hPa = 10 * SLP_kPa<\/code><\/p><p dir=\"ltr\"><code>PSL_Annual_Mean = mean_m C_m(SLP_hPa)<\/code><\/p><p dir=\"ltr\"><code>PSL_Annual_Range = max_m C_m(SLP_hPa) - min_m C_m(SLP_hPa)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>SLP is source-provided sea-level pressure. MIRSAD converts it to hPa/mbar and aggregates it. Output fields use PSL while the input code is SLP. The kernel does not derive sea-level reduction from station elevation.<\/p><h3>Validity and missing-data rules<\/h3><p>The legacy auto helper multiplies values with abs(value)&lt;200 by 10 and otherwise retains them. Adapters must normalize actual input units before the kernel; arbitrary user-column names do not establish units.<\/p><h3>Worked example<\/h3><p>SLP=101.3 kPa in every month gives PSL_Annual_Mean=1013 hPa.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>PSL_Annual_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_April_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_August_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_Autumn_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_December_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_February_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_January_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_July_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_June_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_March_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_May_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_November_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_October_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_September_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_Spring_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PSL_Winter_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → pressure_kpa_to_mbar, compute_point_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-surface-pressure", "ar": "معادلات: الضغط السطحي", "en": "Equations: Surface Pressure", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">PS<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>PS_hPa = 10 * PS_kPa<\/code><\/p><p dir=\"ltr\"><code>PS_Annual_Mean = mean_m C_m(PS_hPa)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>PS هو ضغط السطح عند موقع المصدر وليس SLP. تطبق وحدة hPa ثم المتوسطات والفصول والمدى، دون معادلة ارتفاع جديدة داخل المحرك.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>تنطبق قاعدة تحويل الضغط التلقائي وحدود الفقد والتغطية نفسها المذكورة في ضغط مستوى البحر.<\/p><h3>مثال محسوب<\/h3><p>PS=100 kPa ينتج PS_Annual_Mean=1000 hPa عند ثبات الشهور.<\/p><h3>ربط المعادلة بأسماء الأعمدة<\/h3><p>هذه مجموعة أعمدة الحساب الممكنة، مع تفعيل المدى الشهري. قد يخفي مرشح الحقول/الفصول وخيارات HI/WC بعضها؛ إدراج عمود هنا لا يعني تفعيله في كل تشغيل. الجداول الناتجة تحفظ القيم المحسوبة؛ لا يعيد مرصاد حساب المؤشر من Excel المقرب.<\/p><table><tr><th>العمود الفعلي<\/th><th>طريقة حسابه<\/th><\/tr><tr><td dir=\"ltr\"><code>PS_Annual_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_Annual_Range<\/code><\/td><td>أعلى قيمة شهرية مناخية ناقص أدناها؛ HI يستخدم Rothfusz، وET يستخدم PET الشهري.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_April_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_August_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_Autumn_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_December_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_February_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_January_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_July_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_June_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_March_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_May_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_November_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_October_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_September_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] بعد تحويل وحدة المدخل؛ ≥سنتين لنفس الشهر.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_Spring_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_Summer_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_Winter_Mean<\/code><\/td><td>متوسط شهر التقويم عبر السنوات، أو متوسط الشهور المناخية التابعة للفترة؛ HI/WC بعد تطبيق معادلتهما الشهرية.<\/td><\/tr><\/table><h3>مرجع التنفيذ<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → pressure_kpa_to_mbar, compute_point_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>المعادلات من النواة المشتركة. تجهيز البيانات، حراس التغطية، ترشيح الحقول والوحدات النهائية قد تختلف بين الواجهتين؛ لا تعني مشاركة النواة تطابق جميع ملفات الإخراج.<\/p>\n", "en_body": "<p><a href=\"#calculation-flow\">Symbols and calculation flow<\/a> · <a href=\"#calculation-units\">Units<\/a><\/p><h3>Source variables and dependencies<\/h3><p dir=\"ltr\">PS<\/p><p>These are normalized internal variable codes; the symbols link explains their meaning and units. Provider response or Daily column layouts can use different names.<\/p><h3>Equations implemented by the kernel<\/h3><p dir=\"ltr\"><code>PS_hPa = 10 * PS_kPa<\/code><\/p><p dir=\"ltr\"><code>PS_Annual_Mean = mean_m C_m(PS_hPa)<\/code><\/p><h3>How MIRSAD applies it<\/h3><p>PS is surface pressure at the source location, distinct from SLP. Convert to hPa, then compute means, seasons and range; the kernel applies no new elevation equation.<\/p><h3>Validity and missing-data rules<\/h3><p>The same auto pressure-unit conversion and missing/coverage rules as sea-level pressure apply.<\/p><h3>Worked example<\/h3><p>Constant PS=100 kPa gives PS_Annual_Mean=1000 hPa.<\/p><h3>Equation-to-output-column mapping<\/h3><p>This is the possible calculation field set with monthly ranges enabled. Field/season filters and HI/WC options can hide fields; listing a field does not enable it in every run. Outputs store calculated values; MIRSAD does not recalculate indices from rounded Excel cells.<\/p><table><tr><th>Actual field<\/th><th>Calculation<\/th><\/tr><tr><td dir=\"ltr\"><code>PS_Annual_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_Annual_Range<\/code><\/td><td>Maximum minus minimum climatological month; HI uses Rothfusz and ET uses monthly PET.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_April_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_April_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_August_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_August_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_Autumn_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_December_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_December_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_February_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_February_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_January_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_January_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_July_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_July_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_June_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_June_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_March_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_March_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_May_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_May_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_November_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_November_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_October_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_October_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_September_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_September_Range<\/code><\/td><td>max_y X[y,m]-min_y X[y,m] after input-unit transformation; ≥2 years for that month.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_Spring_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_Summer_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><tr><td dir=\"ltr\"><code>PS_Winter_Mean<\/code><\/td><td>Calendar-month mean across years, or mean climatological months in the indicated period; HI/WC follow monthly index evaluation.<\/td><\/tr><\/table><h3>Implementation reference<\/h3><p dir=\"ltr\">MIRSAD_Climate_Atlas_Generator_10_8.pyt → pressure_kpa_to_mbar, compute_point_fields<br>MIRSAD Desktop/src/mirsad_desktop/science.py<\/p><p>Equations come from the shared kernel. Input preparation, coverage guards, field filtering and final units can differ between hosts; a common kernel does not establish identical output files.<\/p>\n"}, {"id": "formula-wind", "ar": "معادلات: الرياح: السرعة والاتجاه", "en": "Equations: Wind", "group": "equations", "ar_body": "<p><a href=\"#calculation-flow\">الرموز وتدفق الحساب<\/a> · <a href=\"#calculation-units\">الوحدات<\/a><\/p><h3>متغيرات المصدر والتبعيات<\/h3><p dir=\"ltr\">WS10M, WD10M<\/p><p>المتغيرات المدرجة رموز داخلية معيارية؛ يشرح رابط الرموز معناها ووحداتها. قد يختلف اسم الحقل في استجابة المصدر أو صفوف Daily.<\/p><h3>المعادلات كما ينفذها المحرك<\/h3><p dir=\"ltr\"><code>W_Spd_Annual_Mean = mean_m C_m(WS10M)<\/code><\/p><p dir=\"ltr\"><code>S = mean_i sin(theta_i*pi/180); C = mean_i cos(theta_i*pi/180)<\/code><\/p><p dir=\"ltr\"><code>W_Dir = atan2(S,C)*180/pi mod 360<\/code><\/p><p dir=\"ltr\"><code>W_Spd_Annual_Range = max_m C_m(WS10M) - min_m C_m(WS10M)<\/code><\/p><h3>كيف يطبقها مرصاد<\/h3><p>سرعة WS10M تجمع حسابيًا، بينما الاتجاه WD10M يجمع دائريًا من مركبتي الجيب وجيب التمام. اتجاه السنة يستخدم كل الاتجاهات الشهرية الصالحة عبر السنوات؛ اتجاه الفصل يستخدم السجلات التي تنتمي شهورها لذلك الفصل. الأوزان متساوية وليست مرجحة بسرعة الرياح.<\/p><h3>شروط الصلاحية والفقد<\/h3><p>إذا لم توجد اتجاهات أو كانت مركبتا المتوسط أقل من 1e-12 تكون النتيجة NULL. لا تستخدم متوسط الزوايا الحسابي، ولا يطبق مدى خطي على الاتجاه. يجب تحويل الدرجات إلى radians داخل sin/cos.<\/p><h3>مثال محسوب<\/h3><p>350° و10° تعطيان اتجاهًا قرب 0° وليس 180°. الاتجاهان 90° و270° يتلاشيان ويعطيان NULL.<\/p><h
