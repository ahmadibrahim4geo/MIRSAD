name: Deterministic source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install independent runtime and legacy Excel test dependencies
        run: python -m pip install -r "MIRSAD Desktop/requirements.txt" -r tests/requirements.txt
      - name: Prepare shared scientific code, catalogue and help
        run: |
          python scripts/build_climate_source_catalogue.py
          python "MIRSAD Desktop/scripts/vendor_science.py"
          python "MIRSAD Desktop/scripts/prepare_assets.py"
          python "MIRSAD Desktop/scripts/build_user_guide.py"
      - name: Isolated legacy tests (ArcPy doubles are not native verification)
        run: python scripts/run_checks.py
      - name: Desktop deterministic tests
        run: python -m unittest discover -s "MIRSAD Desktop/tests" -v
      - name: Repository/help contracts
        run: python scripts/check_repository.py
